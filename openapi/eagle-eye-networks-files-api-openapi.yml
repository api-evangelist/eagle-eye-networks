openapi: 3.2.0
info:
  title: MEDIA Files API
  version: 3.0.0
  description: Operations about files.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Files
  description: Operations about files.
  externalDocs:
    description: More information about files.
    url: https://developerv3.eagleeyenetworks.com/docs
paths:
  /deletedFiles:
    get:
      tags:
      - Files
      description: Returns a list of deleted files.
      operationId: getTrash
      parameters:
      - $ref: '#/components/parameters/sort1'
      - $ref: '#/components/parameters/mimeType'
      - $ref: '#/components/parameters/mimeType__contains'
      - $ref: '#/components/parameters/createTimestamp__lte1'
      - $ref: '#/components/parameters/createTimestamp__gte1'
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedFileResponseSlim'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get trash
      x-summary-source: derived
  /deletedFiles/all:
    delete:
      tags:
      - Files
      description: Permanently delete all files in the recycle bin.
      operationId: deleteAllTrashFiles
      responses:
        '204':
          description: Permanently delete all files in the recycle bin.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete all trash files
      x-summary-source: derived
  /deletedFiles/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Files
      description: Get details of a recycled item.
      operationId: getTrashFile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFileGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get trash file
      x-summary-source: derived
    delete:
      tags:
      - Files
      description: Permanently delete an item by ID.
      operationId: deleteTrashFile
      responses:
        '204':
          description: File deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete trash file
      x-summary-source: derived
  /deletedFiles/{id}:restore:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Files
      description: Restore a recycled item by ID.
      operationId: restoreTrashFile
      responses:
        '201':
          description: File restored.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Restore trash file
      x-summary-source: derived
  /files:
    get:
      tags:
      - Files
      description: Returns a list of archived items.
      operationId: getFiles
      parameters:
      - $ref: '#/components/parameters/sort1'
      - $ref: '#/components/parameters/mimeType'
      - $ref: '#/components/parameters/mimeType__contains'
      - $ref: '#/components/parameters/createTimestamp__lte1'
      - $ref: '#/components/parameters/createTimestamp__gte1'
      - $ref: '#/components/parameters/directory'
      - $ref: '#/components/parameters/directory__contains'
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/notes__contains'
      - $ref: '#/components/parameters/size__lte'
      - $ref: '#/components/parameters/size__gte'
      - $ref: '#/components/parameters/include3'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedFileResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get files
      x-summary-source: derived
    post:
      tags:
      - Files
      description: Add a new file to the archive. If the directory specified does not exist, it will automatically be created. To create a new empty directory, specify the desired name, parent directory and a mimeType of `application/directory`.
      operationId: addFile
      parameters:
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/directory'
      - $ref: '#/components/parameters/mimeType'
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/directory: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFileGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add file
      x-summary-source: derived
  /files/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Files
      description: Gets details of a file based on its ID.
      operationId: getFile
      parameters:
      - $ref: '#/components/parameters/include3'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFileGetWithIncludes'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get file
      x-summary-source: derived
    patch:
      tags:
      - Files
      description: Modifies the details of an item.
      operationId: updateFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiFileCreateWithIncludes'
      responses:
        '204':
          description: File Updated.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update file
      x-summary-source: derived
    delete:
      tags:
      - Files
      description: Recycles an item by ID.
      operationId: deleteFile
      responses:
        '204':
          description: File moved to recycle bin.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete file
      x-summary-source: derived
  /files/{id}:download:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Files
      description: Download file or folder by ID.
      operationId: downloadFile
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Video North Door 2022-08-03 23-04-50.mp4"
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Download file
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    notes:
      type: string
      description: User entered annotations.
      example: Kids throwing rocks.
      readOnly: false
    directory:
      type: string
      description: Name of the parent directory.
      example: /Bundles/North Door
      readOnly: false
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    metadata:
      type: object
      description: Custom metadata associated with the file.
      additionalProperties:
        type: string
    fileDetails:
      oneOf:
      - $ref: '#/components/schemas/exportFileDetails'
      discriminator:
        propertyName: type
        mapping:
          exportFileDetails: '#/components/schemas/exportFileDetails'
    ApiFileMain:
      description: A file object.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        directory:
          $ref: '#/components/schemas/directory'
        mimeType:
          $ref: '#/components/schemas/mimeType'
        name:
          $ref: '#/components/schemas/name'
    ApiPaginatedFileResponse:
      description: A paginated response containing a list of files with optional fields.
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiFileGetWithIncludes'
    ApiPaginatedFileResponseSlim:
      description: A paginated response containing a list of files.
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiFileMain'
    Permissions:
      description: Permissions for a file object.
      type: object
      properties:
        write:
          readOnly: false
          type: boolean
          description: Allows public users to modify file metadata.
          example: true
    ApiFileCreateWithIncludes:
      allOf:
      - $ref: '#/components/schemas/ApiFileWithIncludes'
      required:
      - name
    name:
      type: string
      description: Name of the item.
      example: Video North Door 2022-08-03 23-04-50.mp4
      readOnly: false
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    mimeType:
      type: string
      description: The media content type.
      example: video/mp4
      readOnly: true
      enum:
      - video/mp4
      - application/directory
    id:
      type: string
      description: The ID of the item.
      format: uuid
      example: 123e4567-e89b-12d3-a456-426655440000
      readOnly: true
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    timestamp1:
      type: string
      description: Date and time when the item was created.
      format: date-time
      example: '2021-04-22T00:00:00.000Z'
      readOnly: true
    ApiFileGet:
      allOf:
      - $ref: '#/components/schemas/ApiFileMain'
      required:
      - id
      - directory
      - mimeType
      - name
    tags:
      description: List of tags associated with the file.
      type: array
      items:
        type: string
      example:
      - family
      - vacation
    size:
      type: integer
      description: Size of the file in Bytes.
      example: 4242194
      readOnly: true
    PublicShare:
      description: Public share properties.
      type: object
      properties:
        accountId:
          description: The account ID of the public share.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/accountId'
        createTimestamp:
          readOnly: true
          description: Date and time when the item was shared.
          allOf:
          - $ref: '#/components/schemas/timestamp1'
        expireTimestamp:
          description: Date and time when the item sharing link will expire. Public access will not be available after this time.
          readOnly: false
          allOf:
          - $ref: '#/components/schemas/timestamp1'
        id:
          description: Public share ID.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/id'
        active:
          $ref: '#/components/schemas/active'
        permissions:
          allOf:
          - $ref: '#/components/schemas/Permissions'
        password:
          readOnly: false
          type: string
          description: Password for public access. If unset, the password field will return an empty string. If set, the password salt and hash will be returned. When updating or setting a password, a minimum of six characters are required.
          example: my-super-secret-password!
        url:
          readOnly: true
          type: string
          description: Public share URL.
          example: https://api.cxxx.eagleeyenetworks.com/api/v3.0/files/123e4567-e89b-12d3-a456-426655440000/publicShare
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    accountId:
      type: string
      description: Account ID specified in as an ESN Type.
      example: '00001106'
    ApiFileWithIncludes:
      description: A file object with optional fields.
      type: object
      allOf:
      - $ref: '#/components/schemas/ApiFileMain'
      properties:
        accountId:
          $ref: '#/components/schemas/accountId'
        publicShare:
          $ref: '#/components/schemas/PublicShare'
        notes:
          allOf:
          - $ref: '#/components/schemas/notes'
        createTimestamp:
          description: Date and time when the item was created.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/timestamp1'
        updateTimestamp:
          description: Date and time when the item was last updated.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/timestamp1'
        size:
          allOf:
          - $ref: '#/components/schemas/size'
        metadata:
          $ref: '#/components/schemas/metadata'
        tags:
          $ref: '#/components/schemas/tags'
        childCount:
          $ref: '#/components/schemas/childCount'
        details:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/fileDetails'
    exportFileDetails:
      description: Extra information about the parameters used to create the exported file
      required:
      - type
      - deviceId
      - startTimestamp
      - endTimestamp
      properties:
        type:
          type: string
          enum:
          - exportFileDetails
        deviceId:
          type: string
          description: ID of the source device for the export.
          example: 100fabcd
        jobId:
          type: string
          format: uuid
          description: ID of the export job that created the file.
          example: c22d98cc-3008-4cbc-b06d-79759dd0c62f
        videoType:
          type: string
          description: Type of video generated by the export. Normal video of the main video stream, or a time lapse of the preview stream.
          enum:
          - video
          - timeLapse
        startTimestamp:
          type: string
          format: date-time
          description: Start timestamp of the export.
          example: '2021-03-19T09:08:07.542Z'
        endTimestamp:
          type: string
          format: date-time
          description: End timestamp of the export.
          example: '2021-03-19T15:08:07.542Z'
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    name1:
      type: string
      description: Name of the item.
      example: Video North Door 2022-08-03 23-04-50.mp4
      readOnly: false
      minLength: 1
      maxLength: 128
    active:
      type: boolean
      description: Boolean representing if a public share is active.
      readOnly: false
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    ApiFileGetWithIncludes:
      allOf:
      - $ref: '#/components/schemas/ApiFileWithIncludes'
      required:
      - id
      - directory
      - mimeType
      - name
    PaginatedResponse:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages and, if  available, the total number of results.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken.  This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken.  This value can be null of there is no previous page.

            '
        totalSize:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: 'The number of resource entries being returned from the result set.  This can be omitted if the API endpoint does not have total size information.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    childCount:
      type: integer
      description: Count of child folders within the directory.
      example: 3
  parameters:
    directory__contains:
      in: query
      required: false
      name: directory__contains
      description: Item directory contains filter.
      example: /Bundles
      schema:
        $ref: '#/components/schemas/directory'
    mimeType:
      in: query
      name: mimeType
      description: Exact content type.
      example: application/directory
      schema:
        $ref: '#/components/schemas/mimeType'
    notes__contains:
      in: query
      required: false
      name: notes__contains
      description: Notes filter.
      example: throwing rocks
      schema:
        $ref: '#/components/schemas/notes'
    mimeType__contains:
      in: query
      name: mimeType__contains
      description: Content type contains filter.
      example: video/mp4
      schema:
        $ref: '#/components/schemas/mimeType'
    id:
      in: path
      name: id
      description: Item ID.
      required: true
      schema:
        $ref: '#/components/schemas/id'
    createTimestamp__lte1:
      in: query
      name: createTimestamp__lte
      required: false
      description: Maximum timestamp for file creation date.
      schema:
        $ref: '#/components/schemas/timestamp1'
    include3:
      in: query
      name: include
      required: false
      description: The fields you want included in the response. If not specified, the response includes a default set of fields specific to this method. You can use the special value * during development to return all fields, however, to achieve better performance, it is advisable to explicitly select only the fields you need.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - accountId
          - publicShare
          - notes
          - createTimestamp
          - updateTimestamp
          - size
          - metadata
          - tags
          - childCount
          - details
        example:
        - accountId
        - publicShare
        - notes
        - createTimestamp
        - updateTimestamp
        - size
        - metadata
        - tags
        - childCount
        - details
    createTimestamp__gte1:
      in: query
      name: createTimestamp__gte
      description: Minimum timestamp for file creation date.
      required: false
      schema:
        $ref: '#/components/schemas/timestamp1'
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    name:
      in: query
      required: false
      name: name
      description: Exact name of the item.
