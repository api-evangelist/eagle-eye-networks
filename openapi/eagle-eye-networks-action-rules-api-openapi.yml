      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    ContextImageItem:
      type: object
      description: Configuration for one context image at a specific second offset from the event timestamp.
      required:
      - offsetSeconds
      properties:
        offsetSeconds:
          type: integer
          enum:
          - -5
          - -4
          - -3
          - -2
          - -1
          - 1
          - 2
          - 3
          - 4
          - 5
          description: 'Seconds relative to the event timestamp. Negative values are before the event, positive values are after. 0 is excluded — that is the alert image itself (configured in alertImage). Valid range: -5 to +5 excluding 0.

            '
        imageType:
          type: string
          enum:
          - full
          default: full
          description: Image type. Only "full" is supported currently.
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    AlertActionRules:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/AlertActionRule'
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    AlertImageConfig:
      type: object
      description: Configuration for the primary alert image. Always included when imageOptions is set; cannot be disabled.
      properties:
        embeddedOverlay:
          type: boolean
          default: true
          description: 'Use the overlay-embedded full-frame image. Falls back to the plain full-frame image if the overlay version is unavailable in alert.data.

            '
        includeCropUrl:
          type: boolean
          default: false
          description: 'Also attach the cropped detection-region image. Silently skipped if the crop URL is not present in alert.data.

            '
    AlertActionRuleUpdate:
      type: object
      properties:
        id:
          description: Unique identifier of the alert action rule.
          type: string
          readOnly: true
          example: 322d38b9-8ed7-41b5-a57d-3fe9f160939c
        createTimestamp:
          description: Time at which the alert action rule was created.
          type: string
          format: date-time
          readOnly: true
          example: '2021-04-22T00:00:00.000+00:00'
        name:
          description: Name to let humans easily identify and understand the alert action rule.
          type: string
          example: Cameras offline for 5 min.
        notes:
          description: Large text field that allows users to leave notes for themselves and others.
          type: string
          example: Take action if cameras are offline for more than 5 minutes.
        enabled:
          description: If set to true, this rule is active, if set to false, it will not be applied.
          type: boolean
          example: true
          default: true
        alertTypes:
          description: If defined, this rule will only trigger on alerts of the given types.
          type:
          - array
          - 'null'
          items:
            type: string
            example: userLogin
          minLength: 1
        actorIds:
          description: If defined, this rule will only trigger on alerts about actors with the given ids.
          type:
          - array
          - 'null'
          items:
            type: string
          minLength: 1
        actorTypes:
          description: If defined, this rule will only trigger on alerts about actors of the given types.
          type:
          - array
          - 'null'
          items:
            type: string
            example: device
          minLength: 1
        actorAccountIds:
          description: If defined, this rule will only trigger on alerts about actors from the given accounts.
          type:
          - array
          - 'null'
          items:
            type: string
          minLength: 1
        ruleIds:
          description: 'If defined, this rule will only trigger on alerts that were generated by one of the given alert condition

            rules.

            '
          type:
          - array
          - 'null'
          items:
            type: string
            example: d290f1ee-6c54-4b01-90e6-d701748f0851
          minLength: 1
        priority__gte:
          description: 'If defined, this rule will only trigger on alerts with a priority greater than or equal to the given value.

            '
          type:
          - integer
          - 'null'
          example: 3
        priority__lte:
          description: 'If defined, this rule will only trigger on alerts with a priority less than or equal to the given value.

            '
          type:
          - integer
          - 'null'
          example: 8
        alertActionIds:
          description: Defines the actions to take if an alert matches the rule.
          type: array
          items:
            type: string
            example: f3436b61-94fd-41b6-8f0a-ee6ff55acaa6
        locationIds:
          description: If defined, this rule will only trigger on alerts about actors from the given locations.
          type:
          - array
          - 'null'
          items:
            type: string
          minLength: 1
        imageOptions:
          allOf:
          - $ref: '#/components/schemas/ImageOptions'
          default: null
          description: 'Image attachment configuration for this rule. When null, the existing single-image behaviour is used unchanged. When set, all actions linked to this rule will receive images resolved from alert.data URLs (images are resolved from alert.data URLs). Maximum 6 images total per execution. Currently applied to SMTP and Immix actions.

            '
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ImageOptions:
      type: object
      description: 'Image attachment configuration for an alert action rule. Defines which images are attached when the rule fires. Maximum 6 images total per execution: 1 alert image + 1 optional crop + up to 4 context images.

        '
      required:
      - alertImage
      properties:
        alertImage:
          $ref: '#/components/schemas/AlertImageConfig'
        contextImages:
          type: array
          description: 'Ordered list of additional context images. Each item specifies one image at an explicit second offset from the event timestamp. Offsets must be unique; 0 is excluded (that is the alert image itself).

            '
          default: []
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ContextImageItem'
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    AlertActionRule:
      allOf:
      - $ref: '#/components/schemas/AlertActionRuleUpdate'
      - required:
        - name
    PaginatedResponse:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages and, if  available, the total number of results.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken.  This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken.  This value can be null of there is no previous page.

            '
        totalSize:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: 'The number of resource entries being returned from the result set.  This can be omitted if the API endpoint does not have total size information.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    AlertActionRuleCreate:
      allOf:
      - $ref: '#/components/schemas/AlertActionRuleUpdate'
      - required:
        - name
        - alertActionIds
