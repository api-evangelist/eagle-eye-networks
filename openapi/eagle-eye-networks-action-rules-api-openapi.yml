openapi: 3.2.0
info:
  title: AUTOMATIONS Action Rules API
  version: 3.0.0
  description: Describe when an alert should trigger an automated action.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Action Rules
  description: Describe when an alert should trigger an automated action.
paths:
  /alertActionRules:
    post:
      operationId: addAlertActionRule
      description: Registers a new alert action rule with the account. These rules allow users to link alert action rules to alert condition rule.
      tags:
      - Action Rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertActionRuleCreate'
      responses:
        '201':
          description: Alert action rule registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionRule'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
      summary: Add alert action rule
      x-summary-source: derived
    get:
      tags:
      - Action Rules
      operationId: listAlertActionRules
      description: List the configured action rules.
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Alert action rule results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionRules'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List alert action rules
      x-summary-source: derived
  /alertActionRules/{actionRuleId}:
    parameters:
    - in: path
      name: actionRuleId
      schema:
        type: string
      required: true
    get:
      operationId: getAlertActionRule
      description: Retrieve a single alert action rule.
      tags:
      - Action Rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionRule'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get alert action rule
      x-summary-source: derived
    patch:
      operationId: updateAlertActionRule
      description: Update single alert action rule.
      tags:
      - Action Rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertActionRuleUpdate'
      responses:
        '204':
          description: Alert Condition Rule Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update alert action rule
      x-summary-source: derived
    delete:
      operationId: deleteAlertActionRule
      description: Removes alert action rule.
      tags:
      - Action Rules
      responses:
        '204':
          description: Alert action rule deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete alert action rule
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
