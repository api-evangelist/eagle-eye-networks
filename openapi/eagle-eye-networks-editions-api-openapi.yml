openapi: 3.2.0
info:
  title: USER & ACCOUNTS Editions API
  version: 3.0.0
  description: Retrieve information on editions available to the account.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Editions
  description: Retrieve information on editions available to the account.
paths:
  /editions:
    get:
      operationId: getEditions
      description: 'This endpoint allows you to retrieve a list of the editions that are available for your account.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available editions, not the number of editions resulting from the query string.'
      tags:
      - Editions
      parameters:
      - $ref: '#/components/parameters/accountId2'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEditionResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get editions
      x-summary-source: derived
  /editions/{id}:
    get:
      operationId: getEdition
      description: This endpoint allows you to retrieve a specific edition by its ID.
      tags:
      - Editions
      parameters:
      - $ref: '#/components/parameters/id1'
      responses:
        '200':
          description: Successfully authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get edition
      x-summary-source: derived
