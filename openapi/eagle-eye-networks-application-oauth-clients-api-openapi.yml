openapi: 3.2.0
info:
  title: SYSTEM Application OAuth Clients API
  version: 3.0.0
  description: Registered OAuth clients that represent the application.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Application OAuth Clients
  description: Registered OAuth clients that represent the application.
paths:
  /applications/{applicationId}/oauthClients:
    parameters:
    - $ref: '#/components/parameters/applicationId'
    get:
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      description: 'This endpoint allows retrieval of all OAuth credentials for the given application.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available OAuth credentials, not the number of OAuth credentials resulting from the query string.'
      operationId: getOauthClients
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedOauthClientResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '406':
          $ref: '#/components/responses/notAcceptableError'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Application OAuth Clients
      summary: Get oauth clients
      x-summary-source: derived
    post:
      description: This endpoint allows you to create a new OAuth client for the given application. A maximum of 250 oauth client credentials can be created under the application.
      operationId: addOauthClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationOauthClientCreate'
            examples:
              legacyUserLevelClient:
                summary: User-Level Client (Legacy - without authorizationType)
                description: Legacy request format without authorizationType field. Defaults to user-level. For backward compatibility with existing integrations.
                value:
                  name: Web Application Client
                  type: confidential
                  redirectUris:
                  - https://myapp.com/oauth/callback
              userLevelPublicClient:
                summary: User-Level Public OAuth Client
                description: User-level client with public type. Explicitly sets authorizationType to "user". Scopes are automatically set to ["vms.all"].
                value:
                  name: Mobile App Client
                  type: public
                  authorizationType: user
                  redirectUris:
                  - myapp://oauth/callback
              applicationLevelClient:
                summary: Application-Level OAuth Client
                description: Application-level client with customizable permissions. The permissions object must be provided with boolean flags for each permission.
                value:
                  name: Integration Service Account
                  type: confidential
                  authorizationType: application
                  redirectUris:
                  - https://integration.example.com/callback
                  permissions:
                    viewLiveVideo: true
                    viewHistoricVideo: true
                    downloadVideo: true
                    viewArchive: true
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOauthClient'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '406':
          $ref: '#/components/responses/notAcceptableError'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Application OAuth Clients
      summary: Add oauth client
      x-summary-source: derived
  /applications/{applicationId}/oauthClients/{clientId}:
    parameters:
    - $ref: '#/components/parameters/applicationId'
    - $ref: '#/components/parameters/clientId'
    get:
      description: This endpoint allows you to retrieve a specific OAuth client.
      operationId: getOauthClient
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOauthClient'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '406':
          $ref: '#/components/responses/notAcceptableError'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Application OAuth Clients
      summary: Get oauth client
      x-summary-source: derived
    patch:
      description: 'This endpoint allows you to update a specific OAuth client. Note: Permissions can only be updated for application-level clients.'
      tags:
      - Application OAuth Clients
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationOauthClientUpdate'
            examples:
              updateUserLevelClient:
                summary: Update User-Level Client
                description: For user-level clients, you can update name, redirectUris, and loginUris, but not permissions
                value:
                  name: Updated Web Application Client
                  redirectUris:
                  - https://myapp.com/oauth/callback
                  - https://myapp.com/oauth/callback2
              updateApplicationLevelClient:
                summary: Update Application-Level Client
                description: For application-level clients, you can also update permissions using boolean flags
                value:
                  name: Updated Integration Service Account
                  redirectUris:
                  - https://integration.example.com/callback
                  permissions:
                    viewLiveVideo: true
                    viewHistoricVideo: true
                    downloadVideo: true
                    editArchive: true
                    viewAuditLog: true
      responses:
        '204':
          description: Client Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update client
      x-summary-source: derived
    delete:
      description: This endpoint allows you to delete a specific OAuth client of a given application.
      operationId: deleteOauthClient
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '406':
          $ref: '#/components/responses/notAcceptableError'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Application OAuth Clients
      summary: Delete oauth client
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    AdminPermission:
      properties:
        administrator:
          type: boolean
          x-jsoninclude-nonnull-annotation: true
          description: 'All permissions are enabled - create, delete, edit, and view access to all accounts and user settings, bridges, cameras, layouts, audit log and archive.

            '
    ApplicationOauthClientCreate:
      description: 'Request body for creating a new OAuth client. The authorizationType determines permission behavior: - user (default if omitted): Scopes are automatically set to ["vms.all"], no permissions can be specified - application: Permissions must be explicitly provided as an object with boolean flags

        For backward compatibility, if authorizationType is not provided, it defaults to "user".

        '
      oneOf:
      - $ref: '#/components/schemas/UserLevelClientCreate'
      - $ref: '#/components/schemas/ApplicationLevelClientCreate'
      discriminator:
        propertyName: authorizationType
        mapping:
          user: '#/components/schemas/UserLevelClientCreate'
          application: '#/components/schemas/ApplicationLevelClientCreate'
    OauthClientCreateBase:
      type: object
      description: Base properties for OAuth client creation
      properties:
        name:
          type: string
          description: Name of the oauth client.
          example: client-name
          minLength: 1
          maxLength: 256
        type:
          type: string
          description: 'The type of OAuth client. - public: Basic OAuth client - confidential: OAuth client with optional loginUris support

            '
          enum:
          - public
          - confidential
          default: confidential
          example: confidential
        redirectUris:
          type: array
          items:
            type: string
            description: List of allowed redirect URIs support by the client.
            format: uri
          example:
          - https://google.co.in/
          - https://google.nl/
          minItems: 1
          maxItems: 250
        loginUris:
          type: array
          items:
            type: string
            description: List of allowed login URIs support by the client. Redirecting to this URL will generate a new authentication request.
            format: uri
          example:
          - https://sample.com/login
          - https://sample.nl/login
          maxItems: 250
      required:
      - name
      - redirectUris
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    Permissions:
      allOf:
      - $ref: '#/components/schemas/AdminPermission'
      - type: object
        properties:
          editAccounts:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit Control, Days, Security, Camera, Alerts, Notifications, Privacy, Sharing, Responders, Default retentions, and camera resolution settings.

              '
          layoutAdministrator:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Create, delete and edit any accessible layouts. All user layouts are visible to admin users.

              '
          createLayouts:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Ability to create layouts and edit the layouts created. This does not grant permission to edit layouts created by other users.

              '
          editNoBillingDeviceSettings:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit Camera Settings except for Cloud Retention and Full Video Resolution. Cannot add or delete cameras. Edit existing Analytics. Cannot add or delete Analytics.

              '
          turnCamerasOnOff:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Turn Cameras on/off. Cameras off cannot be recorded.
          editMotionAreas:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit Motion Settings. Set object size and sensitivity, add/delete regions, add/delete alerts for regions. Edit existing Analytics. Set object size and sensitivity, add/delete alerts.

              '
          editAllCameraSettings:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Editing all Camera Settings. Cannot add or delete cameras.
          editUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Create, delete and edit non-admin users in an end user account.
          upgradeEdition:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Upgrade current edition subscription to a higher level edition.
          addEditBridgesCameras:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Create, delete, edit, and view Bridges and Cameras. This is the only permission for a non-admin to be able to add and view bridges in an end user account.

              '
          editSharing:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit Sharing and Responders settings.
          controlPTZ:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Control Pan, Tilt, Zoom, & recall stations while viewing a preview or live video of PTZ cameras.

              '
          editPTZStations:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit PTZ Settings. Set PTZ mode and create, delete, edit stations.

              '
          addEditSpeakers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add speakers, edit speaker settings, delete speakers.
          editSpeakers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit speaker settings. Cannot add or delete speakers.
          viewLiveVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View full resolution video live.
          viewHistoricVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View history browser and historic video.
          downloadVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Download preview and full resolution video.
          viewPreviewVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View preview images from cameras.
          talkDown:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Allows the users to initiate Talk Down to the camera field(s) of view.
          editMap:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add and edit floors, lines, shapes, and cameras on the map.
          viewAuditLog:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View Audit Log and download reports from it.
          viewArchive:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View all files and folders within the Archive.
          editArchive:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Save videos to Archive - delete, edit, and view files and folders within the Archive.
          viewPlugins:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View all Plugins.
          editPlugins:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add and remove plugins.
          exportUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Export a list of account users in .csv format.
          viewVSP:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: User access to view vehicle data, search vehicle across camera & location, set rules, and alert.
          editResellerUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Create, delete and edit reseller user who is not an Admin.
          editAdminUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Create, delete and edit admin and non-admin users in an end user account. Give access to bridges, cameras, and layouts. Create new end user accounts and give access to them.

              '
          viewContract:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View recordings, search, and create new recordings.
          addRemovePayment:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add and remove payment methods.
          viewInvoice:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View and download invoices.
          placeOrders:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add products to the shopping cart and place orders.
          viewShipments:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View the status of shipments.
          viewPricingInformation:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View pricing information.
          viewResellerProgramInformation:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View Marketing's reseller program information.
          viewVSPRule:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View VSP rules.
          editVSPRule:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit VSP rules.
          viewVehicleList:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View vehicle lists.
          editVehicleList:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit vehicle lists.
          viewAutomations:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View automation alerts, rules, and actions.
          editAutomations:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit automation alerts, rules, and actions.
          editAlertManagerRulesAndActions:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit Automations rules and actions.
          viewAlertManagerRulesAndActions:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View Alert Manager rules and actions.
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ApiPaginatedOauthClientResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApplicationOauthClient'
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    UserLevelClientResponse:
      allOf:
      - $ref: '#/components/schemas/OauthClientResponseBase'
      - type: object
        properties:
          authorizationType:
            type: string
            enum:
            - user
            description: 'Client operates on behalf of the authenticating user. Permissions and access are tied to that user''s account. If the user is deleted, blocked, or has permissions changed, the client''s access is affected accordingly. Scopes are automatically set to ["vms.all"].

              '
            example: user
          scopes:
            type: array
            description: List of scopes granted to this OAuth client.
            items:
              type: string
            example:
            - vms.all
        required:
        - authorizationType
        - scopes
      description: Response schema for user-level OAuth clients. Scopes are ["vms.all"] and no permissions object is present.
    OauthClientResponseBase:
      type: object
      description: Base properties for OAuth client responses
      properties:
        id:
          maxLength: 255
          type: string
          description: Unique client identifier
          example: e005968e714911eda1eb0242ac120002
        secret:
          maxLength: 255
          type: string
          description: String representing a secret passphrase.
          example: NnjRRTOYAlGpqedN65OLf4sPMFH8kGbG
        name:
          type: string
          description: Name of the oauth client.
          example: client-name
          minLength: 1
          maxLength: 256
        type:
          type: string
          description: The type of this OAuth client
          enum:
          - public
          - confidential
          example: confidential
        redirectUris:
          type: array
          items:
            type: string
            description: List of allowed redirect URIs support by the client.
            format: uri
          example:
          - https://google.co.in/
          - https://google.nl/
          minItems: 1
          maxItems: 250
        loginUris:
          type: array
          items:
            type: string
            description: List of allowed login URIs support by the client.
            format: uri
          example:
          - https://sample.com/login
          - https://sample.nl/login
          maxItems: 250
      required:
      - id
      - secret
      - name
      - type
      - redirectUris
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ApplicationLevelClientResponse:
      allOf:
      - $ref: '#/components/schemas/OauthClientResponseBase'
      - type: object
        properties:
          authorizationType:
            type: string
            enum:
            - application
            description: 'Client operates as an independent service account with its own permissions. Access is not tied to any specific user and persists regardless of user changes. Permissions must be explicitly configured.

              '
            example: application
          permissions:
            $ref: '#/components/schemas/Permissions'
        required:
        - authorizationType
        - permissions
      description: Response schema for application-level OAuth clients. Includes permissions object with boolean flags.
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    ApplicationOauthClientUpdate:
      type: object
      description: "Request body for oauth client update.\nAll fields are optional - only include the fields you want to update.\nThe allowed fields depend on the existing client's authorizationType (which cannot be changed): - User-level clients: Can update name, redirectUris, and loginUris - Application-level clients: Can update name, redirectUris, loginUris, and permissions\n  Permission updates can only ADD new permissions. Existing permissions cannot be removed through updates. \n  To remove permissions, you must delete and recreate the client.\n\nNote: The permissions field is ONLY valid for application-level clients. If included for a user-level client, the request will be rejected by the server.\n"
      properties:
        name:
          type: string
          description: Name of the oauth client.
          example: client-name
          minLength: 1
          maxLength: 256
        redirectUris:
          type: array
          items:
            type: string
            description: List of allowed redirect URIs support by the client.
            format: uri
          example:
          - https://google.co.in/
          - https://google.nl/
          minItems: 1
          maxItems: 250
        loginUris:
          type: array
          items:
            type: string
            description: List of allowed login URIs support by the client. Redirecting to this URL will generate a new authentication request.
            format: uri
          example:
          - https://sample.com/login
          - https://sample.nl/login
          maxItems: 250
        permissions:
          allOf:
          - $ref: '#/components/schemas/Permissions'
          - description: 'Permissions object with boolean flags for each permission. ONLY valid for application-level clients - will be rejected for user-level clients. Optional - only include if you want to update permissions.

              '
    ApplicationLevelClientCreate:
      allOf:
      - $ref: '#/components/schemas/OauthClientCreateBase'
      - type: object
        properties:
          authorizationType:
            type: string
            enum:
            - application
