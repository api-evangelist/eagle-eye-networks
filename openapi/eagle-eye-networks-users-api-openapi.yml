openapi: 3.2.0
info:
  title: USER & ACCOUNTS Users API
  version: 3.0.0
  description: Core operations on users in the current account.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Users
  description: Core operations on users in the current account.
paths:
  /users:
    get:
      operationId: getUsers
      description: 'This endpoint allows the users to retrieve a list of users within the account. This endpoint supports filtering, pagination, and sorting, as well as including additional information with the response.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available users, not the number of users resulting from the query string.'
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/includeForList'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/id__notIn'
      - $ref: '#/components/parameters/locationId__in'
      - $ref: '#/components/parameters/locationId__ne'
      - $ref: '#/components/parameters/firstName__in'
      - $ref: '#/components/parameters/firstName__contains'
      - $ref: '#/components/parameters/lastName__in'
      - $ref: '#/components/parameters/lastName__contains'
      - $ref: '#/components/parameters/email__in'
      - $ref: '#/components/parameters/email__contains'
      - $ref: '#/components/parameters/permissions.administrator'
      - $ref: '#/components/parameters/status.loginStatus__in'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/qRelevance__gte'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedUserResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get users
      x-summary-source: derived
    post:
      operationId: createUser
      description: This endpoint allows users to create a user in the account. The created user will be in pending state and a verification email will be sent to the user. Once approved, the newly created user will be in active state and will be able to be used.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAddUser'
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserMain'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Create user
      x-summary-source: derived
  /users/self:
    get:
      operationId: getCurrentUser
      description: This endpoint allows the users to retrieve info about the current user.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/includeForSelf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserForSelf'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get current user
      x-summary-source: derived
    patch:
      operationId: updateCurrentUser
      description: This endpoint allows the users to update current user's data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUserSelfUpdate'
      tags:
      - Users
      responses:
        '204':
          description: User Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update current user
      x-summary-source: derived
  /users/self/trustedClients:
    get:
      operationId: getTrustedClients
      description: 'This endpoint allows you to retrieve a list of trusted clients.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available trusted clients, not the number of trusted clients resulting from the query string.'
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/includeTrustedDevices'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedTrustedClientResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get trusted clients
      x-summary-source: derived
  /users/self/trustedClients/{trustedClientId}:
    parameters:
    - $ref: '#/components/parameters/trustedClientId'
    delete:
      operationId: deleteTrustedClient
      description: This endpoint allows you to delete a trusted client.
      tags:
      - Users
      responses:
        '204':
          description: Trusted client deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete trusted client
      x-summary-source: derived
  /users/{userId}:
    parameters:
    - $ref: '#/components/parameters/userId'
    get:
      operationId: getUser
      description: This endpoint allows the users to retrieve info about a specific user based on the user ID.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/includeForSingle'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserForSingle'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get user
      x-summary-source: derived
    delete:
      operationId: deleteUser
      description: This endpoint allows the users to delete a user from the account, removing all references related to that user.
      tags:
      - Users
      responses:
        '204':
          description: User deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete user
      x-summary-source: derived
    patch:
      operationId: updateUser
      description: 'Updates a specific user''s data. Note that not all fields may be editable in all contexts. To determine which fields are editable, request the schema using the include parameter.

        If the user''s permissions are managed via the Roles API, the `schema.permissions` fields will be marked as `readOnly`. In such cases, `effectivePermissions.roleAssignments` will be `true`, indicating that role-based assignment is in effect.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUserUpdate'
      tags:
      - Users
      responses:
        '204':
          description: User Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update user
      x-summary-source: derived
components:
  schemas:
    TimeSettings:
      type: object
      properties:
        showMilliseconds:
          type: boolean
          description: Select to display milliseconds when playing video.
        format:
          type: string
          description: Select between 12 and 24 hour mode for the display of time.
          enum:
          - 24h
          - 12h
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    ApiUserForSingle:
      allOf:
      - $ref: '#/components/schemas/ApiUserMain'
      - $ref: '#/components/schemas/ApiUserIncludes'
    Interval:
      type: object
      description: "Interval of a schedule. If the start time is greater than the end time, the interval is considered to cover the remaining time of the day from the start time until 24:00, and then from 00:00 to the end time. \nFor example, start: 16:30 and end: 06:00 on monday means the interval covers from 16:30 to 24:00 and continues from 00:00 to 06:00 on the same day (monday).\n"
      properties:
        start:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
        end:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day
      required:
      - start
      - end
    ApiUserForList:
      allOf:
      - $ref: '#/components/schemas/ApiUserMain'
      - $ref: '#/components/schemas/ApiUserIncludes'
      - $ref: '#/components/schemas/ApiUserFTSRelated'
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    EmployeeId:
      type:
      - string
      - 'null'
      description: Custom text field
      maxLength: 50
    EffectiveUserPermissions:
      readOnly: true
      type: object
      properties:
        read:
          type: boolean
        delete:
          type: boolean
        edit:
          type: boolean
        resourceGrants:
          type: boolean
          description: 'Indicates whether the current session has permission to grant or revoke resources  (such as devices, locations, and accounts) for the specified user.

            '
        roleAssignments:
          type: boolean
          description: 'Indicates whether the current session has permission to assign roles to the specified user.

            '
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    TrustedClient:
      type: object
      properties:
        id:
          type: string
        lastLogin:
          type: string
          format: date-time
          example: '2023-04-04T09:38:37.372Z'
        ip:
          type: string
          example: 192.158.1.38
        description:
          type: string
          example: iPhone / iOS 5.1 / Mobile Safari 5.1
          description: Information about device type, operating system and browser
        device:
          $ref: '#/components/schemas/TrustedClientDevice'
        browser:
          $ref: '#/components/schemas/TrustedClientBrowser'
        operatingSystem:
          $ref: '#/components/schemas/TrustedClientOperatingSystem'
      required:
      - id
      - lastLogin
      - ip
      - description
    Roles:
      type: array
      items:
        type: string
        format: uuid
      description: 'List of role IDs assigned to the user. When a user is created, they can only have either roles or permissions assigned. Furthermore, the roles feature has to be enabled for the account.

        '
    ContactDetails:
      type: object
      properties:
        alternateEmail:
          $ref: '#/components/schemas/AlternateEmail'
        phone:
          type: string
    PreviewSettings:
      type: object
      properties:
        showMotionBoxes:
          type: boolean
          description: Indicates whether motion boxes should be shown
        showAnalytics:
          type: boolean
          description: Indicates whether additional analytics should be shown
        showPluginExtensions:
          type: boolean
          description: Indicates whether to show custom annotations for third party applications.
    AdminPermission:
      properties:
        administrator:
          type: boolean
          x-jsoninclude-nonnull-annotation: true
          description: 'All permissions are enabled - create, delete, edit, and view access to all accounts and user settings, bridges, cameras, layouts, audit log and archive.

            '
    ApiUserMain:
      type: object
      properties:
        id:
          type: string
        createTimestamp:
          type: string
          format: date-time
          example: '2023-04-04T09:38:37.372Z'
        firstName:
          type: string
        lastName:
          type: string
        email:
          $ref: '#/components/schemas/Email'
        accountId:
          type: string
        locationId:
          $ref: '#/components/schemas/LocationId'
        language:
          type: string
        employeeId:
          $ref: '#/components/schemas/EmployeeId'
      required:
      - id
      - firstName
      - lastName
      - accountId
      - email
      - language
      - employeeId
    TimeZone:
      type: object
      properties:
        timeZone:
          type: string
          example: Americas/Chicago
          description: The timezone the user is in.
    ApiUserSelfUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 126
        lastName:
          type: string
          minLength: 1
          maxLength: 126
        email:
          $ref: '#/components/schemas/Email'
        contactDetails:
          $ref: '#/components/schemas/ContactDetails'
        support:
          $ref: '#/components/schemas/Support'
        language:
          type: string
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        layoutSettings:
          $ref: '#/components/schemas/LayoutSettings'
        previewSettings:
          $ref: '#/components/schemas/PreviewSettings'
        timeSettings:
          $ref: '#/components/schemas/TimeSettings'
    ApiUserIncludes:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        locationSummary:
          $ref: '#/components/schemas/LocationSummary'
        loginDetails:
          $ref: '#/components/schemas/LoginDetails'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        contactDetails:
          $ref: '#/components/schemas/ContactDetails'
        support:
          $ref: '#/components/schemas/Support'
        permissions:
          $ref: '#/components/schemas/Permissions'
        layoutSettings:
          $ref: '#/components/schemas/LayoutSettings'
        previewSettings:
          $ref: '#/components/schemas/PreviewSettings'
        effectivePermissions:
          $ref: '#/components/schemas/EffectiveUserPermissions'
        timeSettings:
          $ref: '#/components/schemas/TimeSettings'
        schema:
          $ref: '#/components/schemas/UserSchema'
    ApiUserUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 126
        lastName:
          type: string
          minLength: 1
          maxLength: 126
        email:
          $ref: '#/components/schemas/Email'
        locationId:
          $ref: '#/components/schemas/LocationId'
        status:
          type: string
          description: User can be enabled if set to "active" and disabled if set to "blocked"
          enum:
          - active
          - blocked
        loginSchedule:
          $ref: '#/components/schemas/WeeklyIntervalSchedule'
        permissions:
          $ref: '#/components/schemas/Permissions'
        employeeId:
          $ref: '#/components/schemas/EmployeeId'
    ApiPaginatedTrustedClientResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/TrustedClient'
    ApiUserForSelf:
      allOf:
      - $ref: '#/components/schemas/ApiUserMain'
      - $ref: '#/components/schemas/ApiUserIncludes'
      - type: object
        properties:
          identityId:
            type:
            - string
            - 'null'
            format: uuid
            description: 'The unique identifier of the user''s identity in the system.

              '
    TrustedClientDevice:
      type: object
      properties:
        brand:
          type:
          - string
          - 'null'
          example: Apple
        model:
          type:
          - string
          - 'null'
          example: iPhone
        family:
          type: string
          example: iPhone
        type:
          type:
          - string
          - 'null'
          enum:
          - pc
          - tablet
          - mobile
          example: mobile
        touchCapable:
          type: boolean
          description: Indicates whether user agent has touch capabilities
          example: true
      required:
      - brand
      - model
      - family
      - type
      - touchCapable
    Email:
      type: string
      description: This email is used for login.
      format: email
    TrustedClientOperatingSystem:
      type: object
      properties:
        family:
          type: string
          example: iOS
        version:
          type: string
          example: '5.1'
      required:
      - family
      - version
    Support:
      type: object
      properties:
        pin:
          $ref: '#/components/schemas/Pin'
    LocationSummary:
      type: object
      x-jsoninclude-nonnull-annotation: true
      description: Summary of location information.
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: object
          properties:
            country:
              type:
              - string
              - 'null'
            region:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            streetAddress:
              type:
              - string
              - 'null'
            streetAddress2:
              type:
              - string
              - 'null'
            postalCode:
              type:
              - string
              - 'null'
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    Status:
      type: object
      description: This status signifies the current status of the user.
      properties:
        loginStatus:
          $ref: '#/components/schemas/UserStatus'
        managedBy:
          $ref: '#/components/schemas/ManagedBy'
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    Pin:
      type: string
      description: Six digit string that signifies a support pin. Support can use this pin to login to user account.
      pattern: ^[0-9]*$
      example: '000000'
      minLength: 6
      maxLength: 6
    UserSchema:
      type: object
      readOnly: true
      description: 'Optional "include" that returns a JSON Schema Draft 4 object describing this resource. Enables clients to determine allowed interactions dynamically (e.g., whether a field can be updated), even if the general OpenAPI spec permits more. Useful for context-specific capability enforcement.

        '
      example:
        $schema: http://json-schema.org/draft-04/schema
        type: object
        properties:
          firstName:
            type: string
            minLength: 1
            maxLength: 126
            readOnly: true
          lastName:
            type: string
            minLength: 1
            maxLength: 126
            readOnly: true
          email:
            type: string
            description: This email is used for login.
            format: email
            readOnly: true
          locationId:
            description: ID Of the location.
            minLength: 1
            type:
            - string
            - 'null'
            example: 2428fda3-389f-48ce-b062-85875dd6b2e2
            readOnly: false
          status:
            type: string
            readOnly: true
            description: User can be enabled if set to "active" and disabled if set to "blocked"
            enum:
            - active
            - blocked
          loginSchedule:
            type: object
            description: 'It signifies a week long alert schedule. This schedule is effective according to actor''s (user/camera/account) timezone. It allows setting different times for different days.

              '
            readOnly: false
            properties:
              sunday:
                type: array
                items:
                  properties:
                    start:
                      type: string
                      readOnly: false
                      pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                      description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
                    end:
                      type: string
                      readOnly: false
                      pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                      description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day
              monday:
                type: array
                items:
                  properties:
                    start:
                      type: string
                      readOnly: false
                      pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                      description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
                    end:
                      type: string
                      readOnly: false
                      pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                      description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day
              tuesday:
                type: array
                items:
                  properties:
                    start:
                      type: string
                      readOnly: false
                      pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                      description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
                    end:
                      type: string
                      readOnly: false
