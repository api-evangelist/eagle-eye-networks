  parameters:
    firstName__in:
      in: query
      name: firstName__in
      description: Filter to get the users whose firstName is on the provided list. The lookup is exact but case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    id__notIn:
      in: query
      name: id__notIn
      description: Filter to exlude the users whose ids are in the provided list. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    sort:
      in: query
      name: sort
      description: "Comma separated list of of fields that should be sorted. By default, the users response is sorted by first name.\n * `sort=` - not providing any value will result in error 400\n * `sort=+firstName,+firstName` - same values will result in error 400\n * `sort=-firstName,+firstName` - mutually exclusive values will return error 400\n * There is no limit on the number of sort fields. All available sort fields can be combined freely, as the backend supports sorting by all of them.\n * qRelevance is optional ordering parameter which is available if q filter is used, if q filter is not passed qRelevance as ordering parameter will return error 400\n"
      schema:
        type: array
        default:
        - +firstName
        items:
          type: string
