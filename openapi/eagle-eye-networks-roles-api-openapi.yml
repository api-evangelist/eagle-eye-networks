openapi: 3.2.0
info:
  title: USER & ACCOUNTS Roles API
  version: 3.0.0
  description: All operations on roles.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Roles
  description: All operations on roles.
paths:
  /roleAssignments:
    get:
      operationId: getRoleAssignments
      description: This endpoint returns a list of all role assignments in current user's account.
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/userId__in'
      - $ref: '#/components/parameters/roleId__in'
      - $ref: '#/components/parameters/roleId__contains'
      - $ref: '#/components/parameters/roleName__contains'
      - $ref: '#/components/parameters/self'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: List of role assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedRoleAssignmentResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get role assignments
      x-summary-source: derived
  /roleAssignments:bulkcreate:
    post:
      operationId: createRoleAssignments
      description: This endpoint allows you to create multiple role assignments in one request.
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBulkRoleAssignmentUpdate'
      responses:
        '200':
          description: Operations performed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBulkRoleAssignmentResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Create role assignments
      x-summary-source: derived
  /roleAssignments:bulkdelete:
    post:
      operationId: deleteRoleAssignments
      description: This endpoint allows you to delete multiple role assignments in one request.
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBulkRoleAssignmentUpdate'
      responses:
        '200':
          description: Operations performed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBulkRoleAssignmentResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete role assignments
      x-summary-source: derived
  /roles:
    get:
      operationId: getRoles
      description: This endpoint returns a list of all roles in current user's account.
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/roleName__contains'
      - $ref: '#/components/parameters/include1'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: List of roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedRoleResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get roles
      x-summary-source: derived
    post:
      operationId: createRole
      description: This endpoint creates a new role under the current user's account. Admins can create roles and define which permissions are part of which roles. Non-admin users with 'Role' permission can only create a role with the permission that they already have themselves.
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRoleCreate'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRole'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Create role
      x-summary-source: derived
  /roles/{roleId}:
    parameters:
    - $ref: '#/components/parameters/roleId'
    delete:
      operationId: deleteRole
      description: This endpoint deletes a role from current user's account. A role can only be deleted if it is not assigned to any user. Admin users and non-admin users with 'Role' permission can delete roles.
      tags:
      - Roles
      responses:
        '204':
          description: Role deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete role
      x-summary-source: derived
    get:
      parameters:
      - $ref: '#/components/parameters/include1'
      operationId: getRole
      description: This endpoint returns a role by its ID.
      tags:
      - Roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRole'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get role
      x-summary-source: derived
    patch:
      operationId: updateRole
      description: This endpoint updates a role. Admin users and non-admin users with 'Role' permission can update roles.
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRoleUpdate'
      responses:
        '204':
          description: Role updated.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update role
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    AdminPermission:
      properties:
        administrator:
          type: boolean
          x-jsoninclude-nonnull-annotation: true
          description: 'All permissions are enabled - create, delete, edit, and view access to all accounts and user settings, bridges, cameras, layouts, audit log and archive.

            '
    ApiRoleAssignment:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user.
        roleId:
          type: string
          format: uuid
          description: The ID of the role.
        roleName:
          type: string
          description: The name of the role.
      required:
      - userId
      - roleId
      - roleName
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    ApiPaginatedRoleAssignmentResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiRoleAssignment'
    ApiRoleCreate:
      allOf:
      - $ref: '#/components/schemas/ApiRoleUpdate'
      - type: object
        required:
        - name
        - permissions
        - default
    Permissions:
      allOf:
      - $ref: '#/components/schemas/AdminPermission'
      - type: object
        properties:
          editAccounts:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit Control, Days, Security, Camera, Alerts, Notifications, Privacy, Sharing, Responders, Default retentions, and camera resolution settings.

              '
          layoutAdministrator:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Create, delete and edit any accessible layouts. All user layouts are visible to admin users.

              '
          createLayouts:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Ability to create layouts and edit the layouts created. This does not grant permission to edit layouts created by other users.

              '
          editNoBillingDeviceSettings:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit Camera Settings except for Cloud Retention and Full Video Resolution. Cannot add or delete cameras. Edit existing Analytics. Cannot add or delete Analytics.

              '
          turnCamerasOnOff:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Turn Cameras on/off. Cameras off cannot be recorded.
          editMotionAreas:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit Motion Settings. Set object size and sensitivity, add/delete regions, add/delete alerts for regions. Edit existing Analytics. Set object size and sensitivity, add/delete alerts.

              '
          editAllCameraSettings:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Editing all Camera Settings. Cannot add or delete cameras.
          editUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Create, delete and edit non-admin users in an end user account.
          upgradeEdition:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Upgrade current edition subscription to a higher level edition.
          addEditBridgesCameras:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Create, delete, edit, and view Bridges and Cameras. This is the only permission for a non-admin to be able to add and view bridges in an end user account.

              '
          editSharing:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit Sharing and Responders settings.
          controlPTZ:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Control Pan, Tilt, Zoom, & recall stations while viewing a preview or live video of PTZ cameras.

              '
          editPTZStations:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Edit PTZ Settings. Set PTZ mode and create, delete, edit stations.

              '
          addEditSpeakers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add speakers, edit speaker settings, delete speakers.
          editSpeakers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit speaker settings. Cannot add or delete speakers.
          viewLiveVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View full resolution video live.
          viewHistoricVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View history browser and historic video.
          downloadVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Download preview and full resolution video.
          viewPreviewVideo:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View preview images from cameras.
          talkDown:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Allows the users to initiate Talk Down to the camera field(s) of view.
          editMap:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add and edit floors, lines, shapes, and cameras on the map.
          viewAuditLog:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View Audit Log and download reports from it.
          viewArchive:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View all files and folders within the Archive.
          editArchive:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Save videos to Archive - delete, edit, and view files and folders within the Archive.
          viewPlugins:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View all Plugins.
          editPlugins:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add and remove plugins.
          exportUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Export a list of account users in .csv format.
          viewVSP:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: User access to view vehicle data, search vehicle across camera & location, set rules, and alert.
          editResellerUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Create, delete and edit reseller user who is not an Admin.
          editAdminUsers:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: 'Create, delete and edit admin and non-admin users in an end user account. Give access to bridges, cameras, and layouts. Create new end user accounts and give access to them.

              '
          viewContract:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View recordings, search, and create new recordings.
          addRemovePayment:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add and remove payment methods.
          viewInvoice:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View and download invoices.
          placeOrders:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Add products to the shopping cart and place orders.
          viewShipments:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View the status of shipments.
          viewPricingInformation:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View pricing information.
          viewResellerProgramInformation:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View Marketing's reseller program information.
          viewVSPRule:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View VSP rules.
          editVSPRule:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit VSP rules.
          viewVehicleList:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View vehicle lists.
          editVehicleList:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit vehicle lists.
          viewAutomations:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View automation alerts, rules, and actions.
          editAutomations:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit automation alerts, rules, and actions.
          editAlertManagerRulesAndActions:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: Edit Automations rules and actions.
          viewAlertManagerRulesAndActions:
            type: boolean
            x-jsoninclude-nonnull-annotation: true
            description: View Alert Manager rules and actions.
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    ApiBulkRoleAssignmentResponse:
      type: array
      items:
        type: object
        properties:
          userId:
            type: string
            description: The ID of the user.
          roleId:
            type: string
            format: uuid
            description: The ID of the role.
          status:
            type: integer
            description: The response status of the operation.
        required:
        - userId
        - roleId
        - status
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ApiRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the role.
        assignable:
          x-jsoninclude-nonnull-annotation: true
          type: boolean
          description: True if the user doing the request can assign this role to other users, false otherwise.
        userCount:
          x-jsoninclude-nonnull-annotation: true
          type: integer
          description: Count of users that are associated with this role in the account
        name:
          type: string
          description: The name of the role.
          minLength: 1
          maxLength: 126
        notes:
          x-jsoninclude-nonnull-annotation: true
          type: string
          description: The notes of the role.
          maxLength: 5000
        default:
          type: boolean
          description: True if the role is one of the default roles for the account, false otherwise.
        permissions:
          $ref: '#/components/schemas/Permissions'
      required:
      - id
      - name
      - default
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    ApiRoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 126
          description: The name of the role.
        notes:
          type: string
          maxLength: 5000
          description: The notes of the role.
        default:
          type: boolean
          description: True if the role is one of the default roles for the account, false otherwise.
        permissions:
          $ref: '#/components/schemas/Permissions'
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    ApiPaginatedRoleResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiRole'
    ApiBulkRoleAssignmentUpdate:
      type: array
      minItems: 1
      maxItems: 5000
      items:
        type: object
        properties:
          userId:
            type: string
            minLength: 1
            description: The ID of the user.
          roleId:
            type: string
            minLength: 1
            format: uuid
            description: The ID of the role.
        required:
        - userId
        - roleId
  parameters:
    roleName__contains:
      in: query
      name: roleName__contains
      description: 'Filter to get the user role assignments whose the role name contains the provided substring. The lookup is exact but case insensitive

        '
      schema:
        type: string
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    self:
      in: query
      name: self
      description: Filter to get the role assignments for the requesting user.
      schema:
        type: boolean
    id__in:
      in: query
      name: id__in
      description: Filter to get the users whose id is on the provided list. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    userId__in:
      in: query
      name: userId__in
      required: false
      description: List of user IDs to filter on that is comma separated.
      style: form
      explode: false
      schema:
        type: array
        example:
        - abc456f
        items:
          type: string
    roleId__contains:
      in: query
      name: roleId__contains
      description: 'Filter to get the user role assignments whose the role ID contains the provided substring. The lookup is exact but case insensitive

        '
      schema:
        type: string
    roleId:
      name: roleId
      in: path
      description: The ID of the role.
      required: true
      schema:
        type: string
        format: uuid
    roleId__in:
      in: query
      name: roleId__in
      required: false
      description: List of role IDs to filter on that is comma separated.
      style: form
      explode: false
      schema:
        type: array
        example:
        - 2428fda3-389f-48ce-b062-85875dd6b2e2
        items:
          type: string
          format: uuid
    include1:
      in: query
      name: include
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - assignable
          - userCount
          - permissions
          - notes
    pageToken:
      in: query
      name: pageToken
      description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken` and `prevPageToken` fields.

