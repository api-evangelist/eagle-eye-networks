                        end: '11:09'
                      friday:
                      - start: '10:35'
                        end: '11:09'
                      saturday:
                      - start: '10:35'
                        end: '11:09'
                    resourceFilter:
                      actors:
                      - id: 100b913c
                        type: camera
                  configuration:
                    barrierOpen: true
                    filterType: vehicleList
                    vehicleListIds:
                    - b6a5e240-6ba8-4d5a-a38e-bc648ac5f94e
              EventAggrExample1:
                summary: Event high count rule
                value:
                  type: lprRuleCountAggr
                  name: High event count rule
                  priority: 10
                  notes: This rule triggers when event count is greater than 100 in an hour
                  enabled: false
                  eventFilter:
                    eventTypes:
