components:
  schemas:
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    Interval:
      type: object
      description: "Interval of a schedule. If the start time is greater than the end time, the interval is considered to cover the remaining time of the day from the start time until 24:00, and then from 00:00 to the end time. \nFor example, start: 16:30 and end: 06:00 on monday means the interval covers from 16:30 to 24:00 and continues from 00:00 to 06:00 on the same day (monday).\n"
      properties:
        start:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
        end:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day
      required:
      - start
      - end
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    LprRuleCfgWatchBase:
      type: object
      description: Configuration parameters for the Vehicle Watch rule
      properties:
        durationThresh:
          type: string
          description: 'Time threshold within which the same vehicle (same license plate) must be seen again.

            Acceptable range: between 5 minutes (5m) and 24 hours (24h).

            '
          example: 1h
        originActors:
          type: array
          items:
            type: object
            description: Specifies the attributes of an actor from where the first occurrence of the vehicle should happen for the rule to initiate. The below actors should be part of resource filter defined for the rule and should not be part of destinationActors.
            properties:
              id:
                type: string
                description: The id of the thing that caused the event This can be camera or location ID.
                example: 100b913c
              type:
                type: string
                enum:
                - camera
                - location
                default: camera
                description: Type of actor that caused the event.
            required:
            - type
        destinationActors:
          type: array
          items:
            type: object
            description: Specifies the attributes of an actor from where the second occurrence of the vehicle should happen to affect the rule. The below actors should be part of resource filter defined for the rule and should not be part of originActors.
            properties:
              id:
                type: string
                description: The id of the thing that caused the event This can be camera or location ID.
                example: 100b913c
              type:
                type: string
                enum:
                - camera
                - location
                default: camera
                description: Type of actor that caused the event.
            required:
            - type
        filterType:
          type: string
          example: plate
          description: "Enumerates available filter types. The brief synopsis of the maps as follows:\n  * plate: rule should be applied to one or more plate(s)\n  * vehicleList: rule to be applied to one or more vehicle list(s)\n  * anyPlateExcept: rule to be applied to all plates, except ones which are exempted in the optionally provided vehicle list"
          enum:
          - plate
          - vehicleList
          - anyPlateExcept
      required:
      - originActors
      - destinationActors
      - durationThresh
      - filterType
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    LprAlertConditionRuleUnlisted:
      allOf:
      - $ref: '#/components/schemas/LprAlertConditionRuleBase'
      - type: object
        properties:
          type:
            type: string
