    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    LprRuleCfgOverstayBase:
      type: object
      description: Configuration parameters for the Overstay rule
      properties:
        alertTime:
          type: string
          description: "Daily clock time in 24-hour \"HH:MM\" format. When a vehicle entry is detected, an alert is scheduled for the next occurrence of this time. If the vehicle has not exited by then, the alert fires. \n"
          example: '22:00'
        filterType:
          type: string
          example: allPlates
          description: "Enumerates available filter types:\n  * plate: rule should be applied to a specific plate\n  * vehicleList: rule to be applied to a specific vehicle list\n  * anyPlateExcept: rule to be applied to all plates, except ones exempted in the provided vehicle list\n  * allPlates: rule to be applied to all plates"
          enum:
          - plate
          - vehicleList
          - anyPlateExcept
          - allPlates
      required:
      - alertTime
      - filterType
