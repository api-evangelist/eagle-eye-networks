openapi: 3.2.0
info:
  title: VEHICLE SURVEILLANCE PACKAGE LPR Rules API
  version: 3.0.0
  description: Rules that transform LPR plate read events into actions and alerts.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: LPR Rules
  description: Rules that transform LPR plate read events into actions and alerts.
paths:
  /lprAlertConditionRules:
    post:
      operationId: addLprAlertConditionRule
      tags:
      - LPR Rules
      description: 'Create a new rule that produces alerts based on certain conditions. Specifically, the user specifies alert conditions that indicate when the alert is produced based on following:

        * Which resources (cameras, account or location) can produce the alert

        * What is the schedule for the alert.

        * What event types, or which vehicles (specific plates, or belonging to a vehicleList) can produce the alert.'
      requestBody:
        description: Data containing information on the rule to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LprAlertConditionRuleUntaggedForPost'
            examples:
              AccessControlExample1:
                summary: Access control allow rule
                value:
                  type: lprRuleAccessControlAllow
                  name: Allow Employees vehicles
                  priority: 10
                  notes: This rule filters single plate and allows access to that plate
                  enabled: false
                  eventFilter:
                    eventTypes:
                    - een.lprPlateReadEvent.v1
                    schedule:
                      sunday:
                      - start: '20:08'
                        end: '23:10'
                      monday:
                      - start: '10:35'
                        end: '11:09'
                      tuesday:
                      - start: '10:35'
                        end: '11:09'
                      wednesday:
                      - start: '10:35'
                        end: '11:09'
                      thursday:
                      - start: '10:35'
                        end: '11:09'
                      friday:
                      - start: '10:35'
                        end: '11:09'
                      saturday:
                      - start: '10:35'
                        end: '11:09'
                    resourceFilter:
                      actors:
                      - id: 100b913c
                        type: camera
                  configuration:
                    barrierOpen: true
                    filterType: plate
                    plates:
                    - ABC123
              AccessControlExample2:
                summary: Access control deny rule
                value:
                  type: lprRuleAccessControlDeny
                  name: Deny offender vehicles
                  priority: 10
                  notes: This rule filters plates belonging to employee list and denies access to offending vehicles
                  enabled: false
                  eventFilter:
                    eventTypes:
                    - een.lprPlateReadEvent.v1
                    schedule:
                      sunday:
                      - start: '20:08'
                        end: '23:10'
                      monday:
                      - start: '10:35'
                        end: '11:09'
                      tuesday:
                      - start: '10:35'
                        end: '11:09'
                      wednesday:
