    LprRuleTypes:
      type: string
      description: "Enumerates available rule types. The brief synopsis of the rules as follows.\n * `lprRuleAccessControlAllow` creates an alert when vehicles are seen whose access type is `allow`.\n * `lprRuleAccessControlDeny` creates an alert when vehicles are seen whose access type is `deny`.\n * `lprRuleWatch` raises an alert if a vehicle is seen once and is not seen again within the specified time interval.\n * `lprRuleCountAggr` sets up aggregation for camera or location and fires an alert if the aggregation\n    (detection count) in a specified time interval falls above or below threshold.\n * `lprRuleHotlist` configures to receive an alert for a specific plate or list of vehicles.\n * `lprRuleUnlisted` configures to receive an alert for vehicles which are not part of the vehicle list.\n * `lprRuleWrongDirection` configures to receive an alert when a vehicle is traveling in the wrong direction.\n * `lprRuleOverstay` configures to receive an alert when a vehicle is still present at a configured time of day.\n"
      enum:
      - lprRuleAccessControlAllow
      - lprRuleAccessControlDeny
      - lprRuleWatch
      - lprRuleCountAggr
      - lprRuleHotlist
      - lprRuleUnlisted
      - lprRuleWrongDirection
      - lprRuleOverstay
