            monday:
            - start: '21:38'
              end: '17:12'
            tuesday:
            - start: '12:48'
              end: '11:20'
            wednesday:
            - start: '22:41'
              end: '22:23'
            thursday:
            - start: '20:00'
              end: '22:50'
            friday:
            - start: 09:40
              end: '16:18'
            saturday:
            - start: '23:32'
              end: '21:45'
          resourceFilter:
            actors:
            - id: 100b913c
              type: camera
            - id: 1000205a
              type: camera
        configuration:
          filterType: vehicleList
          vehicleListIds:
          - b6a5e240-6ba8-4d5a-a38e-bc648ac5f94e
        id: f65907c0-5bb9-45cd-bc2e-173aa9a3f005
        createTimeStamp: '2021-04-22T00:00:00.000+00:00'
        updateTimeStamp: '2021-04-22T00:20:00.000+00:00'
        createdByUserId: ca0de584
        outputAlertTypes:
