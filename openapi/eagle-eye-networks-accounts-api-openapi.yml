openapi: 3.2.0
info:
  title: USER Accounts API
  version: 3.0.0
  description: All core operations on accounts.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Accounts
  description: All core operations on accounts.
paths:
  /accounts:
    get:
      operationId: listAccounts
      description: Retrieves a list of accounts the user has access to. This will include the user's own account, but can contain others such as when the user is a reseller.
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/sort1'
      - $ref: '#/components/parameters/id__in1'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/customerId__contains'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedEndUserAccountResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List accounts
      x-summary-source: derived
  /accounts/{id}/credentials/{credentialId}:
    parameters:
    - $ref: '#/components/parameters/credentialId'
    - $ref: '#/components/parameters/id'
    delete:
      operationId: deleteCredential
      description: Deletes the credential from the account.
      tags:
      - Accounts
      responses:
        '204':
          description: Credential deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete credential
      x-summary-source: derived
components:
  schemas:
    AccountGet:
      allOf:
      - type: object
        properties:
          customerId:
            type: string
            maxLength: 120
            description: 'The customer identifier assigned to this account. It is used to link the account with an external CRM system. It can only be updated by resellers requests applied to end user accounts.

              '
          contactDetails:
            $ref: '#/components/schemas/AccountContact'
      - $ref: '#/components/schemas/AccountSelfGet'
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    EdgeReportedDeviceStatusCounts:
      type: object
      properties:
        operational:
          type: integer
        disabled:
          type: integer
        unreachable:
          type: integer
        error:
          type: integer
        unknown:
          type: integer
        initializing:
          type: integer
    CameraStatusCounts:
      type: object
      properties:
        online:
          type: integer
        deviceOffline:
          type: integer
        'off':
          type: integer
        bridgeOffline:
          type: integer
        invalidCredentials:
          type: integer
        error:
          type: integer
        unknown:
          type: integer
    AccountStatus:
      description: "The overall status of the account\n  * `active`: The default is active.\n  * `accountDisabled`: All cameras are turned off and no login is allowed for end user accounts.\n  * `loginDisabled`: No login is allowed for end user accounts, but cameras continue to record.\n"
      enum:
      - active
      - accountDisabled
      - loginDisabled
      type: string
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    PasswordLimits:
      type: object
      properties:
        allowedMinimumLength:
          description: Allowed minimum value for the minimumLength field.
          type: integer
          readOnly: true
          example: 10
        allowedMaximumLength:
          description: Allowed minimum value for the maximumLength field.
          type: integer
          readOnly: true
          example: 64
        minimumLength:
          description: Require to create a password with the minimum length of the set value.
          type: integer
          example: 10
        maximumLength:
          description: Require to create a password with the maximum length of the set value.
          type: integer
          example: 64
        reuseNumberLimit:
          description: Require to create a password that was not previously used for the selected number of previous passwords of the given user.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 15
        reuseDayLimit:
          description: Defines the minimum number of days before a password can be reused.
          type:
          - integer
          - 'null'
          example: 1
          minimum: 0
          maximum: 120
    AccountType:
      readOnly: true
      description: 'Indicates account type. *Note: new values might be added in the future, so clients are advised to implement logic to handle unknown values.*

        '
      enum:
      - distributor
      - reseller
      - endUserAccount
      type: string
    CameraStatusV2Counts:
      type: object
      properties:
        cloudConnectionStatus:
          $ref: '#/components/schemas/CloudConnectionStatusCounts'
        edgeReportedDeviceStatus:
          $ref: '#/components/schemas/EdgeReportedDeviceStatusCounts'
    EffectiveAccountPermissions:
      type: object
      readOnly: true
      properties:
        read:
          type: boolean
        edit:
          type: boolean
          description: Edit account settings.
        upgradeEdition:
          type: boolean
          description: Upgrade current edition subscription to a higher level edition. Downgrades require technical support.
        addBridgesCameras:
          type: boolean
          description: Add bridges and cameras to the account.
        addSpeakers:
          type: boolean
          description: Add speakers to the account.
        addLayouts:
          type: boolean
          description: Add layouts to the account.
        addUsers:
          type: boolean
          description: Add users to the account.
        viewAuditLog:
          type: boolean
          description: View Audit Log and download reports from it.
        viewArchive:
          type: boolean
          description: View all files and folders within the Archive.
        editArchive:
          type: boolean
          description: Save videos to Archive - delete, and edit files and folders within the Archive.
        viewPlugins:
          type: boolean
          description: View the list of plugins.
        addPlugins:
          type: boolean
          description: Add plugins.
        exportUsers:
          type: boolean
          description: Export a list of account users in .csv format.
        accessAllCameras:
          type: boolean
          description: User has access to all current and future cameras in the account without requiring individual resource grants.
          example: true
        accessAllLocations:
          type: boolean
          description: User has access to all current and future locations in the account without requiring individual resource grants.
          example: true
        accessAllLayouts:
          type: boolean
          description: User has access to all current and future layouts in the account without requiring individual resource grants.
          example: true
        accessAllAccounts:
          type: boolean
          description: User has access to all current and future sub-accounts without requiring individual resource grants.
          example: true
    ResourceStatusCountsBase:
      description: Base schema for resource status counts.
      type: object
      readOnly: true
      properties:
        cameras:
          $ref: '#/components/schemas/CameraStatusCounts'
        bridges:
          $ref: '#/components/schemas/BridgeStatusCounts'
        users:
          $ref: '#/components/schemas/UserStatusCounts'
        accounts:
          $ref: '#/components/schemas/AccountStatusCounts'
        multiCameras:
          $ref: '#/components/schemas/CameraStatusCounts'
        speakers:
          $ref: '#/components/schemas/CameraStatusCounts'
    BridgeStatusCounts:
      type: object
      properties:
        online:
          type: integer
        deviceOffline:
          type: integer
        unknown:
          type: integer
    ChildResourceStatusCounts:
      allOf:
      - $ref: '#/components/schemas/ResourceStatusCountsBase'
      - description: 'Aggregate count of resources by status across all child accounts of this account. Excludes this account''s direct resources (see `resourceStatusCounts`).

          '
    RoleSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: Indicates that the roles based access control can be enabled for users.
    ResourceStatusV2CountsBase:
      description: Base schema for resource status V2 counts with cloud connection and edge-reported device status breakdowns.
      type: object
      readOnly: true
      properties:
        cameras:
          $ref: '#/components/schemas/CameraStatusV2Counts'
        bridges:
          $ref: '#/components/schemas/BridgeStatusV2Counts'
        users:
          $ref: '#/components/schemas/UserStatusCounts'
        accounts:
          $ref: '#/components/schemas/AccountStatusCounts'
        multiCameras:
          $ref: '#/components/schemas/CameraStatusV2Counts'
        speakers:
          $ref: '#/components/schemas/CameraStatusV2Counts'
    ResourceStatusV2Counts:
      allOf:
      - $ref: '#/components/schemas/ResourceStatusV2CountsBase'
      - description: 'Count of resources by cloud connection status and edge-reported device status, owned directly by this account. Excludes child account resources.

          '
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    FullVideoResolution:
      description: New resolutions might be added in the future. Currently only "std" (SD1), "high" (HD1), "1080P (HD2)", "3MP (HD3)", "4MP (HD4)", "5MP (HD5)" and "10MP (HD10)" resolutions are supported.
      type: string
      enum:
      - std
      - high
      - 1080P
      - 3MP
      - 4MP
      - 5MP
      - 10MP
    AccountSelfPatch:
      allOf:
      - $ref: '#/components/schemas/AccountBasePatch'
      - $ref: '#/components/schemas/AccountExtendedPatch'
    FirstResponders:
      type: object
      properties:
        active:
          description: Activate Responder Share feature.
          type: boolean
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    DeviceAnomalyCounts:
      description: Count of the device anomalies. For resellers, this will be the cumulative counts.
      type: object
      readOnly: true
      properties:
        onlineBridgesWithNoDevices:
          type: integer
          minimum: 0
          example: 3
    BridgeSettings:
      properties:
        bridgeHealth:
          type: boolean
    Permissions1:
      type: object
      description: 'Permission settings that control access to various operational features. These settings apply to all users in end-user accounts, except reseller administrators who switch into the account.

        **Visibility and Access:** - Only returned to and editable by the reseller - Not visible or editable by users within the end-user account itself

        These settings only apply to end-user accounts. They are not returned for reseller accounts, and attempting to set them on reseller accounts will result in an error.

        The permissions are hierarchical - each level includes all restrictions from the previous level. For example, setting editBillableSettings to false includes all restrictions from addDeleteDevices: false, plus additional restrictions.

        '
      properties:
        addDeleteDevices:
          type: boolean
          description: 'Controls whether users can add or delete devices such as bridges, cameras, speakers, etc.

            When false: • Cannot add new devices to the account • Cannot delete existing devices from the account

            '
          example: true
        editBillableSettings:
          type: boolean
          description: 'Controls whether users can change settings that affect subscription costs.

            When false, includes all restrictions from addDeleteDevices: false, plus additional restrictions such as: • Cannot change cloud retention periods • Cannot change video resolution settings • Cannot upgrade account editions • Cannot configure analytics that affect billing

            '
          example: true
        editAdvancedSettings:
          type: boolean
          description: 'Controls whether users can change settings that could impact cost, performance, stability, or quality.

            When false, includes all restrictions from editBillableSettings: false, plus additional restrictions such as: • Cannot edit account settings (e.g., name, timezone, preferences, security settings) • Cannot edit device settings (e.g., camera name, timezone, location details, audio settings, operating hours schedule) • Cannot access device tunnels (direct device configuration interface)

            '
          example: true
        editOperationalSettings:
          type: boolean
          description: 'Controls whether users can perform device operations or change technical configurations.

            When false, includes all restrictions from editAdvancedSettings: false, plus additional restrictions such as: • Cannot control PTZ (pan, tilt, zoom during live viewing) • Cannot edit PTZ stations and presets • Cannot edit motion detection areas or other analytic configuration • Cannot share cameras with other accounts • Cannot turn cameras on or off

            '
          example: true
        showBridgeHealth:
          type: boolean
          description: 'Controls whether bridge/CMVR health status indicators are visible to end users.

            When false, hides health indicators such as warnings for CPU overload, high temperatures, high bandwidth usage, and video purge events (when video is deleted before it could be uploaded to the cloud).

            '
          example: true
        enableVideoPrivacy:
          type: boolean
          description: 'Allows end-user account administrators to prevent resellers from viewing their camera feeds (both live and historic video).

            When false, resellers have full visibility to all camera feeds and end users cannot restrict this access.

            '
          example: true
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    CameraSettingProposedValues:
      description: Lists of proposed values to be displayed to users for each property. Although users can choose any number of days, this subset keeps the list manageable and agrees with any billing thresholds.
      type: object
      readOnly: true
      properties:
        retention:
          type: object
          properties:
            cloudDays:
              description: Proposed set of cloud retention days that the user could chose between.
              type: array
              items:
                type: integer
              example:
              - 1
              - 2
              - 3
              - 5
              - 7
              - 14
              - 28
              - 30
              - 31
              - 60
              - 90
              - 180
              - 365
              - 730
              - 1095
              - 1825
            cloudPreviewOnlyDays:
              description: Proposed set of cloud retention days that the user could choose between if they choose to keep only preview videos in the cloud. This list should replace cloudDays if cloudPreviewOnly property is set to true.
              type: array
              items:
                type: integer
              example:
              - 1
              - 2
              - 3
              - 5
              - 7
              - 14
              - 28
              - 30
              - 31
              - 60
              - 90
              - 180
            minimumOnPremiseDays:
              description: "Proposed set of minimum on-premise retention days the user could choose between. \nKeep in mind that the minimum on-premise retention days value should be less than the maximum on-premise retention days value.\n"
              type: array
              items:
                type: integer
              example:
              - 0
              - 1
              - 2
              - 3
              - 5
              - 7
              - 14
              - 28
              - 30
              - 31
              - 60
              - 90
              - 180
            maximumOnPremiseDays:
              description: 'Proposed set maximum on-premise retention days the user could choose between.

                Keep in mind that the minimum on-premise retention days value should be less than the maximum on-premise retention days value.

                '
              type: array
              items:
                type: integer
              example:
              - 0
              - 1
              - 2
              - 3
              - 5
              - 7
              - 14
              - 28
              - 30
              - 31
              - 60
              - 90
              - 180
              - 365
    CameraSettings:
      properties:
        rtspCameras:
          type: boolean
    UserStatusCounts:
      type: object
      properties:
        active:
          type: integer
        blocked:
          type: integer
        pending:
          type: integer
    ResourceCountsBase:
      description: Base schema for resource counts.
      type: object
      readOnly: true
      properties:
        cameras:
          type: integer
          minimum: 0
          example: 23
        bridges:
          type: integer
          minimum: 0
          example: 2
        multiCameras:
          type: integer
          minimum: 0
          example: 1
        speakers:
          type: integer
          minimum: 0
          example: 1
        users:
          type: integer
          minimum: 0
          example: 12
        accounts:
          type: integer
          minimum: 0
          example: 5
        layouts:
          type: integer
          minimum: 0
          example: 10
        responderCameraProxies:
          description: Number of cameras shared with this account as part of the first responder functionality.
          type: integer
          minimum: 0
          example: 0
        locations:
          type: integer
          minimum: 0
          example: 10
        deviceTags:
          type: integer
          minimum: 0
          example: 3
        sharedCameraProxies:
          description: Number of cameras shared with this account as part of the camera sharing functionality. Cameras shared using first responder functionality are not part of this count.
          type: integer
          minimum: 0
          example: 10
    ResourceStatusCounts:
      allOf:
      - $ref: '#/components/schemas/ResourceStatusCountsBase'
      - description: 'Count of resources by status owned directly by this account. Excludes child account resources (see `childResourceStatusCounts`).

          '
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    AccountStatusCounts:
      type: object
      properties:
        active:
          type: integer
        loginDisabled:
          type: integer
        accountDisabled:
          type: integer
    PreviewOnlyCloudRetention:
      description: Allows previews to be transmitted to cloud while keeping full video locally on the CMVR. This setting is only available for cameras attached to a CMVR.
      type: boolean
    AccountSelfGet:
      allOf:
      - type: object
      - $ref: '#/components/schemas/AccountBaseGet'
      - properties:
          effectivePermissions:
            $ref: '#/components/schemas/EffectiveAccountPermissions'
          resourceCounts:
            $ref: '#/components/schemas/ResourceCounts'
          resourceStatusCounts:
            $ref: '#/components/schemas/ResourceStatusCounts'
          resourceStatusV2Counts:
            $ref: '#/components/schemas/ResourceStatusV2Counts'
          deviceAnomalyCounts:
            $ref: '#/components/schemas/DeviceAnomalyCounts'
          statistics:
            $ref: '#/components/schemas/AccountStatistics'
          packages:
            readOnly: true
            type: array
            items:
              type: string
            example:
            - een.vsp
            - een.pos
            description: List of packages enabled for an account.
          childResourceCounts:
            $ref: '#/components/schemas/ChildResourceCounts'
          childResourceStatusCounts:
            $ref: '#/components/schemas/ChildResourceStatusCounts'
      - $ref: '#/components/schemas/AccountSelfPatch'
      - required:
        - id
        - name
        - editionId
        - status
        - type
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    Security:
      type: object
      properties:
        sessionDuration:
          type: integer
          example: 10080
          description: 'Unit: Minutes. Sets the maximum duration of access token (Also known as the auth sesstion). The result is that this is the maximum time webapps will be logged in for. Other applications such as mobile and server to server applications are not directly affected by this maximum, as they can automatically get a new access token using a refresh token or automated login."

            '
          minimum: 1
          maximum: 525600
        sessionInactivityTimeout:
          type:
          - integer
          - 'null'
          example: 1440
          description: 'Unit: Minutes. Account admins can set this value to request apps to automatically log-out if the user hasn''t interacted with the application for the given time. This is mainly useful in webapps due to the higher likelihood of a user leaving a screen unlocked and walking away. If the value is set to null then this feature is disabled.

            '
          minimum: 5
          maximum: 1440
        loginAttemptLimit:
          type:
          - integer
          - 'null'
          example: 3
          description: Maximum number of consecutive failed login attempts within a 24 hour period that a user will be allowed before being forced to do a password reset.
          minimum: 3
          maximum: 99
        twoFactorAuthenticationForced:
          type: boolean
          description: Sets all users on the account to Two Factor Authentication.
    WeeklyScheduleDays:
      type: object
      description: Days of the week that the start and end times are applied.
      properties:
        sunday:
          type: boolean
        monday:
          type: boolean
        tuesday:
          type: boolean
        wednesday:
          type: boolean
        thursday:
          type: boolean
        friday:
          type: boolean
        saturday:
          type: boolean
    DefaultCameraSettings:
      type: object
      properties:
        cloudRetentionDays:
          description: Default number of days that recorded video will be kept in the cloud when cameras are added.
          type: integer
          example: 10
          minimum: 1
          maximum: 1825
        maximumOnPremiseRetentionDays:
          description: 'Default maximum value for the number of days that recorded video will be kept on premise. Used when new cameras are added to the system. The value cannot be lower than the `minimumOnPremiseRetentionDays`.

            '
          type: integer
          example: 14
          minimum: 0
          maximum: 365
        minimumOnPremiseRetentionDays:
          description: 'Default minimum value for the number of days that recorded video will be kept on premise. Used when new cameras are added to the system. The value cannot be grater than the `maximumOnPremiseRetentionDays`.

            '
          type: integer
          example: 7
          minimum: 0
          maximum: 180
        previewResolution:
          $ref: '#/components/schemas/PreviewResolution'
        fullVideoResolution:
          $ref: '#/components/schemas/FullVideoResolution'
        previewOnlyCloudRetention:
          $ref: '#/components/schemas/PreviewOnlyCloudRetention'
        proposedValues:
          allOf:
          - readOnly: true
          - $ref: '#/components/schemas/CameraSettingProposedValues/properties/retention'
        supportedValues:
          type: object
          readOnly: true
          properties:
            minimumOnPremiseRetentionDays:
              type: object
              properties:
                min:
                  type: integer
                  example: 0
                  minimum: 0
                  maximum: 180
                max:
                  type: integer
                  example: 180
                  minimum: 0
                  maximum: 180
            maximumOnPremiseRetentionDays:
              type: object
              properties:
                min:
                  type: integer
                  example: 0
                  minimum: 0
                  maximum: 365
                max:
                  type: integer
                  example: 365
                  minimum: 0
                  maximum: 365
            previewOnlyCloudRetention:
              type: array
              example:
              - true
              - false
              items:
                type: boolean
                enum:
                - true
                - false
            previewResolution:
              type: array
              example:
              - cif
              - std
              items:
                type: string
                enum:
                - cif
                - std
            fullVideoResolution:
              type: array
              example:
              - std
              - high
              - 1080P
