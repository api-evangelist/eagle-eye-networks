          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    VisitEvent:
      type: object
      description: Details of an entry or exit event within a visit
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the entry or exit event
          example: '2026-01-09T08:30:00.000+00:00'
        eventId:
          type: string
          description: LPR event ID associated with this entry or exit
          example: f99e57ca-b6aa-4919-a0e6-73355cf18c9e
        cameraId:
          type: string
          description: Camera ID that captured the entry or exit event
          example: 100abcde
      required:
      - timestamp
      - eventId
      - cameraId
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    VspVisit:
      type: object
      description: A visit session created by pairing LPR entry and exit events within a site
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the visit record
          example: 123e4567-e89b-12d3-a456-426614174000
        accountId:
          type: string
          description: Account ID associated with the visit
          example: '12345678'
        locationId:
          type: string
          description: Location ID where the visit occurred
          example: acd0dd1-05a0-4d75-a14b-30e0f4083c70
        plate:
          type: string
          description: License plate number of the vehicle
          example: ABC123
        entry:
          allOf:
          - $ref: '#/components/schemas/VisitEvent'
          description: Entry event details (only present when entry was recorded)
        exit:
          allOf:
          - $ref: '#/components/schemas/VisitEvent'
          description: Exit event details (only present when exit was recorded)
        durationSec:
          type:
          - integer
          - 'null'
          description: Duration of the visit in seconds
          example: 6300
        state:
          type: string
          description: 'Visit state:

            - `complete`: Entry and exit events successfully paired

            - `inProgress`: Entry event recorded, awaiting matching exit

            - `incomplete`: Exit without matching entry, or entry timed out after 24 hours'
          enum:
          - complete
          - inProgress
          - incomplete
          example: complete
      required:
      - id
      - accountId
      - locationId
      - plate
      - state
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    VspVisitsResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/VspVisit'
    PaginatedResponse:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages and, if  available, the total number of results.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken.  This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken.  This value can be null of there is no previous page.

            '
        totalSize:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: 'The number of resource entries being returned from the result set.  This can be omitted if the API endpoint does not have total size information.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
