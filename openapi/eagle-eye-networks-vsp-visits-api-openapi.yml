openapi: 3.2.0
info:
  title: VEHICLE SURVEILLANCE PACKAGE VSP Visits API
  version: 3.0.0
  description: Visit tracking and session management for LPR events at site-level.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: VSP Visits
  description: Visit tracking and session management for LPR events at site-level.
paths:
  /vspVisits:
    get:
      operationId: listVspVisits
      tags:
      - VSP Visits
      description: 'Retrieve visit records with optional filtering by plate or event ID. Visit sessions are created by pairing

        LPR entry/exit events within a site location.'
      parameters:
      - $ref: '#/components/parameters/plate2'
      - $ref: '#/components/parameters/plate__fuzzy1'
      - $ref: '#/components/parameters/locationId__in'
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: List of visit records matching search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VspVisitsResult'
              examples:
                Complete Visit:
                  value:
                    results:
                    - id: 123e4567-e89b-12d3-a456-426614174000
                      accountId: '12345678'
                      locationId: acd0dd1-05a0-4d75-a14b-30e0f4083c70
                      plate: ABC123
                      entry:
                        timestamp: '2026-01-09T08:30:00.000+00:00'
                        eventId: f99e57ca-b6aa-4919-a0e6-73355cf18c9e
                        cameraId: 100abcde
                      exit:
                        timestamp: '2026-01-09T10:15:00.000+00:00'
                        eventId: 3e4df856-11e8-46dd-90c8-2e228d771a16
                        cameraId: 100abcdf
                      durationSec: 6300
                      state: complete
                    nextPageToken: ''
                    prevPageToken: ''
                In Progress Visit:
                  value:
                    results:
                    - id: 223e4567-e89b-12d3-a456-426614174010
                      accountId: '12345678'
                      locationId: acd0dd1-05a0-4d75-a14b-30e0f4083c70
                      plate: XYZ789
                      entry:
                        timestamp: '2026-01-09T14:30:00.000+00:00'
                        eventId: f99e57ca-b6aa-4919-a0e6-73355cf18c9e
                        cameraId: 100abcde
                      state: inProgress
                    nextPageToken: ''
                    prevPageToken: ''
                Incomplete Visit:
                  value:
                    results:
                    - id: 323e4567-e89b-12d3-a456-426614174020
                      accountId: '12345678'
                      locationId: acd0dd1-05a0-4d75-a14b-30e0f4083c70
                      plate: DEF456
                      exit:
                        timestamp: '2026-01-09T12:00:00.000+00:00'
                        eventId: 3e4df856-11e8-46dd-90c8-2e228d771a16
                        cameraId: 100abcdf
                      state: incomplete
                    nextPageToken: ''
                    prevPageToken: ''
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List vsp visits
      x-summary-source: derived
