  /lprEvents:listFieldValues:
    get:
      operationId: listLprEventFieldValues
      tags:
      - LPR Events
      description: Fetches all of the possible values for each of the fields that can be used to filter LPR events.
      responses:
        '200':
          description: Success, lists field values as populated in the events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprFieldsData'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List lpr event field values
      x-summary-source: derived
  /lprEvents:summary:
    get:
      operationId: getLprEventsSummary
      tags:
      - LPR Events
      description: 'Fetches summary of lpr event counts. Query fields can control the parameters that are returned in the response body. There are 7 key attributes as follows:

        * `lastHour` : event count in last one hour.

        * `last24h` : event count in last 24 hours.

        * `today`: event count in current day from 00:00 user local time to present

        * `yesterday` : events for previous day (in user''s local time zone)

        * `last7Days` : event count in last 7 days.

        * `last30Days` : event count in last 30 days

        * `latestEventTimestamp` : timestamp of the latest event.


        At least one of these attributes must be specified for the query to return results. The attributes given apply on each camera and to a single aggregated total.'
      parameters:
      - in: query
        name: userTime
        description: The caller can also send the userTime along with timezone to the API. This will be used to calculate the current_day count (as per user local time from 00:00 midnight). Time in ISO-8601 format
        schema:
          type: string
          format: date-time
          example: '2024-08-08T07:57:37.000+00:00'
      - in: query
        name: include
        style: form
        explode: false
        description: Provide fields to be returned in response body
        schema:
          type: array
          items:
            type: string
            enum:
            - today
            - yesterday
            - lastHour
            - last24h
            - last7Days
            - last30Days
            - latestEventTimestamp
      - in: query
        name: groupBy
        description: If defined with `actorId` as value, the values are grouped per actor. If not defined, the counts will be aggregated to a single value for all actors.
        schema:
          type: string
          enum:
          - actorId
      - $ref: '#/components/parameters/plateConfidence__lte'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/type__in'
      responses:
        '200':
          description: Events summary as requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprSummaryData'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get lpr events summary
      x-summary-source: derived
