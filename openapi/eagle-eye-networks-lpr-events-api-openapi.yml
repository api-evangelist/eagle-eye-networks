      - bodyType
      - insightType
      - userTags
      title: LprFieldsData
    BaseDataObject:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: 'Specific data schema type, eg `een.lprDetection.v1` which describes what other fields will exist in this object.

            '
        creatorId:
          type: string
          description: Id of the application or system that created this piece of information, generally the same as the `creatorId` of the event itself. This field allows clients to disambiguate data from multiple sources in the same event.
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    AccessType:
      type: string
      enum:
      - allow
      - deny
      - 'null'
    EenDotNumberRecognitionV1:
      allOf:
      - $ref: '#/components/schemas/ObjectEnvelopeDataObject'
      - type: object
        description: Details about the dot number that was detected.
        required:
        - type
        - regNumber
        - objectId
        properties:
          type:
            type: string
            enum:
            - een.dotNumberRecognition.v1
          regNumber:
            type: string
            description: This is the detected registration number of the vehicle.
            example: '1752035'
          regNumberConfidence:
            description: The confidence of the number read reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.99
            minimum: 0
            maximum: 1
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    BoundingBoxV1:
      type: array
      description: 'Array of 4 floats describing a bounding box around the object of interest. Note that the percentage defined below

        is as a decimal value between 0 and 1. This means 55% would have to be provided as 0.55.

        * First - top left corner horizontal position (from left) as a percentage of the image width.

        * Second - top left corner vertical position (from top) as a percentage of the total image height.

        * Third - bottom right corner horizontal position (from left) as a percentage of the image width.

        * Fourth - bottom right corner vertical position (from top) as a percentage of the image height.'
      minItems: 4
      maxItems: 4
      items:
        type: number
        format: double
        minimum: 0
        maximum: 1
    EenUserDataV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: "Object containing all user information associated with the specific event. For example, for a plate read, this would contain user supplied attributes for the given plate like apartment number. the following are the guidelines for supplying User Data:\n  * Fields Should be in camelCase\n  * Maximum of 5 unique keys.\n  * Each key or value should have only 256 characters max."
        example:
          type: een.userData.v1
          creatorId: een.lpr
          apartmentNum: 105A
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - een.userData.v1
    EenLprAccessTypeV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: 'Lists are maintained about known vehicles and this object describes if a known vehicle should be allowed or denied according to these lists.

          '
        required:
        - type
        - accessType
        - vehicleListId
        properties:
          type:
            type: string
            enum:
            - een.lprAccessType.v1
          accessType:
            type: string
            description: Denotes the access type the vehicle list set for the vehicle that triggered the event.
            enum:
            - allow
            - deny
            example: allow
            x-filterable: true
          vehicleListId:
            type: string
            format: uuid
            description: Vehicle list Id which matched this event
            example: b38cd9db-d8e2-40cf-bcae-415d68fbfb7b
    LprPlateReadEvent:
      description: 'Generated when the camera captures a license plate of a passing vehicle. It can either be a span event or a point event. When the event is a span event, it represents the time period during which the vehicle was detected, here event will have different start and end time. When the event is a point event, it is the time of plate read trigger and both start and end times would be same.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - properties:
          type:
            type: string
            enum:
            - een.lprPlateReadEvent.v1
          data:
            type: array
            items:
              anyOf:
              - $ref: '#/components/schemas/EenObjectDetectionV1'
              - $ref: '#/components/schemas/EenLprDetectionV1'
              - $ref: '#/components/schemas/EenVehicleAttributesV1'
              - $ref: '#/components/schemas/EenLprAccessTypeV1'
              - $ref: '#/components/schemas/EenUserDataV1'
              - $ref: '#/components/schemas/EenUserTagsV1'
              - $ref: '#/components/schemas/EenCroppedFrameImageUrlV1'
              - $ref: '#/components/schemas/EenFullFrameImageUrlV1'
              - $ref: '#/components/schemas/EenCreatorDetailsV1'
              - $ref: '#/components/schemas/EenDisplayOverlayBoundingBoxV1'
              - $ref: '#/components/schemas/EenFullFrameImageUrlWithOverlayV1'
              - $ref: '#/components/schemas/EenVehicleListInfoV1'
              - $ref: '#/components/schemas/EenResourceDetailsV1'
              - $ref: '#/components/schemas/EenVspInsightsSummaryInfoV1'
    EenTruckNumberRecognitionV1:
      allOf:
      - $ref: '#/components/schemas/ObjectEnvelopeDataObject'
      - type: object
        description: Details about the truck number that was detected.
        required:
        - type
        - regNumber
        - objectId
        properties:
          type:
            type: string
            enum:
            - een.truckNumberRecognition.v1
          regNumber:
            type: string
            description: This is the detected registration number of the vehicle.
            example: '1752035'
          regNumberConfidence:
            description: The confidence of the number read reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.99
            minimum: 0
            maximum: 1
    ObjectIdV1:
      type: string
      description: 'ID given to the object by the detector. It is namespaced with a prefix to guarantee uniqueness while not

        needing different detectors like camera, edge based algorithms and cloud based algorithms to coordinate.

        The the prefix is followed by a colon and then the unique (within the namespace) id of the object.'
      pattern: ^.*:.*$
      example: camera-46743c2:d3275d08-16df-4176-b9c6-688046c858a2
    vehicleRecognitionEvent:
      allOf:
      - type: object
        title: VehicleRecognitionEvent
        description: Generated when the camera captures a license plate of a passing vehicle. It represents a single point in time.
        required:
        - id
        oneOf:
        - $ref: '#/components/schemas/LprPlateReadEvent'
        - $ref: '#/components/schemas/FleetCodeRecognitionEvent'
        discriminator:
          propertyName: type
          mapping:
            een.lprPlateReadEvent.v1: ../event/events/een.lprPlateReadEvent.v1.yaml
            een.fleetCodeRecognitionEvent.v1: ../event/events/een.fleetCodeRecognitionEvent.v1.yaml
    LprSummaryAggregate:
      type: object
      properties:
        actorId:
          type: string
          example: 100b913c
          description: ESN of the camera to which the following event counts belong to or `all` for the aggregate summary
        latestEventTimestamp:
          type: string
          format: date-time
          description: Timestamp of the latest event
        lastHour:
          type: integer
          description: Count of events in last hour
        last24h:
          type: integer
          description: Count of events in last 24 hours
        today:
          type: integer
          description: Count of events for the current day of the user (in user's local time)
        yesterday:
          type: integer
          description: Count of events for the previous day of the user (in user's local time)
        last30Days:
          type: integer
          description: Count of events for the previous 30 days. This is independent of local time.
        last7Days:
          type: integer
          description: Count of events for previous 7 days. This is independent of local time.
      title: LprSummaryAggregate
    EenUserTagsV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: Tags containing all user information associated with the specific vehicle entry.
        example:
          type: een.userTags.v1
          creatorId: een.lpr
          tag: 105A
        required:
        - type
        properties:
          type:
            type: string
          tag:
            type: string
            description: Tag provided by user for a vehicle entry
    EntityDescriptor:
      type: object
      properties:
        display:
          type: string
          description: Value to be used for presenting in UI
        value:
          type: string
          description: Value to be used for backend processing
    LprSearchResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/LprEventResult'
    EenVehicleAttributesV1:
      allOf:
      - $ref: '#/components/schemas/ObjectEnvelopeDataObject'
      - type: object
        description: 'Attributes of the vehicle that created the LPR event.

          '
        required:
        - type
        - objectId
        properties:
          type:
            type: string
            enum:
            - een.vehicleAttributes.v1
          timestamp:
            type: string
            format: date-time
            description: Optional timestamp of the frame at which these attributes were inferred.
          color:
            type: string
            x-filterable: true
            allOf:
            - description: Enumerations of standard colors for vehicles.
            - $ref: '#/components/schemas/VehicleColorDefinitions'
          colorConfidence:
            description: Confidence of the color classification reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.89
            minimum: 0
            maximum: 1
            x-filterable: true
          colorRgb:
            description: Optional RGB color values for the vehicle color. Preserves precise color data.
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 255
            minItems: 3
            maxItems: 3
            example:
            - 255
            - 0
            - 0
          make:
            type: string
            x-filterable: true
            allOf:
            - description: Make of the vehicle
            - $ref: '#/components/schemas/VehicleMakeDefinitions'
          makeDisplay:
            type: string
            readOnly: true
            description: UI ready display name of the make of the vehicle
            example: Toyota
            x-filterable: true
          makeConfidence:
            description: The confidence of the make classification reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.87
            minimum: 0
            maximum: 1
            x-filterable: true
          model:
            type: string
            description: Model of the vehicle
            example: Camry
            x-filterable: true
          modelConfidence:
            description: The confidence of the model classification reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.75
            minimum: 0
            maximum: 1
            x-filterable: true
          bodyType:
            type: string
            x-filterable: true
            allOf:
            - description: Type of the vehicle
            - $ref: '#/components/schemas/VehicleBodyTypeDefinitions'
          bodyTypeDisplay:
            type: string
            readOnly: true
            description: UI ready display name of the bodyType of the vehicle
            example: Truck
            x-filterable: true
          bodyTypeConfidence:
            description: The confidence of the body type classification reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.67
            minimum: 0
            maximum: 1
            x-filterable: true
          year:
            type: integer
            description: Year of production
            example: 2007
            x-filterable: true
          yearConfidence:
            description: The confidence of the year classification reported as a float value between 0 and 1.
            type: number
            example: 0.56
            format: float
            minimum: 0
            maximum: 1
            x-filterable: true
          orientation:
            type: string
            description: Orientation of vehicle w.r.t. the camera. In other words, it describes how the camera viewed a specific vehicle.
            enum:
            - front
            - rear
            - side
            example: rear
            x-filterable: true
          parked:
            type: boolean
            description: Information regarding whether the vehicle is parked or not
            x-filterable: true
          parkedConfidence:
            type: number
            description: The confidence on the value of `parked` key reported as a float value between 0 and 1.
            format: float
            example: 0.75
            minimum: 0
            maximum: 1
            x-filterable: true
    ColorDefinitions1:
      type: string
      description: Standard color enumerations used across all object classes (person, vehicle, etc.).
      enum:
      - beige
      - black
      - blue
      - brown
      - burgundy
      - gold-beige
      - green
      - gray
      - silver
      - silver-gray
      - maroon
      - orange
      - pink
      - purple
      - red
      - teal
      - white
      - yellow
      example: white
    EenTrailerNumberRecognitionV1:
      allOf:
      - $ref: '#/components/schemas/ObjectEnvelopeDataObject'
      - type: object
        description: Details about the trailer number that was detected.
        required:
        - type
        - regNumber
        - objectId
        properties:
          type:
            type: string
            enum:
            - een.trailerNumberRecognition.v1
          regNumber:
            type: string
            description: This is the detected registration number of the vehicle.
            example: '1752035'
          regNumberConfidence:
            description: The confidence of the number read reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.99
            minimum: 0
            maximum: 1
    EventEnvelopeParent:
      type: object
      description: Parent for envelope for een events
      required:
      - startTimestamp
      - endTimestamp
      - span
      - actorId
      - actorType
      - creatorId
      - type
      - dataSchemas
      - data
      properties:
        id:
          type: string
          description: System wide unique id of the event
          readOnly: true
        startTimestamp:
          type: string
          format: date-time
          description: Time at which the event starts.
        endTimestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: Time at which the event ended. If null, the event is ongoing.
        span:
          type: boolean
          description: True if the event describes a period of time instead of a single moment in time.
        accountId:
          type: string
          description: 'Id of the account the event belongs in. This can be a different account than the account of the actor that changed as part of the event, see the `actorAccountId` description for more details.

            '
        actorId:
          type: string
          description: 'Id of the entity that changed as part of the event, such as a camera id, user id, or account id. This id represents the specific entity that underwent a change, triggering the event notification.

            '
        actorAccountId:
          type: string
          description: 'Id of the account to which the changed actor belongs. This might be different from the `accountId` field in cases where one account is helping to manage another one. For example, a reseller that manages the bridges for one of their end-users would want to get alerts in their own account (`accountId`) that are about bridges located in their end-user''s account (actorAccountId).

            '
        actorType:
          type: string
          enum:
          - bridge
          - camera
          - multiCamera
          - speaker
          - account
          - user
          - layout
          - job
          - measurement
          - sensor
          - gateway
          - accessControlPoint
          - location
          default: camera
          description: Type of actor that changed, triggering the event.
        creatorId:
          type: string
          default: unknown
          description: Id of the application or system that created this event. This id should not differ between instances or even versions of the same application.
        type:
          type: string
          description: Specific event type, e.g. een.motionDetectionEvent.v1, een.lprPlateReadEvent.v1
        dataSchemas:
          type: array
          items:
            type: string
          description: List of all data schema types that can be found in this event.
          example:
          - een.objectDetection.v1
          - een.objectClassification.v1
          - een.lprDetection.v1
          - een.personAttributes.v1
          - een.vehicleAttributes.v1
          - een.fullFrameImageUrl.v1
          - een.croppedFrameImageUrl.v1
          - een.objectRegionMapping.v1
          - een.eevaAttributes.v1
          - een.customLabels.v1
        data:
          type: array
          description: 'Event specific data given as an array of objects that have a `type` field indicates the schema of the value.

            '
          items:
            $ref: '#/components/schemas/BaseDataObject'
    EenFullFrameImageUrlV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: Details about the full frame image url related to the event.
        required:
        - type
        - httpsUrl
        - timestamp
        properties:
          type:
            type: string
            enum:
            - een.fullFrameImageUrl.v1
          httpsUrl:
            type: string
            format: url
            description: Link to obtain the full frame image related to this event.
            example: https://media.c001.eagleeyenetworks.com/assets/events/lpr/plate/4333af21c0-4335312343521312213.jpeg
          timestamp:
            type: string
            format: date-time
            description: Timestamp of the frame from which the crop was made.
          feedType:
            type: string
            enum:
            - main
            - preview
            description: "Multiple video feeds can be published per source, but they should all have the same viewpoint. They can differ in resolution:\n  * `main` is higher resolution and high framerate.\n  * `preview` is low resolution and low framerate.\n"
    LprSummaryData:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/LprSummaryAggregate'
    ObjectEnvelopeDataObject:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        properties:
          objectId:
            $ref: '#/components/schemas/ObjectIdV1'
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    EenFleetCodeRecognitionV1:
      allOf:
      - $ref: '#/components/schemas/ObjectEnvelopeDataObject'
      - type: object
        description: Details about the extra text that was detected from vehicle.
        required:
        - type
        - value
        - objectId
        properties:
          type:
            type: string
            enum:
            - een.recognizedText.v1
          value:
            type: string
            description: This is the recognized text.
            example: ABC123
          valueConfidence:
            description: The confidence of the recognized text as a float value between 0 and 1.
            type: number
            format: float
            example: 0.99
            minimum: 0
            maximum: 1
    PaginatedResponse:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages and, if  available, the total number of results.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken.  This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken.  This value can be null of there is no previous page.

            '
        totalSize:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: 'The number of resource entries being returned from the result set.  This can be omitted if the API endpoint does not have total size information.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    EenLprDetectionV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: Metadata specific to LPR attributes
        required:
        - type
        - plate
        properties:
          type:
            type: string
            enum:
            - een.lprDetection.v1
          timestamp:
            type: string
            format: date-time
            description: Optional timestamp of the frame for which the plate recognition was done.
            example: '2021-04-22T00:00:00.000+00:00'
          plateBoundingBox:
            allOf:
            - $ref: '#/components/schemas/BoundingBoxV1'
            - description: References the bounding box of the license plate.
          plate:
            type: string
            description: This is the plate read in uppercase
            example: ABC1234
            x-filterable: true
          plateConfidence:
            description: The confidence of the plate read reported as a float value between 0 and 1.
            type: number
            format: float
            example: 0.99
            minimum: 0
            maximum: 1
            x-filterable: true
          plateRegion:
            type:
            - string
            - 'null'
            description: This is the state that the plate belongs to. This is compliant to ISO 3166.2 specification
            example: US-NY
            x-filterable: true
          plateRegionConfidence:
            description: The confidence of the plate region classification reported as a float value between 0 and 1.
            type:
            - number
            - 'null'
            format: float
            example: 0.93
            minimum: 0
            maximum: 1
          direction:
            type: string
            description: Denotes the direction of the vehicle, Entry or Exit
            enum:
            - entry
            - exit
            example: exit
            x-filterable: true
          isWrongDirection:
            type: boolean
            description: Indicates if the vehicle is traveling in the wrong direction or not
            example: true
            x-filterable: true
    EenFullFrameImageUrlWithOverlayV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: Provides URLs for retrieving a full-frame image related to an event, with SVG overlays.
        required:
        - type
        - overlaySvgHeaderUrl
        properties:
          type:
            type: string
            enum:
            - een.fullFrameImageUrlWithOverlay.v1
          overlaySvgHeaderUrl:
            type: string
            format: url
            description: Link to obtain the svg overlay through `X-Een-OverlaySvg` header containing the overlays as a SVG image.
            example: https://media.c001.eagleeyenetworks.com/api/v3.0/media/recordedImage.jpeg?type=preview&deviceId=1002931e&include=overlaySvgHeader&overlayId__in=een.motionDetectionEvent.v1&timestamp__gt=2024-12-05T15%3A20%3A59.829%2B00%3A00
          overlayEmbeddedUrl:
            type: string
            format: url
            description: Link to obtain the svg overlay on top of the source image resulting in a single jpeg.
            example: https://media.c001.eagleeyenetworks.com/api/v3.0/media/recordedImage.jpeg?type=preview&deviceId=1002931e&include=overlayEmbedded&overlayId__in=een.motionDetectionEvent.v1&timestamp__gt=2024-12-05T15%3A20%3A59.829%2B00%3A00
    VehicleColorDefinitions:
      allOf:
      - $ref: '#/components/schemas/ColorDefinitions1'
      - description: Enumerations of standard colors for vehicles.
    EenDisplayOverlayBoundingBoxV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: 'It represents the overlays data that can be used to overlay displays for a particular event type, from the bounding boxes. This can include details such as labels, bounding boxes, and other relevant visual markers.

          '
        required:
        - type
        - overlays
        properties:
          type:
            type: string
            enum:
            - een.displayOverlay.boundingBox.v1
          overlays:
            type: array
            description: A list of overlay data available for the event.
            items:
              type: object
              required:
              - label
              - timestamp
              - labelLocation
              - color
              - lineWidth
              - boundingBox
              properties:
                label:
                  type: string
                  description: "The label to be displayed at the specified location based on the event type. \n"
                timestamp:
                  type: string
                  format: date-time
                  description: 'The timestamp for which the bounding box display overlay is valid. Format is ISO 8601.

                    '
                labelLocation:
                  type: string
                  description: 'The location where the label will be displayed.

                    '
                  enum:
                  - topLeft
                color:
                  type: string
                  format: color
                  example: '#C0DF16'
                  description: 'The color code in hex format for the bounding box (outline). In SVG or CSS, this corresponds to the `stroke` property.

                    '
                lineWidth:
                  type: integer
                  description: 'The width of the line for the bounding box based on factors like object size, priority and event type, specified in normalized units. This value represents a fraction of the overall size of the display area. For example, a value of 0.03 means the line will be 3% of the total width or height of the display area. In SVG or CSS, this corresponds to the `stroke-width` property.

                    '
                boundingBox:
                  $ref: '#/components/schemas/BoundingBoxV1'
    EenVspInsightsSummaryInfoV1:
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: Object containing the insights details generated by the VSP package for a License Plate Recognition (LPR) event. These insights provide information such as first-time appearances, hotlist matches, or count of occurrences.
        example:
          type: een.vspInsightsSummary.v1
          insightType: visitorType
          label: Visitor Type
          value: frequent
          description: Frequent visitor (weekly pattern)
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - een.vspInsightsSummary.v1
          insightType:
            type: string
            description: "A short identifier representing the type of insight. Example values include:\n  - `visitorType`: Classification of visitor - \"new\" for first visit within the retention period, \"frequent\" for vehicle occurring weekly within the retention period\n  - `visitCount`: Count of total visits (entry & exit pairs) in the last 7 days\n  - `avgDurationSec`: Average duration of visits in seconds based on visits in the last 7 days\n  - `new`: First appearance of the plate (legacy)\n  - `count`: Indicates number of times the vehicle has been seen (legacy)\n  - `hotlist`: hotlisted vehicle (legacy)\n"
          label:
            type:
            - string
            - 'null'
            description: 'User-friendly label for displaying the insight type. Examples: "Visitor Type", "Total Visits", "Average Duration"

              '
          value:
            type:
            - string
            - 'null'
            description: 'Optional value associated with the insightType.

              '
          description:
            type: string
            description: 'Human-readable explanation of the insight, intended for end users. A single tag can have multiple different descriptions, depending on the context or additional data associated with the insight.

              '
    VehicleBodyTypeDefinitions:
      type: string
      description: 'Enumerations of standard classes for vehicles. Warning: These body types are subject to future modifications

        '
      enum:
      - motorbike
      - car
      - bus
      - truck
      - sedan
      - hatchback
      - coupe
      - convertible
      - minivan
      - wagon
      - trike
      - roadster
      - crossover
      - scooter
      - sports_car
      - van
      - bicycle
      - tukTuk
      - suv
      - pickupTruck
      - forklift
      - others
      example: car
    EenVehicleListInfoV1:
      readOnly: true
      allOf:
      - $ref: '#/components/schemas/BaseDataObject'
      - type: object
        description: Provides details of vehicle lists that include a license plate for which an LPR event was triggered. This is a system-generated data schema and cannot be created using POST API calls.
        example:
          type: een.vehicleListInfo.v1
          vehicleListId: 5de856b5-f450-4f47-bdcf-816ce8a353e2
          vehicleListName: Employee list
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - een.vehicleListInfo.v1
          vehicleListId:
            type: string
            description: The unique uuid of the vehicle list
          vehicleListName:
            type: string
            description: The user defined name of the vehicle list
    Actor:
      type: object
      description: Specifies the complete attributes of an actor, including the user-supplied field `name`
      allOf:
      - $ref: '#/components/schemas/ActorFilter'
      - type: object
        properties:
