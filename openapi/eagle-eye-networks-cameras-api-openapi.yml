    ApiRegistrationStrategy:
      type: string
      enum:
      - bridge
      - rtspUrl
      - cameraDirect
      - channel
      description: "Cameras can be added in multiple ways, and this field indicates how this specific camera should be added. Possible methods:\n * `bridge`: Associate a camera found with `GET /api/v3.0/availableDevices` with one of the bridges that found it.\n * `rtspUrl`: Define a camera by giving a RTSP URL to retrieve its live stream and the bridge that should connect to it.\n * `cameraDirect`: Register a camera by its MAC address regardless of its physical location and without needing a bridge.\n * `channel`: Associate a channel camera with its parent multi camera.\n"
    WeeklyScheduleHours:
      type: object
      description: "Times that the schedule starts and ends. If the start time is greater than the end time, the interval is considered to cover the remaining time of the day from the start time until 24:00, and then from 00:00 to the end time. \nFor example, start: 16:30 and end: 06:00 on monday means the interval covers from 16:30 to 24:00 and continues from 00:00 to 06:00 on the same day (monday).\n"
      properties:
        start:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day.
          minLength: 5
          maxLength: 5
        end:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day.
          minLength: 5
          maxLength: 5
      required:
      - start
      - end
    ScheduledOverride:
      type:
      - object
      - 'null'
      required:
      - 'on'
      - schedule
      description: 'Defines a scheduled override to the operating settings,  allowing the user to for example turn a camera off during specified hours of the day.

        '
      properties:
        'on':
          $ref: '#/components/schemas/On'
        schedule:
          $ref: '#/components/schemas/WeeklyScheduleAllRequired'
    PreviewResolutionsItem:
      type: object
      properties:
        width:
          type: integer
          example: 640
        height:
          type: integer
          example: 360
        qualities:
          $ref: '#/components/schemas/PreviewResolutionQualities'
    DeviceConnectionStatus:
      type: string
      description: "Indicates the connection status of the device:\n  * `online`: The device is online and operational.\n  * `deviceOffline`: The device is offline.\n  * `invalidCredentials`: The known credentials for this device, including the default credentials, are invalid. This is causing the device to appear offline.\n  * `bridgeOffline`: The bridge that connects this device to the cloud is offline. However, both the device and the bridge may still be operational locally, even though the cloud has no visibility into their status.\n  * `off`: The device is online, but has been turned off by the user.\n  * `error`: The device is offline due to some problem that has not been described by any of the other statuses.\n  * `busy`: The device is currently busy and unavailable for other operations.\n  * `unknown`: The device state is unknown for some reason.\n"
      enum:
      - online
      - deviceOffline
      - invalidCredentials
      - bridgeOffline
      - 'off'
      - error
      - busy
      - unknown
    ApiDevicePosition:
      type: object
      x-jsoninclude-nonnull-annotation: true
