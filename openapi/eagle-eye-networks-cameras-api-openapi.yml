    Retention:
      type: object
      properties:
        cloudDays:
          type: integer
          minimum: 1
          description: Number of days that recorded video will be kept in the cloud.
        cloudPreviewOnly:
          type: boolean
          description: 'Allows previews to be transmitted to cloud while keeping full video locally on the CMVR. This setting is only available for cameras attached to a CMVR.

            '
        minimumOnPremiseDays:
          minimum: 0
          type: integer
          description: 'The number of days that recorded video will be kept on premise. The minimum on premise retention should be less than the maximum on premise retention. If the CMVR runs out of disk space it will delete old video to make room for the new —  even if it must delete video within this retention period.  If the local CMVR hard drive fills before the Minimum On Premise Retention is  met, it will be displayed in camera metrics under delta storage  as well as bridge metrics under delta storage as a purge. Recordings won''t be stored on premise if this setting will be set to 0. This setting is only available for cameras attached to a CMVR.

            '
        maximumOnPremiseDays:
          type: integer
          minimum: 0
          maximum: 5
          description: 'The maximum on premise retention should be greater than the minimum on premise retention. Video will be kept on the CMVR for as long as possible up to the maximum,  then it is deleted to make room for new video.  There is no notification or graphical display of purge for the Maximum On Premise Retention. Setting this value to 0 will remove limit for maximum retention. This setting is only available for cameras attached to a CMVR.

            '
        alwaysRecordingDays:
          type: integer
          minimum: 0
          description: 'This setting is only available if `captureMode` is set to record `always`; If this setting is set to 0 then it means that it is disabled and recordings are stored based on retention settings. It sets how many days the video is kept. After “x” days, the recordings without motion or events will be purged. Recordings with motion or events will be kept for the set retention time.

            '
