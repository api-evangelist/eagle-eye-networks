            minimumOnPremiseDays:
              description: "Proposed set of minimum on-premise retention days the user could choose between. \nKeep in mind that the minimum on-premise retention days value should be less than the maximum on-premise retention days value.\n"
              type: array
              items:
                type: integer
              example:
              - 0
              - 1
              - 2
              - 3
              - 5
              - 7
              - 14
              - 28
              - 30
              - 31
              - 60
              - 90
              - 180
            maximumOnPremiseDays:
              description: 'Proposed set maximum on-premise retention days the user could choose between.

                Keep in mind that the minimum on-premise retention days value should be less than the maximum on-premise retention days value.

                '
              type: array
              items:
                type: integer
              example:
              - 0
              - 1
              - 2
              - 3
              - 5
              - 7
              - 14
              - 28
              - 30
              - 31
              - 60
              - 90
              - 180
              - 365
    PreviewVideo:
      type: object
      properties:
        transmitMode:
          type: string
          enum:
          - onDemand
          - always
          - background
          - event
          description: 'Controls when the preview video is sent to the cloud data center.  The recommended mode is Always. Always means that the Preview Video is immediately sent to the cloud, but it can be limited by the bridge bandwidth. On Demand means that the Preview Video is only sent to the cloud when it is being displayed in the VMS. Event means that the Preview Video is only sent to the cloud when an event occurs on the recording. Background means that the Preview Video is only sent when bandwidth is available on the schedule for the bridge. Options ''background'' and ''event'' could lead to a bad user experience and because of this are not presented on the main VMS UI.

            '
        resolution:
          type: string
          example: std
          description: Resolution of the preview video that will be recorded. Possible values can be found in the `supportedResolutions` field.
        intervalMs:
          type: integer
          description: 'Specifies the time interval in milliseconds between frames for the preview video. 1000ms is recommended. Lowering the value increases bandwidth usage.

            '
          example: 250
          minimum: 250
          maximum: 16000
        quality:
          type: string
          example: low
          description: 'Controls the amount of compression on the preview video. Default quality will reduce bandwidth the most. Use extreme caution when increasing it,  as exceeding available bandwidth can prevent all video from being transmitted to the cloud. Possible values can be found in the `supportedResolutions` field.

            '
        supportedResolutions:
          $ref: '#/components/schemas/PreviewResolutions'
    ApiDewarpConfigPane:
      type: object
      required:
      - x
      - y
      - width
      - height
      - fov
      - lookAt
      properties:
        x:
          type: string
          description: Top left x coordinate of pane relative to top left of composite
          example: 50%
        y:
          type: string
          description: Top left y coordinate of pane relative to top left of composite
          example: 50%
        width:
          type: string
          description: Width of pane inside of composite
          example: 50%
        height:
          type: string
          description: Height of pane inside of composite
          example: 50%
        shader:
          type: string
          description: The shader used to present the pane
          enum:
          - sphere
          - panorama
          example: sphere
        fov:
          type: number
          description: The field of view in degrees of the rendered view. This primarily controls zoom.
          example: 45
        lookAt:
          description: The direction the camera will be pointed within the pane. Values are generated by the dewarp library.
          allOf:
          - $ref: '#/components/schemas/ApiDewarpConfigVector3'
    ApiCameraImageTuningCapabilities:
      type: object
      properties:
        continuousZoom:
          type: boolean
          description: 'Indicates that the camera supports image tuning with continuous zooming.

            '
          default: false
    ApiBaseCameraCreate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/DeviceName'
        tags:
          $ref: '#/components/schemas/DeviceTags'
        locationId:
          $ref: '#/components/schemas/LocationId'
        devicePosition:
          $ref: '#/components/schemas/ApiDevicePosition'
        deviceAddress:
          $ref: '#/components/schemas/DeviceAddress'
    MainVideo:
      type: object
      properties:
        transmitMode:
          type: string
          enum:
          - onDemand
          - background
          - event
          - always
          description: 'Controls when the Main Video is sent to the cloud data center. The recommended value is Background. Always means that the video is immediately sent to the cloud, but it can be limited by the bridge bandwidth.  This can affect available bandwidth for the business. Background means that the video is only sent when bandwidth is available on the schedule for the bridge. On Demand means that the video is only sent to the cloud when it is being displayed in the VMS. Event means that the video is only sent to the cloud when an event occurs on the recording. Options ''always'' and ''event'' could lead to a bad user experience and because of this are not presented on the main VMS UI.

            '
        resolution:
          type: string
          example: 3MP
          description: 'Resolution that will be used for full frame rate H.264 recording. Possible values can be found in the `supportedResolutions` field.

            '
        quality:
          type: string
          example: high
          description: 'Controls the compression rate and the frame rate on the H.264 recording. We recommend Low or Medium.  Make certain you have adequate bandwidth before changing the setting higher than Low.  Misconfiguration can prevent all video from being transmitted to the cloud.  Possible values can be found in the `supportedResolutions` field.

            '
        kbpsFactor:
          type: integer
          example: 1
          description: 'It refers to how the camera can process the image it''s recording. It also controls the compression rate of the video recording. The setting depends greatly on the camera. We recommend leaving this at its default value.

            '
        captureMode:
          type: string
          enum:
          - event
          - always
          description: 'Configures when the Main Video is recorded.  By default, recording is only done when there is an event detected.  This is usually when motion or an analytic event is detected. However, you can choose Always to record Main Video continuously.  Use extreme caution if setting to Always, as this can use a large amount of bandwidth,  which could prevent some video from being transmitted to the cloud or result in early deletion due to filled up on-premise storage.  Make certain there is enough upload bandwidth if using this setting.

            '
        supportedResolutions:
          $ref: '#/components/schemas/MainVideoResolutions'
    ApiAdapterInfo:
      type: object
