    Imaging:
      type: object
      description: 'Camera imaging sensor settings. Not all properties are supported by every camera. Only properties supported by the specific camera will appear in the response. Use `?include=schema` to discover which properties a camera supports and their allowed values. The schema endpoint returns camera-specific ranges and enum values that may be a subset of what is documented here.

        '
      properties:
        brightness:
          type: number
          format: double
          description: 'Overall luminance level of the captured image. Higher values produce a brighter image; lower values produce a darker image. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        contrast:
          type: number
          format: double
          description: 'Difference in luminance between shadows and highlights. Higher values increase separation between dark and light areas. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        saturation:
          type: number
          format: double
          description: 'Intensity of colors. Lower values shift toward grayscale; higher values produce more vivid colors. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        sharpness:
          type: number
          format: double
          description: 'Edge enhancement applied to the image. Higher values increase definition of fine detail but may introduce artifacts at extremes. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        exposureMaxGain:
          type: number
          format: double
          description: 'Maximum gain ceiling for auto-exposure. Limits how much electronic amplification the camera applies in low light. Lower values reduce noise at the cost of darker images; higher values allow brighter images but with more noise. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        irCutFilter:
          type: string
          description: 'Infrared cut filter mode. `on` blocks infrared for accurate daytime color; `off` allows infrared through for improved low-light sensitivity; `auto` switches based on scene conditions. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - auto
          - 'on'
          - 'off'
        wideDynamicRange:
          type: string
          description: 'Wide dynamic range mode. Captures detail in both very bright and very dark areas of the same scene simultaneously. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - 'on'
          - 'off'
        wideDynamicRangeLevel:
          type: number
          format: double
          description: 'Strength of WDR processing. Only effective when wideDynamicRange is on. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        whiteBalanceMode:
          type: string
          description: 'White balance mode. `auto` tracks and adjusts to changing light conditions. `manual` holds a fixed color point using the gain values in whiteBalanceRedGain and whiteBalanceBlueGain. `rbgain` is a camera-specific mode that enables direct R/B gain ratio control; use the schema endpoint to check if available. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - auto
          - manual
          - rbgain
        whiteBalanceRedGain:
          type: number
          format: double
          description: 'Red channel gain. Active when whiteBalanceMode is manual or rbgain. Increasing this value warms the image. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        whiteBalanceBlueGain:
          type: number
          format: double
          description: 'Blue channel gain. Active when whiteBalanceMode is manual or rbgain. Increasing this value cools the image. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        exposureMode:
          type: string
          description: 'Exposure control mode. `auto` lets the camera determine exposure; `manual` uses the shutter speed set in exposureTime. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - auto
          - manual
        exposureTime:
          type: string
          description: 'Shutter speed as a fraction string (e.g. 1/1000). Only effective when exposureMode is manual. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          example: 1/1000
        rotation:
          type: string
          description: 'Image rotation in degrees applied clockwise. Use when the camera is physically mounted at an angle. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - '0'
          - '90'
          - '180'
          - '270'
        mirror:
          type: string
          description: 'Flips the image horizontally, producing a left-right mirror image. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - 'on'
          - 'off'
        flip:
          type: string
          description: 'Flips the image vertically. Use when the camera is mounted upside down. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - 'on'
          - 'off'
        backlightCompensation:
          type: string
          description: 'Backlight compensation mode. Adjusts exposure to prevent subjects in front of a bright background from appearing as silhouettes. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - 'on'
          - 'off'
        noiseReductionLevel:
          type: number
          format: double
          description: 'Strength of digital noise reduction. Higher values produce a cleaner image in low light but may soften fine detail or introduce motion artifacts. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        defoggingMode:
          type: string
          description: 'Electronic defogging mode. Enhances contrast and visibility in scenes obscured by fog, haze, or smoke. `auto` applies defogging as needed; `on` enables it continuously; `off` disables it. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - auto
          - 'on'
          - 'off'
        defoggingLevel:
          type: number
          format: double
          description: 'Strength of defogging processing. Only effective when defoggingMode is on. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: 0
          maximum: 100
          example: 50
        dayNightMode:
          type: string
          description: 'Day/night switching mode. `day` forces color output; `night` forces monochrome for maximum low-light sensitivity; `auto` switches based on scene brightness. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - auto
          - day
          - night
        dayNightSensitivityDayToNight:
          type: string
          description: 'How readily the camera transitions from color to monochrome as light falls. `low` requires a larger drop before switching; `medium` switches at a moderate threshold; `high` switches earlier. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - low
          - medium
          - high
        dayNightSensitivityNightToDay:
          type: string
          description: 'How readily the camera transitions from monochrome back to color as light rises. `low` requires a larger increase before switching; `medium` switches at a moderate threshold; `high` switches earlier. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - low
          - medium
          - high
        focusMode:
          type: string
          description: 'Focus control mode. `auto` continuously adjusts focus based on scene content; `manual` holds the current focus position. Not all values are supported by every camera. Use `?include=schema` to discover the values supported by a specific camera.

            '
          enum:
          - auto
          - manual
        focusDefaultSpeed:
          type: number
          format: double
          description: 'Default speed used for focus motor movements when no explicit speed is provided with a focus command. Higher values produce faster lens movement. The value is a magnitude, not a direction. Only effective when focusMode is manual. Not all cameras support this property. Use `?include=schema` to confirm availability and the valid range for a specific camera.

            '
          minimum: -1
          maximum: 1
          example: 0.5
