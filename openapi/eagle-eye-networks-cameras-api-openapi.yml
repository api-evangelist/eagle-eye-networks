openapi: 3.2.0
info:
  title: DEVICES Cameras API
  version: 3.0.0
  description: All core operations on cameras.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Cameras
  description: All core operations on cameras.
paths:
  /cameras:
    get:
      operationId: listCameras
      description: 'This endpoint allows you to retrieve a list of cameras associated with the account, with the ability to filter by account ID, location ID, bridge ID, multi-camera ID, and tags. It also supports pagination and the ability to include additional information about cameras.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available cameras, not the number of cameras resulting from the query string.'
      tags:
      - Cameras
      parameters:
      - $ref: '#/components/parameters/locationId__in'
      - $ref: '#/components/parameters/bridgeId__in'
      - $ref: '#/components/parameters/multiCameraId'
      - $ref: '#/components/parameters/multiCameraId__ne'
      - $ref: '#/components/parameters/multiCameraId__in'
      - $ref: '#/components/parameters/tags__contains'
      - $ref: '#/components/parameters/tags__any'
      - $ref: '#/components/parameters/packages__contains'
      - $ref: '#/components/parameters/layoutId'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/name__in'
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/id__notIn'
      - $ref: '#/components/parameters/id__contains'
      - $ref: '#/components/parameters/shared'
      - $ref: '#/components/parameters/sharedCameraAccount'
      - $ref: '#/components/parameters/firstResponder'
      - $ref: '#/components/parameters/directToCloud'
      - $ref: '#/components/parameters/speakerId__in'
      - $ref: '#/components/parameters/speakerId__ne'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/qRelevance__gte'
      - $ref: '#/components/parameters/enabledAnalytics__contains'
      - $ref: '#/components/parameters/status__in'
      - $ref: '#/components/parameters/status__ne'
      - $ref: '#/components/parameters/includeForList'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedCameraResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List cameras
      x-summary-source: derived
    post:
      operationId: addCamera
      description: Associates a camera with the account. This can only be called with an end-user account, and will result in an error if tried with any other type of account.
      tags:
      - Cameras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAddCamera'
      responses:
        '201':
          description: Camera added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCameraMain'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          description: There was a conflict while trying to perform your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
              examples:
                deviceIdentificationFailed:
                  description: 'Part of adding a camera is identifying its make, model and sometimes firmware version to decide if it is supported. This can fail due to  various reasons such as unexpected API responses from the camera, or an unsupported camera make (manufacturer). If this problem occurs, a user could try to restart the camera, reset it, or if that fails contacting support to check the brand & model are supported.

                    '
                  value:
                    code: 409
                    status: aborted
                    message: 'Camera addition job aborted: failed to identify device make and model.'
                    details:
                    - type: errorInfo
                      reason: deviceIdentificationFailed
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                unsupportedModel:
                  description: 'Camera''s model is not supported and cannot be added to the system. The camera might just be of a not supported model. Check the supported models on our website or with our support.

                    '
                  value:
                    code: 409
                    status: aborted
                    message: 'Camera addition job aborted: Camera''s model is not supported.'
                    details:
                    - type: errorInfo
                      reason: unsupportedModel
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                credentialValidationFailed:
                  description: 'The camera could not be configured because it''s using unknown credentials. Make sure to factory default reset the camera before trying again.

                    '
                  value:
                    code: 409
                    status: aborted
                    message: 'Camera addition job aborted: camera uses unknown credentials. Factory reset the camera before retrying.'
                    details:
                    - type: errorInfo
                      reason: credentialValidationFailed
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                localUrlValidationFailed:
                  description: 'One step of the camera addition is to retrieve the URL used in the local network where the camera is. This step could not be performed. Possible reasons: the camera or the network is offline.

                    '
                  value:
                    code: 409
                    status: aborted
                    message: 'Camera addition job aborted: failed to retrieve the camera''s local URL.'
                    details:
                    - type: errorInfo
                      reason: localUrlValidationFailed
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                alreadyExists:
                  description: 'The camera you''re trying to add is already added or currently being added in the system. There cannot be duplicated camera (using the same MAC address or GUID). Make sure to remove the existing one before you proceed to add it again.

                    '
                  value:
                    code: 409
                    status: conflict
                    message: The resource already exists.
                    details:
                    - type: errorInfo
                      reason: alreadyExists
                      domain: apiv3
                      metadata:
                        path: /api/v3.0/<resource>
                quotaExceeded:
                  description: 'Your bridge only supports a maximum of 10 cameras. You cannot add more cameras to it.

                    '
                  value:
                    code: 409
                    status: conflict
                    message: Cannot add camera. Bridge only supports 10 cameras.
                    details:
                    - type: errorInfo
                      reason: quotaExceeded
                      domain: apiv3
                      metadata:
                        path: /api/v3.0/cameras
        '500':
          description: The request encountered an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
              examples:
                hwRegistrationFailed:
                  description: 'One of the internal service failed to be reached and therefore the camera could not start its addition process. Try again or contact support if the error persist.

                    '
                  value:
                    code: 500
                    status: internal
                    message: Unexpected error while registering the MAC address in order to initiate the camera addition.
                    details:
                    - type: errorInfo
                      reason: hwRegistrationFailed
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                credentialSetupFailed:
                  description: 'Our system encountered an unexpected error while preparing the credentials to use for configuring the camera. Try again or contact support if the error persist.

                    '
                  value:
                    code: 500
                    status: internal
                    message: Unexpected error while preparing the credentials to be set to the camera. Please retry or contact our support.
                    details:
                    - type: errorInfo
                      reason: credentialSetupFailed
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                failedAddingCameraAfterValidation:
                  description: 'Our system encountered an unexpected error while taking the last step for adding the camera. This is an error on the system side not on the camera side. The camera is possibly reset to factory default. Please try again or contact our support if the problem persists.

                    '
                  value:
                    code: 500
                    status: internal
                    message: Unexpected error while finalizing the camera addition. Please retry or contact our support.
                    details:
                    - type: errorInfo
                      reason: failedAddingCameraAfterValidation
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
        '504':
          description: The request had a deadline that expired before the operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
              examples:
                neverConnected:
                  description: 'The camera addition process failed because the camera did not communicate with our system for at least 3 minutes. Make sure the camera has reliable internet connection, or try to factory default reset the camera before trying again.

                    '
                  value:
                    code: 504
                    status: deadlineExceeded
                    message: 'Camera addition job deadline exceeded: the camera never connected. Make sure it has an internet connection and is turned on.'
                    details:
                    - type: errorInfo
                      reason: neverConnected
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
                reconnectFailed:
                  description: 'The camera addition process failed because the camera did not connect to our system after the initial validation step. This can happen if the camera lost internet connection for instance. You may need to factory default reset your camera before being able to add it again.

                    '
                  value:
                    code: 504
                    status: deadlineExceeded
                    message: 'Camera addition job deadline exceeded: after the camera validation succeeded, the camera didn''t reconnect in time.'
                    details:
                    - type: errorInfo
                      reason: reconnectFailed
                      domain: add.cameras.job
                      metadata:
                        path: /api/v3.0/cameras
      summary: Add camera
      x-summary-source: derived
  /cameras/{cameraId}:
    parameters:
    - $ref: '#/components/parameters/cameraId'
    get:
      operationId: getCamera
      description: Retrieves the given camera.
      tags:
      - Cameras
      parameters:
      - $ref: '#/components/parameters/includeForSingle'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCameraForSingle'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get camera
      x-summary-source: derived
    delete:
      operationId: deleteCamera
      description: This endpoint disassociates the camera from the account, removing all references, recordings, and events, and in some cases resetting the camera to factory default settings. This request will be blocked until the camera has been fully removed.
      tags:
      - Cameras
      responses:
        '204':
          description: Camera deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete camera
      x-summary-source: derived
    patch:
      operationId: updateCamera
      description: This endpoint allows the developers to update a specific camera by providing update fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCameraUpdate'
      tags:
      - Cameras
      responses:
        '204':
          description: Camera Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update camera
      x-summary-source: derived
  /cameras/{cameraId}/io/ports:
    parameters:
    - $ref: '#/components/parameters/cameraId'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/pageSize'
    get:
      operationId: getPorts
      parameters:
      - $ref: '#/components/parameters/include'
      description: Retrieves list of device IO ports.
      tags:
      - Cameras
      responses:
        '200':
          description: Successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPortResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get ports
      x-summary-source: derived
  /cameras/{cameraId}/io/ports/{portId}:
    parameters:
    - $ref: '#/components/parameters/cameraId'
    - $ref: '#/components/parameters/portId'
    get:
      operationId: getPort
      parameters:
      - $ref: '#/components/parameters/include'
      description: Retrieves the device port.
      tags:
      - Cameras
      responses:
        '200':
          description: Successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get port
      x-summary-source: derived
    patch:
      operationId: updatePort
      description: Update the port configuration. Allowed properties depends on the port type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortPatch'
      tags:
      - Cameras
      responses:
        '204':
          description: Port Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update port
      x-summary-source: derived
  /cameras/{cameraId}/metrics:
    get:
      description: Returns metrics data.
      operationId: getCameraMetrics
      parameters:
      - $ref: '#/components/parameters/cameraId'
      - $ref: '#/components/parameters/timestamp__lte'
      - $ref: '#/components/parameters/timestamp__gte'
      - $ref: '#/components/parameters/target__in'
      - $ref: '#/components/parameters/period'
      tags:
      - Cameras
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricQueryResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get camera metrics
      x-summary-source: derived
  /cameras/{cameraId}/settings:
    parameters:
    - $ref: '#/components/parameters/cameraId'
    get:
      operationId: getCameraSettings
      tags:
      - Cameras
      parameters:
      - $ref: '#/components/parameters/include1'
      description: 'Retrieves the current settings for the given camera.


        Since cameras, the bridge they are connected to and the accounts they are part of can have different

        capabilities, not all settings given in this specification will be applicable to all cameras.

        If a setting is applicable, it will be returned by the API, if not, the field(s) will be skipped.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraSettings'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get camera settings
      x-summary-source: derived
    patch:
      operationId: updateCameraSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraSettings'
      tags:
      - Cameras
      description: 'Updates the settings of a camera.


        It will throw an error if the setting in the payload is not supported by a camera type.

        It won''t apply any settings in case of error.'
      responses:
        '204':
          description: Camera Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update camera settings
      x-summary-source: derived
  /cameras/{cameraId}/tunnel:
    parameters:
    - $ref: '#/components/parameters/cameraId'
    put:
      operationId: putCameraTunnel
      description: Opens a camera tunnel. As this API is intended for incidental access to the cameras UI, it should not be used for general API integration.
      tags:
      - Cameras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTunnelResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Put camera tunnel
      x-summary-source: derived
    delete:
      operationId: deleteCameraTunnel
      description: Deletes a camera tunnel.
      tags:
      - Cameras
      responses:
        '204':
          description: Camera tunnel deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete camera tunnel
      x-summary-source: derived
  /cameras/{cameraId}:swap:
    parameters:
    - $ref: '#/components/parameters/cameraId'
    patch:
      operationId: swapCamera
      description: 'Swap any camera with a new one.

        If the device is not visible by the bridge, API is going to throw a 404 error.

        If the GUID has already been attached to the account, API is going to throw a 409 error.

        If the provided GUID is in wrong format, API is going to throw 400 error.'
      tags:
      - Cameras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraSwap'
      responses:
        '204':
          description: Camera swap operation success.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Swap camera
      x-summary-source: derived
  /cameras:bulkUpdate:
    post:
      operationId: updateBulkCameras
      description: This endpoint allows the developer to update multiple cameras at once by providing update fields.
      tags:
      - Cameras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdateBulkCamera'
      responses:
        '201':
          description: Cameras updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraBulkUpdate'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update bulk cameras
      x-summary-source: derived
components:
  parameters:
    firstResponder:
      in: query
      name: shareDetails.firstResponder
      description: 'If set to `true`, only cameras that are shared with the current account using the "First responder" feature will be returned. If set to `false`, the cameras that are shared with the current account using the "First responder" feature will be filtered out.

        '
      schema:
        type: boolean
    enabledAnalytics__contains:
      in: query
      name: enabledAnalytics__contains
      required: false
      description: Only return cameras that have enabled all analytics in the comma-separated list.
      style: form
      explode: false
      schema:
        type: array
        example:
        - een.tamperDetectionEvent.v1
        items:
          type: string
    layoutId:
      in: query
      name: layoutId
      required: false
      description: Filter to get cameras that are part of the given layout.
      schema:
        type: string
    timestamp__lte:
      in: query
      name: timestamp__lte
      description: Maximum timestamp to list metrics. Defaults to now.
      schema:
        type: string
        format: date-time
        example: '2023-04-04T11:48:52.000Z'
    sharedCameraAccount:
      in: query
      name: shareDetails.accountId
      description: Filter to get the cameras that are shared from the provided account.
      schema:
        type: string
    id__notIn:
      in: query
      name: id__notIn
      description: Filter to exlude the cameras whose ids are in the provided list. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    speakerId__ne:
      in: query
      name: speakerId__ne
      required: false
      description: 'Filter to get cameras whose speakerId is not equal to the given value. Use `speakerId__ne=null` to return only cameras that have a speakerId assigned.

        '
      schema:
        type:
        - string
        - 'null'
    target__in:
      in: query
      required: true
      name: target__in
      description: "Comma separated list of metric types. The following targets are available:\n * `kilobytesOnDisk` - shows how much storage capacity is used on bridge.\n * `bytesPurged` - shows how much data was purged. Data is marked as purged if it is removed before Minimum On Premise Retention is met.\n * `bytesStored` - shows how much data was stored.\n * `bytesFreed` - shows how much data was freed, includes purges.\n * `bandwidthBackground` - extra data that contains data from the past\nwhich bridge is sending to try to meet cloud retention goals and the data that are requested from cloud e.g when user is viewing a video.\n * `bandwidthRealtime` - the minimum amount of data, required to keep the camera operational.\n"
      style: form
      explode: false
      schema:
        type: array
        example:
        - kilobytesOnDisk
        minItems: 1
        items:
          type: string
          enum:
          - kilobytesOnDisk
          - bytesPurged
          - bytesStored
          - bytesFreed
          - bandwidthBackground
          - bandwidthRealtime
    sort:
      in: query
      name: sort
      description: "Comma separated list of of fields that should be sorted.\n * `sort=` - not providing any value will result in error 400\n * `sort=+name,+name` - same values will result in error 400\n * `sort=-name,+name` - mutially exclusive values will return error 400\n * maxItem=3 - Only Three values will be accepted, more will return error 400\n * qRelevance is optional ordering parameter which is available if q filter is used, if q filter is not passed qRelevance as ordering parameter will return error 400 \n"
      schema:
        type: array
        default:
        - +name
        items:
          type: string
          maxItems: 3
          enum:
          - -name
          - -locationSummary.name
          - -bridgeSummary.name
          - -qRelevance
          - +name
          - +locationSummary.name
          - +bridgeSummary.name
          - +qRelevance
      example:
      - +name
      - -locationSummary.name
      style: form
      explode: false
    packages__contains:
      in: query
      name: packages__contains
      required: false
      description: Only return cameras that have enabled all packages in the list, separated by commas.
      style: form
      explode: false
      schema:
        type: array
        example:
        - een.vsp
        items:
          type: string
    name__contains:
      in: query
      name: name__contains
      description: 'Filter to get the cameras whose the name contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    locationId__in:
      in: query
      name: locationId__in
      required: false
      description: List of Location IDs to filter on that is comma separated.
      style: form
      explode: false
      schema:
        type: array
        example:
        - 2428fda3-389f-48ce-b062-85875dd6b2e2
        items:
          type: string
    qRelevance__gte:
      in: query
      name: qRelevance__gte
