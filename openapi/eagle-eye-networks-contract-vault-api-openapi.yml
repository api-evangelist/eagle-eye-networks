    ContractRecord:
      type: object
      description: Represents a contract vault record.
      properties:
        id:
          type: string
          description: Unique identifier for the recording.
        customers:
          type: array
          description: List of customer names associated with the recording. A primary and secondary customer may be present.
          items:
            type: object
            properties:
              firstName:
                type: string
                description: First name of the customer.
              lastName:
                type: string
                description: Last name of the customer.
              primary:
                type: boolean
                description: Indicates if this customer is the primary contact.
            required:
            - firstName
            - lastName
            - primary
            maxItems: 2
            minItems: 1
        agent:
          type: object
          description: Information about the agent associated with the recording.
          properties:
            firstName:
              type: string
              description: First name of the agent.
            lastName:
              type: string
              description: Last name of the agent.
            email:
              type: string
              format: email
              description: Email address of the agent.
        manager:
