        name: pageToken
        description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken`
          and `prevPageToken` fields.

          When a pageToken is provided, the backend remembers search parameters from the original request, so search  parameters that affect the
          result set or order are optional and will be ignored if provided. Representation  parameters like `include` should still be applied.

          '
        example: b2Zmc2V0PTEwJmxpbWl0PTEw
        required: false
        schema:
          type: string
      - in: query
        name: pageSize
        description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum
          values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside
          of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last
          page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

          '
        example: 100
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
