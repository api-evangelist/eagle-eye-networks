openapi: 3.2.0
info:
  title: AUTOMATIONS Event Alert Rules API
  version: 3.0.0
  description: Describe when an event should trigger an alert.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Event Alert Rules
  description: Describe when an event should trigger an alert.
paths:
  /eventAlertConditionRules:
    post:
      operationId: addEventAlertConditionRule
      tags:
      - Event Alert Rules
      description: 'Create a new rule that produces alerts based on certain conditions. Specifically, the user specifies alert conditions that indicate when the alert is produced based on following:

        * Which resources can produce the alert

        * What is the schedule for the alert.

        * What event types can produce the alert.


        Resellers may create rules on behalf of an end user account by setting `endUserAccountId` in the request body. The reseller must have permission to edit automations on that end user account.'
      requestBody:
        description: Conditions for the rule to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiEventAlertConditionRuleCreate'
      responses:
        '201':
          $ref: '#/components/responses/ruleCreatedResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add event alert condition rule
      x-summary-source: derived
    get:
      operationId: listEventAlertConditionRules
      tags:
      - Event Alert Rules
      description: List the configured event alert condition rules in the account. Parameters can be used to filter the rules based on the actor, name, and enabled status. A list of the availible field values for each field can be fetched using the `listFieldValues` endpoint.
      parameters:
      - $ref: '#/components/parameters/actor__in'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/enabled'
      - $ref: '#/components/parameters/eventFilter.eventTypes__contains'
      - $ref: '#/components/parameters/eventFilter.eventTypes__in'
      - $ref: '#/components/parameters/priority__gte'
      - $ref: '#/components/parameters/priority__lte'
      - $ref: '#/components/parameters/includeStateSource'
      - $ref: '#/components/parameters/stateSource__in'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: All the rules that met the filter criteria of this API inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEventRulesResult'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List event alert condition rules
      x-summary-source: derived
  /eventAlertConditionRules/{id}:
    get:
      operationId: getEventAlertConditionRule
      tags:
      - Event Alert Rules
      parameters:
      - $ref: '#/components/parameters/id'
      description: Get details of a specific rule by id
      responses:
        '200':
          description: Success, returns the rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEventAlertConditionRule'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get event alert condition rule
      x-summary-source: derived
    patch:
      operationId: updateEventAlertConditionRule
      tags:
      - Event Alert Rules
      parameters:
      - $ref: '#/components/parameters/id'
      description: Updates the properties of a specific rule. Only the user defined fields can be updated by this method.
      requestBody:
        description: Data containing information on the rule to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiEventAlertConditionRuleUpdate'
      responses:
        '204':
          description: The rule is updated successfully.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update event alert condition rule
      x-summary-source: derived
    delete:
      operationId: deleteEventAlertConditionRule
      tags:
      - Event Alert Rules
      description: Deletes the rule corresponding to the rule ID
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The rule has been deleted successfully.
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete event alert condition rule
      x-summary-source: derived
  /eventAlertConditionRules:listFieldValues:
    get:
      operationId: getEventAlertConditionRulesFieldValues
      tags:
      - Event Alert Rules
      description: Fetches the list of field values across all the attributes of alertConditionRules stored for this account. These values can be used to filter the results of the GET `/eventAlertConditionRules` endpoint.
      responses:
        '200':
          description: Success, returns possible values of each field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEventRulesFields'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get event alert condition rules field values
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    ApiEventRulesResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiEventAlertConditionRule'
    EventFilter:
      type: object
      description: A list of attributes of the event used to funnel down a specific set of events for any downstream action.
      properties:
        eventTypes:
          type: array
          description: 'Specifies the types of events that this rule should evaluate. Only events matching one of the specified types will trigger the rule. For example, if this field includes `een.personDetectionEvent.v1`, but the incoming event is a `een.motionDetectionEvent.v1`, the rule will not be triggered.

            '
          items:
            type: string
            example: een.lprPlateReadEvent.v1
        data:
          type: object
          description: "A key-value map used to filter events based on fields defined in event data schemas.\n\nKeys must follow the format: `{schema}.{field}__{operator}`. Refer to the event descriptions and corresponding data schemas to determine the available schema names and their respective fields.\n\nIf the operator is omitted, equality is assumed.\n\nThe `schema` and `field` names used in the keys must match the `dataSchemas` associated with the filtered `eventTypes`. \nIf any schema or field is invalid for the given event type(s), the API will return a validation error.\n\nSupported operators:\n  - `__in`: Match if the field value is in the provided list\n  - `__gte`: Match if the field value is greater than or equal to the given value (number or date-time)\n  - `__lte`: Match if the field value is less than or equal to the given value (number or date-time)\n"
          properties:
            and:
              type: array
              description: All conditions must match
              items:
                type: object
                additionalProperties: true
                example:
                  een.lprDetection.v1.plateConfidence__gte: 0.95
                  een.lprDetection.v1.plateRegion__in:
                  - US-NY
                  - CA-ON
        schedule:
          $ref: '#/components/schemas/WeeklyIntervalSchedule'
        resourceFilter:
          $ref: '#/components/schemas/ResourceFilter'
    Interval:
      type: object
      description: "Interval of a schedule. If the start time is greater than the end time, the interval is considered to cover the remaining time of the day from the start time until 24:00, and then from 00:00 to the end time. \nFor example, start: 16:30 and end: 06:00 on monday means the interval covers from 16:30 to 24:00 and continues from 00:00 to 06:00 on the same day (monday).\n"
      properties:
        start:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
        end:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day
      required:
      - start
      - end
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    ApiEventRulesFields:
      type: object
      properties:
        actors:
          type: array
          items:
            type: object
            properties:
              actor:
                type: string
                description: The actor in the format `actorType:actorId`.
                example: camera:100d4c41
              name:
                type: string
                description: Name of the actor.
                example: Front Door Camera
        enabled:
          type: array
          items:
            type: boolean
        priority:
          type: array
          items:
            $ref: '#/components/schemas/Priority'
    ApiEventAlertConditionRule:
      type: object
      description: Encompasses all the user specified and system generated properties of a rule used to generate alerts.
      allOf:
      - $ref: '#/components/schemas/EventAlertConditionRuleBase'
      - type: object
        properties:
          id:
            type: string
            readOnly: true
            description: The system generated id of this rule resource
          createTimeStamp:
            type: string
            description: Time at which the Alert Condition Rule was created.
            example: '2021-04-22T00:00:00.000+00:00'
            readOnly: true
            format: date-time
          updateTimeStamp:
            type: string
            description: Time at which the Alert Condition Rule was last updated.
            example: '2021-04-22T00:20:00.000+00:00'
            readOnly: true
            format: date-time
          outputAlertTypes:
            type: array
            readOnly: true
            description: Possible Alert Types that are producible by this rule. For a given event, what alert is produced depends on the configuration parameters of the rule and the event properties.
            items:
              type: string
              example: een.motionDetectionAlert.v1
          endUserAccountId:
            type:
            - string
            - 'null'
            readOnly: true
            description: The end user account this rule targets. Available only for a rule created by a reseller targeting an end user; `null` otherwise.
            example: '00012345'
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    EventAlertConditionRuleBase:
      type: object
      description: Encompasses all the user specified properties of a rule used to generate alerts.
      properties:
        name:
          type: string
          description: Name for the rule
          minLength: 1
          maxLength: 126
          example: Alert on Motion detection
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: string
          description: A verbose explanation of the rule
          example: Generate alerts on Motion Detection at night.
        enabled:
          type: boolean
          description: Whether rule is enabled
        cooldownSeconds:
          type: integer
          format: int32
          description: 'Cooldown period (in seconds). If two events for the same actor and event type have event timestamps within this duration, only the first will trigger an alert while the second event will be suppressed. A value of 0 disables the cooldown checks.

            '
          default: 10
          minimum: 0
        humanValidation:
          type: object
          properties:
            enabled:
              type: boolean
              description: 'If set to true, the alert will be validated by a human before being applied. This is useful for rules that are not 100% reliable and need human confirmation.

                '
              example: true
            service:
              type: string
              description: 'The service that will be used for human validation. Currently, the only supported service is Eagle Eye Human Review, which is the default.

                '
              example: eenV1
              enum:
              - eenV1
              default: eenV1
            maxWaitTimeSeconds:
              type: integer
              format: int32
              description: 'The maximum time (in seconds) to wait for human validation before the alert is applied. If the human validation is not completed within this time, the alert will be applied automatically.

                '
              default: 60
              minimum: 1
              maximum: 60
        eventFilter:
          $ref: '#/components/schemas/EventFilter'
    PaginatedResponse:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages and, if  available, the total number of results.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken.  This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken.  This value can be null of there is no previous page.

            '
        totalSize:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: 'The number of resource entries being returned from the result set.  This can be omitted if the API endpoint does not have total size information.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    ApiEventAlertConditionRuleCreate:
      type: object
      description: Encompasses all the user specified properties of a rule used to generate alerts.
      required:
      - name
      - priority
      allOf:
      - $ref: '#/components/schemas/EventAlertConditionRuleBase'
      properties:
        enabled:
          type: boolean
          description: Whether the rule is enabled
          default: false
        endUserAccountId:
          type: string
          example: '00012345'
          description: The end user account this rule should target. Required when the caller is a reseller (with or without wildcard actors); the caller must have permission to edit automations on the target end user account. Must not be set by non-reseller callers.
    ApiEventAlertConditionRuleUpdate:
      type: object
      description: Encompasses all the user specified properties of a rule used to generate alerts.
      allOf:
      - $ref: '#/components/schemas/EventAlertConditionRuleBase'
    ResourceFilter:
      type: object
      description: List of actors against which filtering has to happen
      properties:
        actors:
          description: 'Actors that can trigger alerts for this rule, in the format `actorType:actorId`.

            Wildcard Support: Use `<actorType>:*` to match all actors of a specific type (e.g., `camera:*` matches all cameras).  Only full wildcards (`<actorType>:*`) are supported. Partial wildcards like `camera:123*` are not allowed.  Only admin users can use wildcard actors.

            '
          type: array
          items:
            type: string
          example:
          - camera:100d4c41
          - camera:*
    Priority:
      type: integer
      description: Defines the priority of the alert
      format: int32
      minimum: 1
      maximum: 10
    WeeklyIntervalSchedule:
      type: object
      description: 'It signifies a week long alert schedule. This schedule is effective according to actor''s (user/camera/account) timezone. It allows setting different times for different days.

        '
      properties:
        sunday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        monday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        tuesday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        wednesday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        thursday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        friday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        saturday:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
  parameters:
    actor__in:
      in: query
      name: actor
      description: 'Filter to get only event alert rules where the actorType and actorId value equals any one of the supplied value in the list. For each entry of list, the actor type has to be prefixed along with actor id like `actorType:actorId`. For example, to filter for camera with id 100d4c41, the actorId that has to be used is `camera:100d4c41`. To search for event alert rules for a specific type of actor, for example switch, use a wildcard as actorId: `switch:*`.

        '
      schema:
        type: array
        items:
          type: string
        example:
        - camera:100d4c41
        - bridge:abcd1234
        - camera:*
    id:
      in: path
      name: id
      required: true
      description: Id
      schema:
        type: string
        format: uuid
    includeStateSource:
      in: query
      name: includeStateSource
      x-een-visibility: private
      required: false
      description: 'When `true`, the response also includes rules that have `stateSource` set. By default such rules are excluded because their alert publication is gated by external state and therefore they are not part of the standard rule listing.

        '
      schema:
        type: boolean
        default: false
    stateSource__in:
      in: query
      name: stateSource__in
      x-een-visibility: private
      required: false
      style: form
      explode: false
      description: 'Filter to return only rules whose `stateSource` matches one of the supplied URNs. Values are matched against the full URN (e.g. `urn:een:alarm:<alarmId>`). When supplied, rules with a matching `stateSource` are returned regardless of the `includeStateSource` flag.

        '
      schema:
        type: array
        items:
          type: string
        example:
        - urn:een:alarm:8c505a0c-188d-46f4-b54f-ea5a2a8df762
    eventFilter.eventTypes__contains:
      description: Filter to only include results that contain all the specified event types.
      in: query
      name: eventFilter.eventTypes__contains
      style: form
      explode: false
      required: false
      schema:
        type: array
        items:
          type: string
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    enabled:
      in: query
      name: enabled
      description: Filter against enabled rules (when set to true) or disabled rules (when set to false)
      schema:
        type: boolean
    priority__lte:
      in: query
      name: priority__lte
      description: Filter by priority__lte
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10
    name__contains:
      in: query
      name: name__contains
      description: Phrase that is used to search for rule whose names contain it
      schema:
        type: string
    eventFilter.eventTypes__in:
      description: Filter to only include results that contain one of the specified event types.
      in: query
      name: eventFilter.eventTypes__in
      style: form
      explode: false
      required: false
      schema:
        type: array
        items:
          type: string
    priority__gte:
      in: query
      name: priority__gte
      description: Filter by priority__gte
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10
    pageToken:
      in: query
      name: pageToken
      description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken` and `prevPageToken` fields.

        When a pageToken is provided, the backend remembers search parameters from the original request, so search  parameters that affect the result set or order are optional and will be ignored if provided. Representation  parameters like `include` should still be applied.

        '
      example: b2Zmc2V0PTEwJmxpbWl0PTEw
      required: false
      schema:
        type: string
  responses:
    forbidden:
      description: You have no permission to access the specified resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          examples:
            invalidPermission:
              value:
                code: 403
                status: permissionDenied
                message: The client caller does not have permission for the specified operation
                details:
                - type: errorInfo
                  reason: invalidPermission
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            wrongEdition:
              value:
                code: 403
                status: permissionDenied
                message: This feature is not enabled for the account
                details:
                - type: errorInfo
                  reason: wrongEdition
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/locations
            wrongAccountType:
              value:
                code: 403
                status: permissionDenied
                message: This feature is only available for end users
                details:
                - type: errorInfo
                  reason: wrongAccountType
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/locations
    resourceNotFound:
      description: Referenced resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          examples:
            endpointNotFound:
              value:
                code: 404
                status: notFound
                message: The API endpoint was not found
                details:
                - type: errorInfo
                  reason: endpointNotFound
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            resourceNotFound:
              value:
                code: 404
                status: notFound
                message: The resource was not found
                details:
                - type: errorInfo
                  reason: resourceNotFound
                  domain: apiv3
