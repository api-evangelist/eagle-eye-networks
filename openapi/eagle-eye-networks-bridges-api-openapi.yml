openapi: 3.2.0
info:
  title: DEVICES Bridges API
  version: 3.0.0
  description: All core operations on bridges.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Bridges
  description: All core operations on bridges.
paths:
  /bridges:
    get:
      operationId: listBridges
      description: A list of bridges can be retrieved using this endpoint. It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available bridges, not the number of bridges resulting from the query string.
      tags:
      - Bridges
      parameters:
      - $ref: '#/components/parameters/includeForList1'
      - $ref: '#/components/parameters/sort1'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/locationId__in'
      - $ref: '#/components/parameters/tags__contains1'
      - $ref: '#/components/parameters/tags__any1'
      - $ref: '#/components/parameters/name__contains1'
      - $ref: '#/components/parameters/name__in1'
      - $ref: '#/components/parameters/name1'
      - $ref: '#/components/parameters/id__in1'
      - $ref: '#/components/parameters/id__contains1'
      - $ref: '#/components/parameters/q1'
      - $ref: '#/components/parameters/qRelevance__gte'
      - $ref: '#/components/parameters/status__in'
      - $ref: '#/components/parameters/status__ne'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedBridgeResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List bridges
      x-summary-source: derived
    post:
      description: Create the bridge for the account with given connect id
      operationId: createBridge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBridgeCreate'
      responses:
        '201':
          description: Bridge Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBridgeMain'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Bridges
      summary: Create bridge
      x-summary-source: derived
  /bridges/{bridgeId}:
    parameters:
    - $ref: '#/components/parameters/bridgeId'
    patch:
      description: Update the bridge for the account with given bridge id
      operationId: updateBridge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBridgeUpdate'
      responses:
        '204':
          description: Bridge Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Bridges
      summary: Update bridge
      x-summary-source: derived
    get:
      operationId: getBridge
      description: Retrieves the given bridge.
      tags:
      - Bridges
      parameters:
      - $ref: '#/components/parameters/includeForSingle1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBridgeForSingle'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get bridge
      x-summary-source: derived
    delete:
      operationId: deleteBridge
      description: Removes the given bridge from the account, resetting it in the process and removing all cameras that were connected to it.
      responses:
        '204':
          description: Bridge deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          description: There was a conflict while trying to perform your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
              examples:
                childDevicesExist:
                  $ref: '#/components/responses/conflict/content/application~1json/examples/childDevicesExist'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Bridges
      summary: Delete bridge
      x-summary-source: derived
  /bridges/{bridgeId}/actions:
    parameters:
    - $ref: '#/components/parameters/bridgeId'
    post:
      operationId: updatePort1
      description: This endpoint is used to perform actions on a bridge. Currently, the only action available is rebooting the bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBridgePostAction'
      responses:
        '204':
          description: Action Queued
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Bridges
      summary: Update port1
      x-summary-source: derived
  /bridges/{bridgeId}/metrics:
    get:
      description: Returns metrics data.
      operationId: getBridgeMetrics
      parameters:
      - $ref: '#/components/parameters/bridgeId'
      - $ref: '#/components/parameters/timestamp__lte'
      - $ref: '#/components/parameters/timestamp__gte'
      - $ref: '#/components/parameters/target__in1'
      - $ref: '#/components/parameters/period'
      tags:
      - Bridges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricQueryResponse2'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get bridge metrics
      x-summary-source: derived
  /bridges/{bridgeId}:swap:
    parameters:
    - $ref: '#/components/parameters/bridgeId'
    patch:
      operationId: swapBridge
      description: 'Swap bridge with a new one.

        The original bridge must be offline and disconnected, if not API is going to throw 400 error.

        If the GUID is not added to the account or GUID has already been attached to another account API is going to throw 404 error.

        If the provided GUID is in wrong format, API is going to throw 400 error.'
      tags:
      - Bridges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeSwap'
      responses:
        '204':
          description: Bridge swap operation success.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Swap bridge
      x-summary-source: derived
  /bridges/{id}/settings/:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      operationId: getBridgeSettings
      description: 'Get all the configurable operational settings related to

        a bridge'
      tags:
      - Bridges
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeSettingsGet'
          description: OK
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get bridge settings
      x-summary-source: derived
    patch:
      operationId: updateBridgeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeSettingsPatch'
      tags:
      - Bridges
      description: Updates the settings of a bridge.
      responses:
        '204':
          description: Camera Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update bridge settings
      x-summary-source: derived
  /bridges:bulkUpdate:
    post:
      operationId: updateBulkBridges
      description: This endpoints updates multiple bridges with provided updateField.
      tags:
      - Bridges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdateBulkBridge'
      responses:
        '201':
          description: Bridges updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeBulkUpdate'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update bulk bridges
      x-summary-source: derived
components:
  parameters:
    id__contains1:
      in: query
      name: id__contains
      description: 'Filter to get the bridges whose the id contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    timestamp__lte:
      in: query
      name: timestamp__lte
      description: Maximum timestamp to list metrics. Defaults to now.
      schema:
        type: string
        format: date-time
        example: '2023-04-04T11:48:52.000Z'
    target__in1:
      in: query
      required: true
      name: target__in
      description: "Comma separated list of metric types. The following targets are available:\n * `kilobytesOnDisk` - shows how much storage capacity is used on bridge.\n * `availableKilobytesOnDisk` - shows how much storage capacity is not used on bridge.\n * `bytesStored` - shows how much data was stored.\n * `bandwidthBackground` - extra data that contains data from the past\nwhich bridge is sending to try to meet cloud retention goals and the data that are requested from cloud e.g when user is viewing a video.\n * `bandwidthRealtime` - the minimum amount of data, required to keep the bridge operational.\n * `bytesFreed` - shows how much data was freed, includes purges.\n * `bandwidth` - the bandwidth as measured while sending data to the cloud.\n"
      style: form
      explode: false
      schema:
        type: array
        example:
        - kilobytesOnDisk
        - availableKilobytesOnDisk
        minItems: 1
        items:
          type: string
          enum:
          - kilobytesOnDisk
          - availableKilobytesOnDisk
          - bytesStored
          - bandwidthBackground
          - bandwidthRealtime
          - bytesFreed
          - bandwidth
    tags__contains1:
      in: query
      name: tags__contains
      required: false
      description: Only return bridges that have all tags in the list, separated by commas.
      style: form
      explode: false
      schema:
        type: array
        example:
        - string
        items:
          type: string
    locationId__in:
      in: query
      name: locationId__in
      required: false
      description: List of Location IDs to filter on that is comma separated.
      style: form
      explode: false
      schema:
        type: array
        example:
        - 2428fda3-389f-48ce-b062-85875dd6b2e2
        items:
          type: string
    qRelevance__gte:
      in: query
      name: qRelevance__gte
      description: 'Sets the current minimum similarity threshold that is used with the `q` parameter. The threshold must be between 0 and 1 (float, default is 0.5).

        '
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 1
        example: 0.5
    id:
      in: path
      name: id
      schema:
        type: string
        pattern: ^\w{8}$
      required: true
    period:
      in: query
      name: period
      description: Defaults to hour. It performs linear interpolation to get to the target period.
      schema:
        type: string
        enum:
        - day
        - hour
        - minute
    name__contains1:
      in: query
      name: name__contains
      description: 'Filter to get the bridges whose the name contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    status__ne:
      in: query
      name: status__ne
      description: Filter to get the devices with status that is not equal to the provided value. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DeviceConnectionStatus'
      example:
      - online
      - error
      style: form
      explode: false
      required: false
    timestamp__gte:
      in: query
      name: timestamp__gte
      description: Minimum timestamp to list metrics. Defaults to 7 days ago.
      schema:
        type: string
        format: date-time
        example: '2023-04-04T09:38:37.372Z'
    status__in:
      in: query
      name: status__in
      description: Filter to get the devices with the specified status. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DeviceConnectionStatus'
      example:
      - online
      - error
      style: form
      explode: false
      required: false
    includeForSingle1:
      in: query
      name: include
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - status
          - statusV2
          - locationSummary
          - deviceAddress
          - timeZone
          - notes
          - tags
          - devicePosition
          - networkInfo
          - deviceInfo
          - effectivePermissions
          - resourceCounts
          - resourceStatusCounts
          - resourceStatusV2Counts
    id__in1:
      in: query
      name: id__in
      description: Filter to get the bridges whose id is on the provided list. The lookup is exact and case insensitive.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    name__in1:
      in: query
      name: name__in
      description: Filter to get the bridges whose name is on the provided list. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    tags__any1:
      in: query
      name: tags__any
      required: false
      description: Only return bridges that have one or more of the tags in the list, separated by commas.
      style: form
      explode: false
      schema:
        type: array
        example:
        - string
        items:
          type: string
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    bridgeId:
      in: path
      name: bridgeId
      schema:
        type: string
      required: true
    name1:
      in: query
      name: name
      description: Filter to get the bridges with the specified name. The lookup is exact and case insensitive.
      schema:
        type: string
    q1:
      in: query
      name: q
      description: 'Text search that is applied to multiple fields. The fields being searched are defined by the backend and can be changed without warning. Example fields being searched: `id`, `accountId`, `name`, `notes`, `tags`, `timeZone.zone`, `devicePosition.floor`, and metadata of important linked resources such as the location.

        '
      schema:
        type: string
        example: entrance
    sort1:
      in: query
      name: sort
      description: "Comma separated list of of fields that should be sorted.\n * `sort=` - not providing any value will result in error 400\n * `sort=+name,+name` - same values will result in error 400\n * `sort=-name,+name` - mutially exclusive values will return error 400\n * maxItem=3 - Only Three values will be accepted, more will return error 400\n * qRelevance is optional ordering parameter which is available if q filter is used, if q filter is not passed qRelevance as ordering parameter will return error 400\n"
      schema:
        type: array
        default:
        - +name
        items:
          type: string
          maxItems: 3
          enum:
          - -name
          - -locationSummary.name
          - -qRelevance
          - +name
          - +locationSummary.name
          - +qRelevance
      example:
      - +name
      - -qRelevance
      style: form
      explode: false
    includeForList1:
      in: query
      name: include
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - status
          - statusV2
          - locationSummary
          - deviceAddress
          - timeZone
          - notes
          - tags
          - devicePosition
          - networkInfo
          - deviceInfo
          - effectivePermissions
          - resourceCounts
          - resourceStatusCounts
          - resourceStatusV2Counts
          - qRelevance
    pageToken:
      in: query
      name: pageToken
      description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken` and `prevPageToken` fields.

        When a pageToken is provided, the backend remembers search parameters from the original request, so search  parameters that affect the result set or order are optional and will be ignored if provided. Representation  parameters like `include` should still be applied.

        '
      example: b2Zmc2V0PTEwJmxpbWl0PTEw
      required: false
      schema:
        type: string
  schemas:
    SettingsGet:
      allOf:
      - $ref: '#/components/schemas/BasicSettings'
      - type: object
        properties:
          bandwidth:
            $ref: '#/components/schemas/Bandwidth'
          localDisplay:
            $ref: '#/components/schemas/LocalDisplayGet'
          mediaShortcut:
            $ref: '#/components/schemas/MediaShortcutGet'
          videoStandard:
            $ref: '#/components/schemas/VideoStandard'
          measuredBandwidth:
            type:
            - number
            - 'null'
            format: double
            minimum: 0
            readOnly: true
            description: 'The measured bandwidth of the bridge in Mbps. This value is updated periodically and can be used to determine the current network conditions.

              '
      required:
      - bandwidth
      - localDisplay
      - timeZone
      - upnpEnabled
      - mediaShortcut
      - bridgeRtspEnabled
      - bridgeRtspAuth
      - measuredBandwidth
    EdgeReportedDeviceStatusCounts:
      type: object
      properties:
        operational:
          type: integer
        disabled:
          type: integer
        unreachable:
          type: integer
        error:
          type: integer
        unknown:
          type: integer
        initializing:
          type: integer
    ApiBridgeForSingle:
      allOf:
      - $ref: '#/components/schemas/ApiBridgeMain'
      - $ref: '#/components/schemas/ApiBridgeIncludes'
    ApiUpdateBulkBridge:
      description: 'This object identifies the list of bridges to be updated, and the fields and their values to be updated.

        '
      properties:
        ids:
          type: array
          items:
            type: string
            minItems: 1
          example:
          - 10088cde
          - 10088ceb
          - 10088abc
        updateFields:
          type: object
          description: 'This defines the parameter that will be updated for list of bridges. Currently, we allow only one parameter to be updated at a time.

            '
          properties:
            locationId:
              $ref: '#/components/schemas/LocationId'
      required:
      - ids
      - updateFields
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    TimeZoneString:
      type: string
      example: America/Chicago
      description: 'The timezone the device is in. The list of supported timezones is provided by the /timeZones endpoint. Changing the time zone will change the time zone for the bridge and attached cameras.

        '
    BridgeBulkUpdate:
      properties:
        response:
          $ref: '#/components/schemas/BulkUpdateResponses'
    DeviceTags:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 64
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    MediaShortcut:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: 'Turn on a service on the bridge that will allow the VMS GUI to receive images and videos directly from the bridge on a local network.  This will boost performance by eliminating calls to the cloud.  Images and video will continue to be pushed to the cloud.

            '
        ipOverrides:
          description: 'By default the media shortcut feature will serve content from the `wan` interface. For bridges that are behind a firewall or NATed, this property can be used to provide those IPv4 addresses to the VMS system.  The list is composed of IPv4 addresses and the constants `wan` or `camLan`.

            '
          type: array
          default:
          - wan
          example:
          - wan
          - 10.45.4.4
          items:
            type: string
    ApiDevicePosition2:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        latitude:
          description: The latitude of the device. (WGS 84)
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
          example: 52.3074013
        longitude:
          description: The longitude of the device. (WGS 84).
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
          example: 4.9459903
        floor:
          type:
          - integer
          - 'null'
          minimum: 0
          example: 50
    deviceCloudConnectionStatusV2:
      description: "Socket connection state between device and cloud\n  * `connected`: The device socket connected to cloud.\n  * `disconnected`: The device socket disconnected from cloud.\n"
      type: string
      enum:
      - connected
      - disconnected
      example: connected
    ApiNetworkInfo:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        globalIP:
          $ref: '#/components/schemas/IpAddress'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/ApiAdapterInfo'
    ApiTimeZone:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        zone:
          type: string
          example: America/Chicago
