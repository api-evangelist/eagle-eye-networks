openapi: 3.2.0
info:
  title: Media API
  version: 3.0.0
  description: Retrieve information about and manage recorded media.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Media
  description: Retrieve information about and manage recorded media.
paths:
  /media:
    get:
      operationId: listMedia
      description: 'This endpoint requests a list of intervals for which there are recordings for the given type and

        mediaType. If no endTimestamp__lte (formatted according to ISO 8601) is given, then the

        results until now are returned.


        Note: The ISO 8601 timestamp format is a standardized format for representing date

        and time information. It uses the format ''YYYY-MM-DDTHH:MM:SS.sss±hh:mm'' where

        "T" is the separator between the date and time portions.'
      tags:
      - Media
      parameters:
      - $ref: '#/components/parameters/deviceId'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/mediaType'
      - $ref: '#/components/parameters/startTimestamp'
      - $ref: '#/components/parameters/endTimestamp'
      - $ref: '#/components/parameters/coalesce'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedMediaResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List media
      x-summary-source: derived
  /media/liveImage.jpeg:
    get:
      operationId: getLiveImage
      description: This endpoint allows users to get a new image from the device. This call will wait until the image is available.
      tags:
      - Media
      parameters:
      - $ref: '#/components/parameters/deviceId'
      - $ref: '#/components/parameters/liveType'
      responses:
        '200':
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Een-Timestamp:
              schema:
                type: string
              description: Timestamp of image
              required: true
            X-Een-PrevToken:
              schema:
                type: string
              description: Token to fetch the previous image
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
        '503':
          $ref: '#/components/responses/unavailable'
      summary: Get live image
      x-summary-source: derived
  /media/recordedImage.jpeg:
    get:
      operationId: getRecordedImage
      description: 'This endpoint retrieves an image based on a specified timestamp. You can indicate whether the image must be captured exactly at that timestamp or allow a nearest match before or after. The timestamp must be submitted in ISO 8601 format.

        Each request must include one timestamp parameter and specify the desired image type — either `main` or `preview`. Alternatively, by submitting a `pageToken`, the next/previous image from the last image is returned. In this case, none of the other parameters are used.

        Be aware that the image type `main` is rate-limited, and should not be used in quick succession. Additionally, it requires that a recording is available at the given timestamp param. If no recording is available at the given timestamp param a 404 NOT FOUND will be returned.

        If an overlay is requested in the `include` parameter, then at least one overlayId must be provided as part of the `overlayId__in` parameter. The list of available overlay ids can be retrieved using the GET /media/recordedImage.jpeg:listFieldValues API.'
      tags:
      - Media
      x-een-accept-signed-url: true
      security:
      - signedUrlAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/deviceIdNotRequired'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/recordedType'
      - $ref: '#/components/parameters/timestampLess'
      - $ref: '#/components/parameters/timestampLessOrEqual'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/timestampGreaterOrEqual'
      - $ref: '#/components/parameters/timestampGreater'
      - $ref: '#/components/parameters/overlayIds'
      - $ref: '#/components/parameters/targetWidth'
      - $ref: '#/components/parameters/targetHeight'
      - $ref: '#/components/parameters/overlaysInclude'
      responses:
        '200':
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Een-Timestamp:
              schema:
                type: string
              description: Timestamp of image
              required: true
            X-Een-NextToken:
              schema:
                type: string
              description: Token to fetch the next image
            X-Een-PrevToken:
              schema:
                type: string
              description: Token to fetch the previous image
            X-Een-OverlaySvg:
              $ref: '#/components/headers/OverlaySvgHeader'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get recorded image
      x-summary-source: derived
  /media/session:
    get:
      operationId: getMediaSession
      description: 'Api to list the url to call to set the media session cookie. The call will also redirect to the same url.

        The media session cookie can be used to replace the bearer authentication for mp4 playback in web browsers.'
      tags:
      - Media
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMediaSessionURL'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internalServerError'
        '503':
          $ref: '#/components/responses/unavailable'
      summary: Get media session
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    ApiMediaSessionURL:
      type: object
      required:
      - url
      properties:
        url:
          description: Url for the media endpoint that sets the media session cookie
          type: string
          format: url
          example: https://media.c13.eagleyenetworks.com/media/
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    ApiMediaIncludes:
      type: object
      properties:
        flvUrl:
          type:
          - string
          - 'null'
          x-jsoninclude-nonnull-annotation: true
          description: Flash video delivered over HTTPS can be used to provide live streams, but also play back recordings.
          example: https://media.c13.eagleyenetworks.com/media/streams/main/flv
        rtspUrl:
          type: string
          x-jsoninclude-nonnull-annotation: true
          description: RTSP is a protocol to request media to be sent, and to multiplex said media over one or more connections back to the client.
          example: rtsp://media.c13.eagleyenetworks.com/media/streams/main/rtsp
        rtspsUrl:
          type: string
          x-jsoninclude-nonnull-annotation: true
          description: Same as RTSP, but communication happens over a TLS socket instead of an unencrypted TCP socket.
          example: rtsps://media.c13.eagleyenetworks.com/media/streams/main/rtsp
        hlsUrl:
          type:
          - string
          - 'null'
          x-jsoninclude-nonnull-annotation: true
          description: Http Live Streaming can be used to deliver a live stream over HTTPS.
          example: https://media.c13.eagleyenetworks.com/media/recordings/main/hls/playlist.m3u8
        multipartUrl:
          type: string
          x-jsoninclude-nonnull-annotation: true
          description: Proprietary protocol that uses multipart over HTTPS to deliver raw encoded image, video and audio frames as they become available
          example: https://media.c13.eagleyenetworks.com/media/streams/main/multipart
        mp4Url:
          type:
          - string
          - 'null'
          x-jsoninclude-nonnull-annotation: true
          description: MPEG-4 Part 14 files, also known as “.mp4” files, retrieved over HTTPS to play back recorded video and sometimes audio streams. Not all video and audio codecs are supported if strictly following the standards.
          example: https://media.c13.eagleyenetworks.com/media/recordings.mp4
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ApiPaginatedMediaResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiMediaWithIncludes'
    ApiMediaWithIncludes:
      allOf:
      - $ref: '#/components/schemas/ApiMediaMain'
      - $ref: '#/components/schemas/ApiMediaIncludes'
      - type: object
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    ApiMediaMain:
      type: object
      properties:
        type:
          description: "Multiple Media can be published per source, but they should all have the same viewpoint. They can differ in:\n  * quality: `main` is higher resolution while `preview` is low resolution and low framerate.\n"
          type: string
          enum:
          - preview
          - main
        deviceId:
          type: string
          description: The device that generated the media.
          example: 10058b7a
        mediaType:
          description: What type of media is contained.
          type: string
          enum:
          - video
          - image
        startTimestamp:
          description: Start time of the media.
          type: string
          format: date-time
        endTimestamp:
          description: End time of the media.
          type: string
          format: date-time
      required:
      - type
      - startTimestamp
      - endTimestamp
      - deviceId
      - mediaType
  parameters:
    timestampLess:
      in: query
      name: timestamp__lt
      description: Return first image with timestamp less then.
      schema:
        type: string
        format: date-time
        example: '2022-08-08T07:57:37.000+00:00'
    deviceIdNotRequired:
      in: query
      name: deviceId
      description: The ID of the device that generates the media.
      schema:
        type: string
        example: 10058b7a
    targetWidth:
      in: query
      name: targetWidth
      description: 'The target width of the image to be returned. If not specified while `targetHeight` is, we scale the width to keep the aspect ratio of the image.

        '
      schema:
        type: integer
        minimum: 32
        maximum: 7680
        example: 1920
    timestampGreaterOrEqual:
      in: query
      name: timestamp__gte
      description: Return first image with timestamp greater or equal.
      schema:
        type: string
        format: date-time
        example: '2022-08-08T07:57:37.000+00:00'
    targetHeight:
      in: query
      name: targetHeight
      description: 'The target height of the image to be returned. If not specified while `targetWidth` is, we scale the height to keep the aspect ratio of the image.

        '
      schema:
        type: integer
        minimum: 32
        maximum: 4320
        example: 1080
    timestampGreater:
      in: query
      name: timestamp__gt
      description: Return first image with timestamp greater then.
      schema:
        type: string
        format: date-time
        example: '2022-08-08T07:57:37.000+00:00'
    overlayIds:
      in: query
      name: overlayId__in
      description: What info will be included in the returned overlay. At least one id must be provided if an overlay is requested for the `include` parameter.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        minItems: 1
        example:
        - een.motionDetectionEvent.v1
    type:
      in: query
      name: type
      description: The stream type of the device used to generate the media.
      required: true
      schema:
        type: string
        enum:
        - preview
        - main
    startTimestamp:
      in: query
      name: startTimestamp__gte
      description: Minimum timestamp from which you want to list recordings. Timestamps are according to ISO 8601.
      required: true
      schema:
        type: string
        format: date-time
        example: '2022-08-08T07:57:37.000+00:00'
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    include:
      in: query
      name: include
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - flvUrl
          - rtspUrl
          - rtspsUrl
          - hlsUrl
          - multipartUrl
          - mp4Url
    timestampLessOrEqual:
      in: query
      name: timestamp__lte
      description: Return first image with timestamp less or equal.
      schema:
        type: string
        format: date-time
        example: '2022-08-08T07:57:37.000+00:00'
    overlaysInclude:
      in: query
      name: include
      description: "Extra options that can be included in the api response:\n - overlayEmbedded: draws the overlay on top of the source image resulting in a single jpeg\n - overlaySvgHeader: adds the `X-Een-OverlaySvg` header containing the overlays as a SVG image\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - overlayEmbedded
          - overlaySvgHeader
    recordedType:
      in: query
      name: type
      description: The stream type of the device used to generate the media.
      schema:
        type: string
        enum:
        - preview
        - main
    token:
      in: query
      name: pageToken
      description: 'Token provided by `X-Een-NextToken` or `X-Een-PrevToken` header of a previous image call. If

        this parameter is present no other parameters are required, and any sent will be ignored

        '
      schema:
        type: string
        example: cHJldlBhZ2VQbHoK
    timestamp:
      in: query
      name: timestamp
      description: Return image at this exact timestamp.
      schema:
        type: string
        format: date-time
        example: '2022-08-08T07:57:37.000+00:00'
    liveType:
      in: query
      name: type
      required: true
      description: The stream type of the device used to generate the media.
      schema:
        type: string
        enum:
        - preview
    deviceId:
      in: query
      name: deviceId
      description: The ID of the device that generates the media.
      required: true
      schema:
        type: string
        example: 10058b7a
    coalesce:
      in: query
      name: coalesce
      description: If true, we coalesce connected intervals into a single. An interval is seen as connected if the end time and start time are exactly the same.
      schema:
        type: boolean
        default: true
    endTimestamp:
      in: query
      name: endTimestamp__lte
      description: Maximum timestamp till which you want to list recordings.
      schema:
        type: string
        format: date-time
        example: '2022-08-08T08:57:37.000+00:00'
    mediaType:
      in: query
      name: mediaType
      required: true
      description: The type of media that is queried.
      schema:
        type: string
        enum:
        - video
        - image
    pageToken:
      in: query
      name: pageToken
      description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken` and `prevPageToken` fields.

        When a pageToken is provided, the backend remembers search parameters from the original request, so search  parameters that affect the result set or order are optional and will be ignored if provided. Representation  parameters like `include` should still be applied.

        '
      example: b2Zmc2V0PTEwJmxpbWl0PTEw
      required: false
      schema:
        type: string
  responses:
    forbidden:
      description: You have no permission to access the specified resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          examples:
            invalidPermission:
              value:
                code: 403
                status: permissionDenied
                message: The client caller does not have permission for the specified operation
                details:
                - type: errorInfo
                  reason: invalidPermission
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            wrongEdition:
              value:
                code: 403
                status: permissionDenied
                message: This feature is not enabled for the account
                details:
                - type: errorInfo
                  reason: wrongEdition
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/locations
            wrongAccountType:
              value:
                code: 403
                status: permissionDenied
                message: This feature is only available for end users
                details:
                - type: errorInfo
                  reason: wrongAccountType
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/locations
    unavailable:
      description: The service or resource is currently not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          examples:
            deviceUnavailable:
              value:
                code: 503
                status: unavailable
                message: The resource is currently not available, please try later again
                details:
                - type: errorInfo
                  reason: deviceUnavailable
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            serviceUnavailable:
              value:
                code: 503
                status: unavailable
                message: The service is currently not available, please try later again
                details:
                - type: errorInfo
                  reason: serviceUnavailable
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
    resourceNotFound:
      description: Referenced resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          examples:
            endpointNotFound:
              value:
                code: 404
                status: notFound
                message: The API endpoint was not found
                details:
                - type: errorInfo
                  reason: endpointNotFound
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            resourceNotFound:
              value:
                code: 404
                status: notFound
                message: The resource was not found
                details:
                - type: errorInfo
                  reason: resourceNotFound
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
                - type: resourceInfo
                  resource: <resource>
                  ids:
                  - <ids>
    conflict:
      description: There was a conflict while trying to perform your request. See error details for more information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          examples:
            alreadyExists:
              value:
                code: 409
                status: conflict
                message: The resource already exists
                details:
                - type: errorInfo
                  reason: alreadyExists
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            foreignKeyConflict:
              value:
                code: 409
                status: conflict
                message: The resource cannot be deleted as other resources link to it. Please remove the links or delete the other resources first before deleting this resource.
                details:
                - type: errorInfo
                  reason: foreignKeyConflict
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            childDevicesExist:
              value:
                code: 409
                status: conflict
                message: This device can not be deleted before all attached cameras have been deleted. Please delete all cameras and then delete this device.
                details:
                - type: errorInfo
                  reason: childDevicesExist
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
            deviceUnavailable:
              value:
                code: 409
                status: conflict
                message: Device is not available.
                details:
                - type: errorInfo
                  reason: deviceUnavailable
                  domain: apiv3
                  metadata:
                    path: /api/v3.0/<resource>
    internalServerError:
      description: Something went wrong in the server. Please try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV3Error'
          example:
            code: 500
            status: internal
            message: An internal error has occurred. Please try again later.
            details:
            - type: errorInfo
              reason: unexpectedError
              domain: apiv3
              metadata:
                path: /api/v3.0/<resource>
    unauthorized:
      description: You are not authenticated. Please authenticate and try again.
      content:
