        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    BridgeId4:
      type: string
      pattern: ^(?:0[xX])?[0-9a-fA-F]{8}$
      example: 1000f60d
      description: 'Unique ID of an EEN bridge.

        '
    DeviceType1:
      type: string
      enum:
      - camera
      - speaker
      - display
      - multiCamera
  parameters:
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    include4:
      in: query
      name: include
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - visibleByBridgesDetailed
    state__in:
      in: query
      name: state__in
      description: 'List of different device states. If provided, the response will only contain devices with provided states.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - addable
          - notSupported
          - inOtherAccount
          - unknown
    deviceType__in:
      in: query
      name: deviceType__in
      required: true
      description: 'List of device types that are supported by the client. Required as new device types might be added at any time, which might need client (parser) changes before they are supported.

        '
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          type: string
          enum:
          - camera
          - speaker
          - display
          - multiCamera
    bridgeId__in2:
      in: query
      name: bridgeId__in
      description: Filter to get the available devices whose bridge id is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
    pageToken:
      in: query
      name: pageToken
      description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken` and `prevPageToken` fields.

        When a pageToken is provided, the backend remembers search parameters from the original request, so search  parameters that affect the result set or order are optional and will be ignored if provided. Representation  parameters like `include` should still be applied.

        '
      example: b2Zmc2V0PTEwJmxpbWl0PTEw
      required: false
      schema:
        type: string
