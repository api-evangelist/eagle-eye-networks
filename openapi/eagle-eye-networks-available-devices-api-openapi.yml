      example: ddfa5b34-5d04-431e-8287-110fe87edf71
    ApiAvailableDevice:
      description: 'Represents a device found that is available to be added to the account. Note: Schema might change for new device types, so make sure any parsing code that has strict requirements only tries to parse device types it has been written for and doesn''t try to parse everything.

        '
      type: object
      properties:
        deviceType:
          $ref: '#/components/schemas/DeviceType1'
        guid:
          $ref: '#/components/schemas/Guid4'
        state:
          type: string
          enum:
          - addable
          - notSupported
          - inOtherAccount
          - unknown
          default: unknown
          description: "Indicates if and how a device can be added. *As there might be future reasons why devices cannot be added clients should be written in such a way that they can handle new values to be added. In case a client doesn't understand the state, it should handle it as it handles the \"unknown\" state, which should be to still show the device, but tell the user to contact support to help. add the device.\nThe states:\n  * `addable`: Camera can be added and should work.\n  * `notSupported`: Indicates if the device can really be added, or if it is unsupported, due to for example an\nuntested firmware version or unexpected responses from the device. Unsupported devices are reported to help users debug why they cannot add a device. The users should contact support if they wish to add the device to their account.\n  * `inOtherAccount`: Indicates if the device has already been added to a different account, and it is thus not\npossible to add it to the current account. The user should contact support to resolve this issue.\n  * `unknown`: Indicates the camera is in a state that means it is visible, but cannot be added due to some\nissue. This state cane be transient, so users should be told to try again a few minutes later. If it is still in this state, users should contact support to help resolve the issue.\n"
        unknownCredentials:
          type: boolean
          description: 'No working credentials are known for this camera, and thus the device will not work directly after adding. The user can either supply credentials while adding the device, change them after adding, or reset the device and thus its credentials.

            '
        visibleByBridges:
          type: array
          items:
            $ref: '#/components/schemas/BridgeId4'
        make:
          description: The manufacturer or brand of the camera.
          type:
          - string
          - 'null'
        model:
          description: The model of the camera.
          type:
          - string
          - 'null'
        firmwareVersion:
          type:
          - string
          - 'null'
          example: v20211019_542_3022
        ipAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress2'
          - description: The IP address that is used to communicate to the device.
        otherIpAddress:
          description: Other known IP addresses of the device.
          type: array
          items:
            $ref: '#/components/schemas/IpAddress2'
        visibleByBridgesDetailed:
          type: array
          x-jsoninclude-nonnull-annotation: true
          items:
            $ref: '#/components/schemas/Bridge'
      required:
      - deviceType
      - guid
      - state
      - unknownCredentials
      - visibleByBridges
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    Bridge:
      type: object
      properties:
