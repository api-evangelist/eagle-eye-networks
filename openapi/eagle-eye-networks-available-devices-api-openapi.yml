openapi: 3.2.0
info:
  title: Available Devices API
  version: 3.0.0
  description: Automatically discovered devices that can be added to the account.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Available Devices
  description: Automatically discovered devices that can be added to the account.
paths:
  /availableDevices:
    get:
      operationId: listAvailableDevices
      tags:
      - Available Devices
      description: 'This endpoint returns a list of all devices found by the bridges in the account that have not yet been added. Devices of a certain type will not be reported in the response if the user does not have permission to add them. Since adding specific device types requires calling a device-type-specific API, it is recommended to filter on the devices supported by the cameras, rather than retrieving "all" types.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available devices, not the number of devices resulting from the query string.'
      parameters:
      - $ref: '#/components/parameters/deviceType__in'
      - $ref: '#/components/parameters/state__in'
      - $ref: '#/components/parameters/bridgeId__in2'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/include4'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedAvailableDeviceResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List available devices
      x-summary-source: derived
