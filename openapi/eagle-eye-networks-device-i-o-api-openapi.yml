openapi: 3.2.0
info:
  title: DEVICES Device I/O API
  version: 3.0.0
  description: Operations on device I/O ports.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Device I/O
  description: Operations on device I/O ports.
paths:
  /devices/{deviceId}/io/ports:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    get:
      operationId: getPorts1
      parameters:
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      description: Retrieves list of device IO ports.
      tags:
      - Device I/O
      responses:
        '200':
          description: Successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPortResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get ports1
      x-summary-source: derived
  /devices/{deviceId}/io/ports/{portId}:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/portId'
    get:
      operationId: getPort1
      parameters:
      - $ref: '#/components/parameters/include'
      description: Retrieves the device port.
      tags:
      - Device I/O
      responses:
        '200':
          description: Successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get port1
      x-summary-source: derived
    patch:
      operationId: updatePort2
      description: Update the port configuration. Allowed properties depends on the port type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortPatch'
      tags:
      - Device I/O
      responses:
        '204':
          description: Port Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update port2
      x-summary-source: derived
  /devices/{deviceId}/io/ports/{portId}/recordingActions:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/portId'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/pageSize'
    get:
      operationId: getPortRecorders
      description: Retrieves the list of all cameras that can be activated to record video, including those that are currently enabled for recording actions on this port.
      tags:
      - Device I/O
      responses:
        '200':
          description: Successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPortRecordingActionResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get port recorders
      x-summary-source: derived
  /devices/{deviceId}/io/ports/{portId}/recordingActions/{cameraId}:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/portId'
    - $ref: '#/components/parameters/cameraId'
    get:
      operationId: getPortRecorder
      description: Retrieves the recording action information for the camera and IO Port
      tags:
      - Device I/O
      responses:
        '200':
          description: Successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortRecordingActionGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get port recorder
      x-summary-source: derived
    patch:
      operationId: updatePortRecorder
      description: Update the recording action configuration for the given camera and port.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortRecordingActionPatch'
      tags:
      - Device I/O
      responses:
        '204':
          description: Port Recorder Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update port recorder
      x-summary-source: derived
components:
