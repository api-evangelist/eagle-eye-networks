            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    PaginatedPortResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/PortGet'
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    PortStatusGet:
      type: object
      properties:
        state:
          type: string
          description: Interpreted state of the connected circuit.
          enum:
          - active
          - idle
          - unknown
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    PortRules:
      type: object
      properties:
        recordOnActive:
          type: boolean
          description: If this value is set to true, the port is an input and the device can record video, then the bridge should start recording when the port becomes active.
        icon:
          type:
          - string
          - 'null'
          description: If enabled, the given icon is shown for all livestreams of the camera and highlighted when the port is active. For ports of "output" type the icon can then also be clicked to change the state of the camera.
          enum:
          - siren
          - light
          - dot
          - door
          - bell
        iconEnabled:
          type: boolean
          description: Inidicates if the icon should be visible on all livestreams.
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    PortRecordingActionPatch:
      type: object
      properties:
        enabled:
          type: boolean
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    PortStatusPatch:
      type: object
      properties:
        state:
          type: string
          description: Set the state of the connected circuit.
          enum:
          - active
          - idle
        durationSeconds:
          type: integer
          description: 'Number of seconds to hold the circuit in the given state.  If not provided, the state will hold indefinitely.

            '
          example: 10
          minimum: 1
          maximum: 3600000
    PortOutputPatch:
      allOf:
      - $ref: '#/components/schemas/Port'
      - type: object
        properties:
          status:
            $ref: '#/components/schemas/PortStatusPatch'
    PaginatedPortRecordingActionResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/PortRecordingActionGet'
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    PortGet:
      allOf:
      - $ref: '#/components/schemas/Port'
      - type: object
        properties:
          status:
            $ref: '#/components/schemas/PortStatusGet'
      required:
      - id
      - enabled
      - name
      - type
      - idleCircuitState
    PortRecordingActionGet:
      type: object
      properties:
        cameraId:
          type: string
          description: The cameraId of the camera
        enabled:
          type: boolean
          description: Determines if the camera will record video when the port is triggered
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    PortPatch:
      oneOf:
      - $ref: '#/components/schemas/Port'
      - $ref: '#/components/schemas/PortOutputPatch'
    Port:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Unique ID for the port.
          example: '1'
        enabled:
          type: boolean
          description: If the port is not enabled, no events will be created, and the icon will not show up in the live stream.
        name:
          type: string
          description: Human changeable name of the port, defaults to value of the id field.
          example: Input 1
          minLength: 1
          maxLength: 126
        type:
          type: string
          readOnly: true
          description: Denotes whether this is an input or output port.
          enum:
          - input
          - output
        idleCircuitState:
          type: string
          description: 'Indicates the normal, inactive or idle, state of the connected circuit.

            Possible values:


            * `open`: means the port is "off" when in `idle` state (open circuit; has no voltage), and the port state being `active` means it is turned "on" (circuit is closed; has voltage).

            * `closed`: means the port is "on" when in `idle` state (closed circuit; has voltage), and the port state being active means it is turned "off" (open circuit; has no voltage).

            '
          enum:
          - open
          - closed
        rules:
          $ref: '#/components/schemas/PortRules'
