openapi: 3.2.0
info:
  title: DEVICES Speakers API
  version: 3.0.0
  description: All core operations on one speakers, which are can be used to broadcast audio.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Speakers
  description: All core operations on one speakers, which are can be used to broadcast audio.
paths:
  /speakers:
    get:
      operationId: listSpeakers
      description: 'Retrieving a list of speakers is possible with this endpoint.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available speakers, not the number of speakers resulting from the query string.'
      tags:
      - Speakers
      parameters:
      - $ref: '#/components/parameters/includeForList2'
      - $ref: '#/components/parameters/sort2'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/locationId__in'
      - $ref: '#/components/parameters/bridgeId__in1'
      - $ref: '#/components/parameters/tags__contains2'
      - $ref: '#/components/parameters/tags__any2'
      - $ref: '#/components/parameters/name__contains2'
      - $ref: '#/components/parameters/name__in2'
      - $ref: '#/components/parameters/name2'
      - $ref: '#/components/parameters/id__in2'
      - $ref: '#/components/parameters/id__contains2'
      - $ref: '#/components/parameters/q2'
      - $ref: '#/components/parameters/qRelevance__gte'
      - $ref: '#/components/parameters/status__in'
      - $ref: '#/components/parameters/status__ne'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSpeakerResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List speakers
      x-summary-source: derived
    post:
      operationId: addSpeaker
      description: By using this endpoint you can create a speaker.
      tags:
      - Speakers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAddSpeaker'
      responses:
        '201':
          description: Speaker added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSpeakerMain'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add speaker
      x-summary-source: derived
  /speakers/{speakerId}:
    parameters:
    - in: path
      name: speakerId
      schema:
        type: string
      required: true
    get:
      operationId: getSpeaker
      description: This endpoint allows you to retrieve a specific speaker.
      tags:
      - Speakers
      parameters:
      - $ref: '#/components/parameters/includeForSingle2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerForSingle'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get speaker
      x-summary-source: derived
    patch:
      operationId: updateSpeaker
      description: This endpoint allows you to update a specific speaker.
      tags:
      - Speakers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSpeakerUpdate'
      responses:
        '204':
          description: Speaker updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update speaker
      x-summary-source: derived
    delete:
      operationId: deleteSpeaker
      description: 'This endpoint allows you to dis-associate a speaker from the account, removing all references, recordings, and events.


        This request will be blocked until the speaker has been fully removed.'
      tags:
      - Speakers
      responses:
        '204':
          description: Speaker deleted.
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete speaker
      x-summary-source: derived
  /speakers/{speakerId}/settings:
    parameters:
    - $ref: '#/components/parameters/speakerId'
    get:
      operationId: getSpeakerSettings
      tags:
      - Speakers
      parameters:
      - $ref: '#/components/parameters/settingsInclude'
      description: Retrieves the current settings for the given speaker.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvancedSettings'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get speaker settings
      x-summary-source: derived
    patch:
      operationId: updateSpeakerSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancedSettings'
      tags:
      - Speakers
      description: Updates the settings of a speaker.
      responses:
        '204':
          description: Speaker Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update speaker settings
      x-summary-source: derived
components:
  schemas:
    RegistrationStrategy:
      description: Indicates how the speaker was added to the system
      type: string
      default: discoveredSip
      enum:
      - discoveredSip
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    TalkdownSettings:
      type: object
      properties:
        protocol:
          type: string
          description: Specifies the audio communication protocol.
          example: sip
        audioMode:
          type: string
          description: Specifies mode of audio communication.
          enum:
          - disabled
          - talkDown
          - twoWayAudio
        sipCredentials:
          allOf:
          - description: 'The credentials that will be used to authenticate SIP sessions.

              '
          - $ref: '#/components/schemas/ApiDeviceCredentials'
    Guid2:
      type: string
      format: uuid
      example: ddfa5b34-5d04-431e-8287-110fe87edf71
    DeviceTags:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 64
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    deviceCloudConnectionStatusV2:
      description: "Socket connection state between device and cloud\n  * `connected`: The device socket connected to cloud.\n  * `disconnected`: The device socket disconnected from cloud.\n"
      type: string
      enum:
      - connected
      - disconnected
      example: connected
    ApiTimeZone:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        zone:
          type: string
          example: America/Chicago
          description: The timezone the device is in. The list of supported timezones is provided by the [/timeZones](https://developer.eagleeyenetworks.com/reference/listtimezones) endpoint.
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    SpeakerSettings:
      description: Device specific settings that can be configured on the speakers. This is accessible for shared speakers?
      type: object
      properties:
        mainCredentials:
          allOf:
          - description: 'The credentials that will used for communicating with the devices with the main API of the device, which generally is its ONVIF API.

              '
          - $ref: '#/components/schemas/ApiDeviceCredentials1'
        adminCredentials:
          $ref: '#/components/schemas/AdminCredentials'
        sipCredentials:
          allOf:
          - description: 'The credentials that will be used to authenticate SIP sessions.

              '
          - $ref: '#/components/schemas/ApiDeviceCredentials1'
        sipPort:
          type: integer
          description: Port to which SIP requests should be sent from the bridge. Applicable for sip speakers and defaults to 5060
          minimum: 1025
          maximum: 65535
          default: 5060
          example: 5060
    ApiAdapterInfo:
      type: object
      properties:
        macAddress:
          $ref: '#/components/schemas/MacAddress'
        ipAddress:
          $ref: '#/components/schemas/IpAddress'
    ApiSpeakerCapabilities:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        io:
          $ref: '#/components/schemas/ApiDeviceIOCapabilities'
      required:
      - io
    AdvancedSettingsSchema:
      type: object
      readOnly: true
      description: Json schema of version draft 4.
      example:
        $schema: http://json-schema.org/draft-04/schema#
        type: object
        properties:
          protocol:
            type: string
            enum:
            - sip
            - onvif
          audioMode:
            type: string
            enum:
            - disabled
            - talkDown
            - twoWayAudio
          mainCredentials:
            type: object
            properties:
              username:
                type: string
              password:
                type: string
          sipCredentials:
            type: object
            properties:
              username:
                type: string
              password:
                type: string
    DeviceConnectionStatus:
      type: string
      description: "Indicates the connection status of the device:\n  * `online`: The device is online and operational.\n  * `deviceOffline`: The device is offline.\n  * `invalidCredentials`: The known credentials for this device, including the default credentials, are invalid. This is causing the device to appear offline.\n  * `bridgeOffline`: The bridge that connects this device to the cloud is offline. However, both the device and the bridge may still be operational locally, even though the cloud has no visibility into their status.\n  * `off`: The device is online, but has been turned off by the user.\n  * `error`: The device is offline due to some problem that has not been described by any of the other statuses.\n  * `busy`: The device is currently busy and unavailable for other operations.\n  * `unknown`: The device state is unknown for some reason.\n"
      enum:
      - online
      - deviceOffline
      - invalidCredentials
      - bridgeOffline
      - 'off'
      - error
      - busy
      - unknown
    SpeakerForList:
      allOf:
      - $ref: '#/components/schemas/ApiSpeakerMain'
      - $ref: '#/components/schemas/ApiSpeakerIncludes'
      - $ref: '#/components/schemas/ApiSpeakerFTSRelated'
    ApiDeviceInfo2:
      description: Information that could also be visible on the physical device.
      type: object
      properties:
        make:
          description: The Manufactorer or brand of the speaker.
          type: string
          example: Axis communications
        model:
          description: The model of the speaker.
          type: string
          example: C1310-E Network Horn Speaker
        guid:
          $ref: '#/components/schemas/Guid2'
    Settings1:
      allOf:
      - $ref: '#/components/schemas/TalkdownSettings'
      - type: object
        properties:
          mainCredentials:
            allOf:
            - $ref: '#/components/schemas/ApiDeviceCredentials'
            - description: 'The credentials that will be used for communicating with the devices. These credentials should be for the main API of the device, which generally is its ONVIF API.

                '
    ApiDevicePosition:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        latitude:
          description: The latitude of the device. (WGS 84)
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
          example: 52.3074013
        longitude:
          description: The longitude of the device. (WGS 84).
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
          example: 4.9459903
        azimuth:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 360
          example: 7.419435
        rangeInMeters:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          example: 50.4
        floor:
          type:
          - integer
          - 'null'
          minimum: -30
          maximum: 300
          example: 50
        fieldOfView:
          description: Field of view is the range of the observable world visible at any given time through camera viewfinder.
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 360
          example: 100
    IpAddress:
      type:
      - string
      - 'null'
      pattern: ^(?:25[0-5]|2[0-4]\d|[0-1]?\d{1,2})(?:\.(?:25[0-5]|2[0-4]\d|[0-1]?\d{1,2})){3}$
      example: 10.143.55.140
    SpeakerForSingle:
      allOf:
      - $ref: '#/components/schemas/ApiSpeakerMain'
      - $ref: '#/components/schemas/ApiSpeakerIncludes'
    DeviceNotes:
      type: string
      example: Painted black to better blend with its environment.
      maxLength: 5000
    ApiDeviceIOCapabilities:
      type: object
      properties:
        capable:
          type: boolean
          description: Indicates that the device support input / output ports
          default: false
        sharedTrigger:
          type: boolean
          description: Indicates an input can trigger video record on many devices on the bridge
          default: false
    ApiSpeakerUpdate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/DeviceName'
        notes:
          $ref: '#/components/schemas/DeviceNotes'
        tags:
          $ref: '#/components/schemas/DeviceTags'
        locationId:
          $ref: '#/components/schemas/LocationId'
    LocationSummary:
      type: object
      x-jsoninclude-nonnull-annotation: true
      description: Summary of location information.
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: object
          properties:
            country:
              type:
              - string
              - 'null'
            region:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            streetAddress:
              type:
              - string
              - 'null'
            streetAddress2:
              type:
              - string
              - 'null'
            postalCode:
              type:
              - string
              - 'null'
    PaginatedSpeakerResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/SpeakerForList'
    DeviceCommonStatus:
      description: "Indicates the operational status of the device. The statuses defined here should be in sync with the DeviceStatus schema.\n  * `operational`: The device is online and operational.\n  * `error`: Device not working (requires error details).\n  * `disabled`: Operational but intentionally not recording telemetry\n  * `unreachable`: The device is not reachable (e.g., offline, out of service).\n  * `unknown`: The device state is unknown for some reason.\n  * `initializing`: The device is in the process of initializing.\n"
      type: string
      enum:
      - operational
      - error
      - disabled
      - unreachable
      - unknown
      - initializing
      example: operational
    EffectiveSpeakerPermissions:
      readOnly: true
      type: object
      properties:
        read:
          type: boolean
        delete:
          type: boolean
        edit:
          type: boolean
    ApiDeviceCredentials1:
      type: object
      properties:
        username:
          type: string
          description: Username to use when authenticating with the device
        password:
          type: string
          description: Password to use when authenticating with the device. Password will not be returned in the GET apis. However, POST and PATCH will take the password field.
      required:
      - username
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ApiNetworkInfo1:
      type: object
      properties:
        interface:
          type: string
          enum:
          - lan
          - wan
          description: "The bridge interface to which the speaker is attached:\n * lan: Camera lan interface.\n * wan: Wide Area network interface.\n"
        ipUsedByBridge:
          $ref: '#/components/schemas/IpUsedByBridge'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/ApiAdapterInfo'
    ApiEsns:
      type: array
      items:
        type: string
        pattern: ^[a-fA-F0-9]{8},?$
      example:
      - '00001106'
      - '00001107'
    ApiSpeakerMain:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          $ref: '#/components/schemas/DeviceName'
        bridgeId:
          $ref: '#/components/schemas/BridgeId1'
        locationId:
          $ref: '#/components/schemas/LocationId'
        isShared:
          type: boolean
      required:
      - id
      - accountId
      - name
      - bridgeId
    PaginatedResponse:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages and, if  available, the total number of results.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken.  This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken.  This value can be null of there is no previous page.

            '
        totalSize:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: 'The number of resource entries being returned from the result set.  This can be omitted if the API endpoint does not have total size information.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    ApiSpeakerFTSRelated:
      type: object
      properties:
        qRelevance:
          type: number
          description: 'Field is only returned when `q` parameter is used and its value indicates the relevance of the speaker in relation to the terms in the `q` parameter. The range of this value is between 0 and 1, higher is better.

            '
          format: float
          minimum: 0
          maximum: 1
          example: 0.5
          readOnly: true
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    AdminCredentials:
      allOf:
      - description: 'Credentials that allow the bearer to access the camera''s internal UI. This UI, available via the [tunneling endpoint](https://developer.eagleeyenetworks.com/reference/putcameratunnel), can be used to apply certain advanced configurations.

          '
      - $ref: '#/components/schemas/ApiDeviceCredentials'
    DeviceErrorStatus:
      description: "Indicates the detailed error status of a device, grouped by device type:\nONVIF Camera / RTSP Camera / Multicamera:\n  * `generalDeviceError`: Camera error\n  * `networkError`: Network error\n  * `invalidCredentials`: Invalid credentials\n  * `deviceSupportIssue`: Device support issue\n  * `queuedForConfiguration`: Queued for configuration\n  * `configurationInProgress`: Configuration in progress\n  * `deviceDisabled`: Device is turned off\n  * `disconnectedFromBridge`: Disconnected from bridge\n\nAnalog Camera:\n  * `analogNoPower`: Power loss detected\n  * `analogBadSignal`: Signal quality issue\n  * `analogIncompatibleSignal`: Incompatible signal\n  * `analogNoSignal`: No signal\n  * `disconnectedFromBridge`: Disconnected from bridge\n  * `deviceDisabled`: Device is turned off\n\nManaged Switch:\n  * `deviceSupportIssue`: Switch support issue\n  * `disconnectedFromBridge`: Disconnected from bridge\n"
      x-een-device-type-error-status-mapping:
        onvifCamera:
        - generalDeviceError
        - networkError
        - invalidCredentials
        - deviceSupportIssue
        - queuedForConfiguration
        - configurationInProgress
        - deviceDisabled
        - disconnectedFromBridge
        rtspCamera:
        - generalDeviceError
        - networkError
        - invalidCredentials
        - deviceSupportIssue
        - queuedForConfiguration
        - configurationInProgress
        - deviceDisabled
        - disconnectedFromBridge
        analogCamera:
        - analogNoPower
        - analogBadSignal
        - analogIncompatibleSignal
        - analogNoSignal
        - disconnectedFromBridge
        - deviceDisabled
        multiCamera:
        - generalDeviceError
        - networkError
        - invalidCredentials
        - deviceSupportIssue
        - queuedForConfiguration
        - configurationInProgress
        - deviceDisabled
        - disconnectedFromBridge
        managedSwitch:
        - deviceSupportIssue
        - disconnectedFromBridge
      type: string
      enum:
      - disconnectedFromBridge
      - generalDeviceError
      - networkError
      - invalidCredentials
      - deviceSupportIssue
      - queuedForConfiguration
      - configurationInProgress
      - deviceDisabled
      - analogNoPower
      - analogBadSignal
      - analogIncompatibleSignal
      - analogNoSignal
      example: generalDeviceError
    BridgeId1:
      type: string
      pattern: ^(?:0[xX])?[0-9a-fA-F]{8}$
      example: 1000f60d
    IpUsedByBridge:
      type:
