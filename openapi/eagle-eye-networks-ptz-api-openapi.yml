          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    MoveType:
      type: string
      enum:
      - position
      - centerOn
      - direction
    PtzSettings:
      type: object
      properties:
        presets:
          type: array
          maxItems: 30
          description: Saved positions. Order of this array will be used by the tour mode.
          items:
            $ref: '#/components/schemas/PtzPreset'
        homePreset:
          type:
          - string
          - 'null'
          example: Preset 1
          description: Name of the default preset to which the camera will return if set to homeReturn after the specified auto start delay.
        mode:
          type: string
          enum:
          - homeReturn
          - tour
          - manualOnly
          description: "The following modes are available:\n  * `manualOnly`: The PTZ camera will only move when issued a direct command by the user.\n  * `homeReturn`: After a specified amount of time without receiving a command,\nthe PTZ camera will navigate back to the home preset position.  If none is set, this will be the factory default position.\n  * `tour`: After the specified auto start delay, the PTZ camera will tour through all\npresets in the order specified by the user. It will continue doing so until interrupted and will resume after the aforementioned auto start delay.\n"
        autoStartDelay:
          type: integer
          minimum: 5
          description: The time in seconds after which the PTZ camera should resume Touring or return to Home when idling.
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    ApiPtzCenterOnMove:
      description: Move the center of the camera to the indicated(clicked) point within the shown image. The point is encoded as the relative x and y based on the width and height of the shown image on a scale from 0 to 1, where the (0,0) coordinate is top left and (1,1) is bottom right.
      properties:
        moveType:
          type: string
          enum:
          - centerOn
        relativeX:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Relative x coordinate.
        relativeY:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Relative y coordinate.
      required:
      - relativeX
      - relativeY
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ApiPtzPosition:
      description: The ptz coordinates of the camera in a space defined as pan:(-1,1), tilt:(-1,1), zoom:(0,1).
      type: object
      properties:
        x:
          type: number
          format: double
          description: Pan coordinate given as value between -1(max left) and 1(max right).
          minimum: -1
          maximum: 1
        y:
          type: number
          format: double
          description: Tilt coordinate given as value between -1(max down) and 1(max up).
          minimum: -1
          maximum: 1
        z:
          type: number
          format: double
          description: Zoom coordinate given as value between 0(fully zoomed out) and 1(fully zoomed in).
          minimum: 0
          maximum: 1
      minProperties: 1
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ApiPtzPositionMove:
      description: Moves the camera to a ptz coordinate in a space defined as pan:(-1,1), tilt:(-1,1), zoom:(0,1). This move is normally used for moving to presets. It is not only possible to give the full x,y,z coordinates here, you can also either give only x,y or give only z.
      allOf:
      - $ref: '#/components/schemas/ApiPtzPosition'
      - properties:
          moveType:
            type: string
            enum:
            - position
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ApiPtzMove:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ApiPtzCenterOnMove'
      - $ref: '#/components/schemas/ApiPtzDirectionMove'
      - $ref: '#/components/schemas/ApiPtzPositionMove'
      discriminator:
        propertyName: moveType
        mapping:
          centerOn: '#/components/schemas/ApiPtzCenterOnMove'
          direction: '#/components/schemas/ApiPtzDirectionMove'
          position: '#/components/schemas/ApiPtzPositionMove'
      properties:
        moveType:
          $ref: '#/components/schemas/MoveType'
      required:
      - moveType
    ApiPtzDirectionMove:
      description: Move the camera in the given direction.
      properties:
        moveType:
          type: string
          enum:
          - direction
        direction:
          description: The direction to move in.
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum:
            - up
            - down
            - left
            - right
            - in
            - out
        stepSize:
          description: How much we will move, if no stepSize is given then `medium` stepsize is taken.
          type: string
          enum:
          - small
          - medium
          - large
          default: medium
      required:
      - direction
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
    PtzPreset:
      type: object
      properties:
        name:
          type: string
          example: Preset 1
        position:
          $ref: '#/components/schemas/ApiPtzPosition'
        timeAtPreset:
          type: integer
          minimum: 5
          description: Specifies the number of seconds to remain at a preset when in tour mode.
      required:
      - name
      - position
      - timeAtPreset
    PtzSettingsGet:
      allOf:
      - $ref: '#/components/schemas/PtzSettings'
      required:
      - presets
      - homePreset
      - mode
      - autoStartDelay
