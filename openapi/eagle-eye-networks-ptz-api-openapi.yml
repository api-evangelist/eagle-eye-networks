openapi: 3.2.0
info:
  title: DEVICES PTZ API
  version: 3.0.0
  description: Retrieve and control the camera using pan tilt and zoom controls.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: PTZ
  description: Retrieve and control the camera using pan tilt and zoom controls.
paths:
  /cameras/{cameraId}/ptz/position:
    parameters:
    - $ref: '#/components/parameters/cameraId1'
    get:
      operationId: getCurrentPosition
      description: This endpoint returns the current position of the camera. The response includes the pan, tilt, and zoom values of the camera. If the camera does not support pan or tilt or zoom, the corresponding value will not be present in the response.
      tags:
      - PTZ
      responses:
        '200':
          description: Current PTZ position of camera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPtzPosition'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get current position
      x-summary-source: derived
    put:
      operationId: moveTo
      description: This endpoint moves the camera to a specific position, in a specific direction, or to a specific center point on the screen. The endpoint accepts a move object that can be either a position move, a direction move or a center move.
      tags:
      - PTZ
      requestBody:
        description: 'Describes where to move the camera to, this could be either a directional, center or position move object. For a position move it is possible to only specify the zoom or the pan and tilt you want to move. It is of course also possible to give all 3 coordinates.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiPtzMove'
            examples:
              Direction:
                value:
                  moveType: direction
                  direction:
                  - up
                  stepSize: large
              Position:
                value:
                  moveType: position
                  x: 0.12345
                  y: -0.98765
                  z: 0.45678
              Center:
                value:
                  moveType: centerOn
                  relativeX: 0.3148
                  relativeY: 0.732
      responses:
        '204':
          description: Camera moved to given position.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Move to
      x-summary-source: derived
  /cameras/{cameraId}/ptz/settings:
    parameters:
    - $ref: '#/components/parameters/cameraId2'
    get:
      operationId: getPtzSettings
      description: Retrieves the PTZ settings for the given camera.
      tags:
      - PTZ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PtzSettingsGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get ptz settings
      x-summary-source: derived
    patch:
      operationId: updatePtzSettings
      description: Updates the PTZ settings for the given camera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PtzSettings'
      tags:
      - PTZ
      responses:
        '204':
          description: Camera Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update ptz settings
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
