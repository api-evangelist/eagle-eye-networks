openapi: 3.2.0
info:
  title: GROUPING Floor Plans API
  version: 3.0.0
  description: Allows the retrieval and management of floor plans of a location.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Floor Plans
  description: Allows the retrieval and management of floor plans of a location.
paths:
  /locations/{locationId}/floors/{id}.{type}:
    parameters:
    - $ref: '#/components/parameters/locationId'
    - $ref: '#/components/parameters/floorId'
    - $ref: '#/components/parameters/type'
    get:
      operationId: getFloorImage
      description: This endpoint allows you to retrieve the floor image of a specific floor. Please first check the floorPlans field in GET /locations/{locationId}/floors or GET /locations/{locationId}/floors/{id} to see if a file with this format exists. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Floor Plans
      responses:
        '200':
          description: Successfully fetched
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get floor image
      x-summary-source: derived
  /locations/{locationId}/floors/{id}/plans:
    parameters:
    - $ref: '#/components/parameters/locationId'
    - $ref: '#/components/parameters/floorId'
    get:
      operationId: getFloorPlans
      description: 'This endpoint allows you to retrieve plans of a specific floor at a specific location. Support for Location-based camera grouping is only available in the professional and enterprise editions.

        To retrieve an image file of the floor plan, please use the `/locations/{locationId}/floors/{id}.{type}` endpoint. The `type` parameter in that endpoint corresponds to the `type` property in the response of this resource.'
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      tags:
      - Floor Plans
      responses:
        '200':
          description: Successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFloorPlansResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get floor plans
      x-summary-source: derived
    post:
      operationId: setFloorPlan
      description: This endpoint allows you to create a floor plan for a specific floor at a specific location. Currently only one floor plan file is supported per floor, which means that uploading a new file will overwrite any existing file, even if it has a different format (svg vs png). Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Floor Plans
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  format: binary
      responses:
        '201':
          description: Successfully set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorPlanGetResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Set floor plan
      x-summary-source: derived
  /locations/{locationId}/floors/{id}/plans/{planId}:
    parameters:
    - $ref: '#/components/parameters/locationId'
    - $ref: '#/components/parameters/floorId'
    - $ref: '#/components/parameters/planId'
    delete:
      description: This endpoint allows you to delete a floor plan and its corresponding SVG or PNG file. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      operationId: deleteFloorPlan
      tags:
      - Floor Plans
      responses:
        '204':
          description: Floor plan deleted
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete floor plan
      x-summary-source: derived
