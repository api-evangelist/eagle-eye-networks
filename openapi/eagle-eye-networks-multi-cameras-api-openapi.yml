openapi: 3.2.0
info:
  title: DEVICES Multi Cameras API
  version: 3.0.0
  description: Core operation on multi camera devices.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Multi Cameras
  description: Core operation on multi camera devices.
paths:
  /multiCameras:
    get:
      operationId: listMultiCameras
      description: 'This endpoint allows you to retrieve a list of multi cameras for a given account and location. Multi cameras are devices such as DVRs that have multiple cameras connected.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available multi cameras, not the number of multi cameras resulting from the query string.'
      tags:
      - Multi Cameras
      parameters:
      - $ref: '#/components/parameters/locationId__in'
      - $ref: '#/components/parameters/bridgeId__in'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/qRelevance__gte'
      - $ref: '#/components/parameters/sort3'
      - $ref: '#/components/parameters/status__in'
      - $ref: '#/components/parameters/status__ne'
      - $ref: '#/components/parameters/include3'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedMultiCameraResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List multi cameras
      x-summary-source: derived
    post:
      operationId: addMultiCamera
      description: This endpoint allows a multi camera to be associated with an account. It can only be called with an end-user account and will fail if called with another type of account.
      tags:
      - Multi Cameras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAddMultiCamera'
      responses:
        '201':
          description: Multi camera added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMultiCameraMain'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          description: There was a conflict while trying to perform your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
              examples:
                alreadyExists:
                  description: The multi camera you're trying to add is already added or currently being added in the system. There cannot be duplicated multi camera (using the same MAC address or GUID). Make sure to remove the existing one before you proceed to add it again.
                  value:
                    code: 409
                    status: conflict
                    message: The resource already exists.
                    details:
                    - type: errorInfo
                      reason: alreadyExists
                      domain: apiv3
                      metadata:
                        path: /api/v3.0/<resource>
        '500':
          description: The request encountered an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
        '504':
          description: The request had a deadline that expired before the operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV3Error'
      summary: Add multi camera
      x-summary-source: derived
  /multiCameras/{multiCameraId}:
    parameters:
    - in: path
      name: multiCameraId
      schema:
        type: string
      required: true
    get:
      operationId: getMultiCamera
      description: This endpoint allows you to retrieve information about a multi camera based on its ID.
      tags:
      - Multi Cameras
      parameters:
      - $ref: '#/components/parameters/include3'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMultiCameraWithIncludes'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get multi camera
      x-summary-source: derived
    delete:
      operationId: deleteMultiCamera
      description: 'This endpoint allows you to dis-associate a multi camera from the account, removing all references, recordings, and events.


        This request will be blocked until the multi camera has been fully removed.'
      tags:
      - Multi Cameras
      responses:
        '204':
          description: Multi camera deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete multi camera
      x-summary-source: derived
    patch:
      operationId: updateMultiCamera
      description: This endpoint allows you to update a multi camera's data based on its ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiMultiCameraUpdate'
      tags:
      - Multi Cameras
      responses:
        '204':
          description: Multi camera Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update multi camera
      x-summary-source: derived
  /multiCameras/{multiCameraId}/channels:
    parameters:
    - in: path
      name: multiCameraId
      schema:
        type: string
      required: true
    get:
      operationId: getMultiCameraChannels
      description: This endpoint allows you to retrieve the channel info of a multi camera. This information can be used to add a camera connected to the channel to the account using the /cameras endpoint. The channel details are read-only. To manipulate a new camera use the /cameras endpoint. If the cameraId is not empty then it means that the camera is already added to the account. It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available channels, not the number of channels resulting from the query string.
      tags:
      - Multi Cameras
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPaginatedMultiCameraChannelResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get multi camera channels
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    DeviceNotes:
      type: string
      example: Painted black to better blend with its environment.
      maxLength: 5000
    ApiMultiCameraWithIncludes:
      allOf:
      - $ref: '#/components/schemas/ApiMultiCameraMain'
      - $ref: '#/components/schemas/ApiMultiCameraIncludes'
      - type: object
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    DeviceTags:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 64
    LocationSummary:
      type: object
      x-jsoninclude-nonnull-annotation: true
      description: Summary of location information.
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: object
          properties:
            country:
              type:
              - string
              - 'null'
            region:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            streetAddress:
              type:
              - string
              - 'null'
            streetAddress2:
              type:
              - string
              - 'null'
            postalCode:
              type:
              - string
              - 'null'
    ApiDevicePosition:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        latitude:
          description: The latitude of the device. (WGS 84)
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
          example: 52.3074013
        longitude:
          description: The longitude of the device. (WGS 84).
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
          example: 4.9459903
        azimuth:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 360
          example: 7.419435
        rangeInMeters:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          example: 50.4
        floor:
          type:
          - integer
          - 'null'
          minimum: -30
          maximum: 300
          example: 50
        fieldOfView:
          description: Field of view is the range of the observable world visible at any given time through camera viewfinder.
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 360
          example: 100
    BridgeId3:
      type: string
      pattern: ^(?:0[xX])?[0-9a-fA-F]{8}$
      example: 1000f60d
      description: "The bridge a multi camera is connected to. \n"
    ApiMultiCameraUpdate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/DeviceName'
        notes:
          $ref: '#/components/schemas/DeviceNotes'
        locationId:
          $ref: '#/components/schemas/LocationId'
        tags:
          $ref: '#/components/schemas/DeviceTags'
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    DeviceErrorStatus:
      description: "Indicates the detailed error status of a device, grouped by device type:\nONVIF Camera / RTSP Camera / Multicamera:\n  * `generalDeviceError`: Camera error\n  * `networkError`: Network error\n  * `invalidCredentials`: Invalid credentials\n  * `deviceSupportIssue`: Device support issue\n  * `queuedForConfiguration`: Queued for configuration\n  * `configurationInProgress`: Configuration in progress\n  * `deviceDisabled`: Device is turned off\n  * `disconnectedFromBridge`: Disconnected from bridge\n\nAnalog Camera:\n  * `analogNoPower`: Power loss detected\n  * `analogBadSignal`: Signal quality issue\n  * `analogIncompatibleSignal`: Incompatible signal\n  * `analogNoSignal`: No signal\n  * `disconnectedFromBridge`: Disconnected from bridge\n  * `deviceDisabled`: Device is turned off\n\nManaged Switch:\n  * `deviceSupportIssue`: Switch support issue\n  * `disconnectedFromBridge`: Disconnected from bridge\n"
      x-een-device-type-error-status-mapping:
        onvifCamera:
        - generalDeviceError
        - networkError
        - invalidCredentials
        - deviceSupportIssue
        - queuedForConfiguration
        - configurationInProgress
        - deviceDisabled
        - disconnectedFromBridge
        rtspCamera:
        - generalDeviceError
        - networkError
        - invalidCredentials
        - deviceSupportIssue
        - queuedForConfiguration
        - configurationInProgress
        - deviceDisabled
        - disconnectedFromBridge
        analogCamera:
        - analogNoPower
        - analogBadSignal
        - analogIncompatibleSignal
        - analogNoSignal
        - disconnectedFromBridge
        - deviceDisabled
        multiCamera:
        - generalDeviceError
        - networkError
        - invalidCredentials
        - deviceSupportIssue
        - queuedForConfiguration
        - configurationInProgress
        - deviceDisabled
        - disconnectedFromBridge
        managedSwitch:
        - deviceSupportIssue
        - disconnectedFromBridge
      type: string
      enum:
      - disconnectedFromBridge
      - generalDeviceError
      - networkError
      - invalidCredentials
      - deviceSupportIssue
      - queuedForConfiguration
      - configurationInProgress
      - deviceDisabled
      - analogNoPower
      - analogBadSignal
      - analogIncompatibleSignal
      - analogNoSignal
      example: generalDeviceError
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    IpUsedByBridge:
      type:
      - string
      - 'null'
      pattern: ^(?:25[0-5]|2[0-4]\d|[0-1]?\d{1,2})(?:\.(?:25[0-5]|2[0-4]\d|[0-1]?\d{1,2})){3}$|(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|(?:[0-9a-fA-F]{1,4}:){1,7}:|(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}|(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}|(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}|(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:(?:(?::[0-9a-fA-F]{1,4}){1,6})|:(?:(?::[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(?::[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(?::0{1,4}){0,1}:){0,1}(?:(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3,3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(?:[0-9a-fA-F]{1,4}:){1,4}:(?:(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3,3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)
      example: 10.143.55.140
      description: The current IP address the bridge is using, in IPv4 or IPv6 format.
    ApiAdapterInfo:
      type: object
      properties:
        macAddress:
          $ref: '#/components/schemas/MacAddress'
        ipAddress:
          $ref: '#/components/schemas/IpAddress'
    deviceCloudConnectionStatusV2:
      description: "Socket connection state between device and cloud\n  * `connected`: The device socket connected to cloud.\n  * `disconnected`: The device socket disconnected from cloud.\n"
      type: string
      enum:
      - connected
      - disconnected
      example: connected
    DeviceCommonStatus:
      description: "Indicates the operational status of the device. The statuses defined here should be in sync with the DeviceStatus schema.\n  * `operational`: The device is online and operational.\n  * `error`: Device not working (requires error details).\n  * `disabled`: Operational but intentionally not recording telemetry\n  * `unreachable`: The device is not reachable (e.g., offline, out of service).\n  * `unknown`: The device state is unknown for some reason.\n  * `initializing`: The device is in the process of initializing.\n"
      type: string
      enum:
      - operational
      - error
      - disabled
      - unreachable
      - unknown
      - initializing
      example: operational
    ApiPaginatedMultiCameraResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ApiMultiCameraWithIncludes'
    ApiFirmware:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        currentVersion:
          type:
          - string
          - 'null'
          example: v20211019_542_3022
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    ApiDeviceInfo3:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        icon:
          description: Icon of multi camera.
          type: string
        make:
          description: The Manufactorer or brand of the multi camera.
          type: string
        model:
          description: The model of the multi camera.
          type: string
        guid:
          $ref: '#/components/schemas/Guid3'
    ApiAddMultiCamera:
      type: object
      properties:
        guid:
          $ref: '#/components/schemas/Guid3'
        name:
          $ref: '#/components/schemas/DeviceName'
        tags:
          $ref: '#/components/schemas/DeviceTags'
        locationId:
          $ref: '#/components/schemas/LocationId'
        bridgeId:
          $ref: '#/components/schemas/BridgeId3'
        credentials:
          $ref: '#/components/schemas/ApiDeviceCredentials'
      required:
      - name
      - bridgeId
      - guid
    ApiTimeZone:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        zone:
          type: string
          example: America/Chicago
          description: The timezone the device is in. The list of supported timezones is provided by the [/timeZones](https://developer.eagleeyenetworks.com/reference/listtimezones) endpoint.
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    ApiMultiCameraChannel:
      type: object
      properties:
        guid:
          $ref: '#/components/schemas/Guid3'
        cameraId:
          type: string
        channelName:
          type: string
          example: Channel 01
      required:
      - guid
      - channelName
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ApiNetworkInfoWithMainIp:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        globalIP:
          $ref: '#/components/schemas/IpAddress'
        ipUsedByBridge:
          $ref: '#/components/schemas/IpUsedByBridge'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/ApiAdapterInfo'
    ApiMultiCameraIncludes:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/DeviceStatus'
        statusV2:
          $ref: '#/components/schemas/DeviceStatusV2'
        locationSummary:
          $ref: '#/components/schemas/LocationSummary'
        deviceAddress:
          $ref: '#/components/schemas/DeviceAddress'
        timeZone:
          $ref: '#/components/schemas/ApiTimeZone'
        notes:
          $ref: '#/components/schemas/DeviceNotes'
        tags:
          $ref: '#/components/schemas/DeviceTags'
        devicePosition:
          $ref: '#/components/schemas/ApiDevicePosition'
        networkInfo:
          $ref: '#/components/schemas/ApiNetworkInfoWithMainIp'
        deviceInfo:
          $ref: '#/components/schemas/ApiDeviceInfo3'
        firmware:
          $ref: '#/components/schemas/ApiFirmware'
        visibleByBridges:
          type: array
          x-jsoninclude-nonnull-annotation: true
          items:
            type: string
            pattern: ^(?:0[xX])?[0-9a-fA-F]{8}$
            example: 1000f60d
        effectivePermissions:
          $ref: '#/components/schemas/EffectiveMulticameraPermissions'
    MacAddress:
      type:
      - string
      - 'null'
      pattern: ^([A-F0-9]{2}:){5}[A-F0-9]{2}$
      example: 8A:D4:AD:09:DF:91
    ApiMultiCameraMain:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          type: string
        bridgeId:
          $ref: '#/components/schemas/BridgeId3'
        locationId:
          $ref: '#/components/schemas/LocationId'
      required:
      - id
      - accountId
      - name
      - bridgeId
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    EffectiveMulticameraPermissions:
      readOnly: true
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        read:
          type: boolean
        delete:
          type: boolean
        edit:
          type: boolean
    ApiDeviceCredentials:
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        username:
          type: string
          description: Username to use when authenticating with the device
          maxLength: 126
        password:
          type: string
          description: Password to use when authenticating with the device
          maxLength: 126
    DeviceStatus:
      description: Indicates various aspects of the device's status. The statuses defined here should be in sync with the events schema defined for the Device Cloud Status Update.
      type: object
      x-jsoninclude-nonnull-annotation: true
      properties:
        connectionStatus:
          $ref: '#/components/schemas/DeviceConnectionStatus'
    IpAddress:
