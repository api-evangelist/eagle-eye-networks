openapi: 3.2.0
info:
  title: AUTOMATIONS Actions API
  version: 3.0.0
  description: Describe what automation actions have been defined.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Actions
  description: Describe what automation actions have been defined.
paths:
  /alertActions:
    post:
      operationId: addAlertAction
      description: Registers a new alert action with the account. These alert actions can be used as responses to alerts generated by alert action rules.
      tags:
      - Actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAction'
            examples:
              notification:
                summary: Notification
                description: Sending alert notifications to a list of users using email, push, and webapp notifications.
                value:
                  type: notification
                  settings:
                    users:
                    - id: ca0de584
                      push: true
                      email: true
                      webapp: true
                    rearmSeconds: 900
                    maxPerHour: 10
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              sms:
                summary: SMS
                description: Send alert notifications to a list of users using SMS.
                value:
                  type: sms
                  settings:
                    users:
                    - id: ca0de584
                  enabled: true
                  name: Notify all users via SMS.
                  notes: Notify users via SMS. Useful in cases where a Gun is detected.
              smtp:
                summary: SMTP
                description: Send an alert via SMTP, which is primarily used for monitoring services.
                value:
                  type: smtp
                  settings:
                    email: user@example.com
                    url: string
                    port: 65535
                    username: string
                    password: string
                    tls: true
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              ebus:
                summary: EBUS
                description: Send an alert to EBUS.
                value:
                  type: ebus
                  settings:
                    email: user@example.com
                    url: string
                    port: 65535
                    username: string
                    password: string
                  enabled: true
                  name: Notify EBUS monitoring.
                  notes: Notify EBUS monitoring.
              zulipPrivate:
                summary: Zulip private message to user
                description: Send a zulip private message to a specific user.
                value:
                  type: zulipPrivate
                  settings:
                    apiKey: string
                    email: string
                    organizationUrl: string
                    user: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              zulipStream:
                summary: Zulip stream
                description: Send a zulip message to a specific stream and topic.
                value:
                  type: zulipStream
                  settings:
                    apiKey: string
                    email: string
                    organizationUrl: string
                    stream: string
                    topic: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              slack:
                summary: Slack
                description: Send a slack message to a specific channel.
                value:
                  type: slack
                  settings:
                    apiToken: string
                    channel: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              webhook:
                summary: Webhook
                description: Send an alert via webhook.
                value:
                  type: webhook
                  settings:
                    url: string
                    auth_token: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              sentinel:
                summary: Sentinel
                description: Send an alert via sentinel.
                value:
                  type: sentinel
                  settings:
                    url: string
                    auth_token: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              zapier:
                summary: Zapier
                description: Send an alert via zapier.
                value:
                  type: zapier
                  settings:
                    url: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              brivo:
                summary: Brivo
                description: Triggering Brivo access points.
                value:
                  type: brivo
                  settings:
                    service: accessPoint
                    oauthId: string
                    accessPointName: string
                    accessPointId: int
                    brivoOverrideSettings:
                      endTimeMode: string
                      behavior: string
                      endTime: date-time
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              zendesk:
                summary: Zendesk
                description: Send an alert to Zendesk and create a ticket.
                value:
                  type: zendesk
                  settings:
                    apiToken: string
                    email: string
                    subdomain: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              immix:
                summary: Immix
                description: Send an alert to Immix via SMTP, which is primarily used for monitoring services.
                value:
                  type: immix
                  settings:
                    email: user@example.com
                    url: immix.example.com
                    port: 65535
                    username: string
                    password: string
                    tls: true
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              evalinkTalos:
                summary: Evalink Talos
                description: Send an alert via EvalinkTalos.
                value:
                  type: evalinkTalos
                  settings:
                    url: string
                    auth_token: string
                  enabled: true
                  name: Notify all technical support staff.
                  notes: Notify everyone with the technical support role. Useful in cases where a device goes offline.
              outputPort:
                summary: Output Port
                description: Trigger a device output.
                value:
                  type: outputPort
                  settings:
                    deviceId: string
                    portId: string
                    duration: 30
                  enabled: true
                  name: Trigger a device output.
                  notes: Triiger an output on a device when an alert is received.
              playSpeakerAudioClip:
                summary: Play Speaker Audio Clip
                description: Trigger the speaker to play an audio clip.
                value:
                  type: playSpeakerAudioClip
                  settings:
                    speakerAudioClipId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
                    playOnTriggeringDevice: conditionRuleDevices
                    devices__in:
                    - camera:1001abcd
                    - speaker:1002abcd
                  enabled: true
                  name: Play speaker audio clip.
                  notes: Trigger the speaker to play the audio clip.
      responses:
        '201':
          description: Alert action registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAction'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add alert action
      x-summary-source: derived
    get:
      tags:
      - Actions
      operationId: listAlertActions
      description: List the configured alert actions.
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Alert action results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActions'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List alert actions
      x-summary-source: derived
  /alertActions/{actionId}:
    parameters:
    - in: path
      name: actionId
      schema:
        type: string
      required: true
    get:
      operationId: getAlertAction
      description: Retrieve a single alert action.
      tags:
      - Actions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAction'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get alert action
      x-summary-source: derived
    patch:
      operationId: updateAlertAction
      description: Update single alert action. This is a partial update operation - all fields in the request body are optional, allowing you to update only the specific fields you want to change. Fields marked as required in the schema apply only to POST (create) operations.
      tags:
      - Actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertActionUpdate'
      responses:
        '204':
          description: Alert Action Updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update alert action
      x-summary-source: derived
    delete:
      operationId: deleteAlertAction
      description: Removes alert action.
      tags:
      - Actions
      responses:
        '204':
          description: Alert action deleted.
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete alert action
      x-summary-source: derived
components:
  schemas:
    ZapierAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - zapier
          settings:
            $ref: '#/components/schemas/ZapierActionSettings'
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    WebhookActionSettings:
      description: 'Settings for sending an alert via a webhook.  Currently only POST is supported.

        '
      type: object
      required:
      - url
      properties:
        url:
          type: string
        auth_token:
          description: 'Optional bearer token to be included in the Authorization header when sending the alert to the webhook.

            '
          type: string
    AlertActionUpdate:
      allOf:
      - $ref: '#/components/schemas/AlertActionChangeable'
      - type: object
        properties:
          settings:
            oneOf:
            - $ref: '#/components/schemas/NotificationActionSettings'
            - $ref: '#/components/schemas/SmsActionSettings'
            - $ref: '#/components/schemas/SmtpActionSettings'
            - $ref: '#/components/schemas/ZulipPrivateActionSettings'
            - $ref: '#/components/schemas/ZulipStreamActionSettings'
            - $ref: '#/components/schemas/SlackActionSettings'
            - $ref: '#/components/schemas/WebhookActionSettings'
            - $ref: '#/components/schemas/BrivoActionSettings'
            - $ref: '#/components/schemas/ZendeskActionSettings'
            - $ref: '#/components/schemas/ImmixActionSettings'
            - $ref: '#/components/schemas/ZapierActionSettings'
            - $ref: '#/components/schemas/SentinelActionSettings'
            - $ref: '#/components/schemas/EvalinkTalosActionSettings'
            - $ref: '#/components/schemas/OutputPortActionSettings'
            - $ref: '#/components/schemas/EbusActionSettings'
            - $ref: '#/components/schemas/PlaySpeakerAudioClipAction'
    ZulipPrivateActionSettings:
      allOf:
      - $ref: '#/components/schemas/ZulipActionSettings'
      - description: 'Settings for sending a private alert message to a user Zulip. Zulip bots need to be supported by your organization. Bots can be created under `Personal Settings > Bots`.

          '
        type: object
        required:
        - user
        properties:
          user:
            description: 'The user''s Zulip email or user number.

              '
            type: string
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    ZulipActionSettings:
      type: object
      required:
      - apiKey
      - email
      - organizationUrl
      properties:
        apiKey:
          description: 'The apiKey for your Zulip bot

            '
          type: string
        email:
          description: 'The email address for your Zulip bot

            '
          type: string
        organizationUrl:
          description: 'The url for your Zulip instance

            '
          type: string
    PlaySpeakerAudioClipActionSettings:
      description: "Settings that determine where an audio clip is played when an alert is triggered.\n\nThe clip will be played on the union of:\n- A fixed list of explicitly defined devices (`devices__in`), and\n - Optionally, additional triggering devices as defined by `playOnTriggeringDevice`:\n  - **none**: Do not include any triggering device.\n  - **alertActorDevices**: Include the device for which the event was created and from which the alert was generated.\n  - **conditionRuleDevices**: Include the devices that the rule, which created the alert, is filtering on.\n"
      type: object
      required:
      - speakerAudioClipId
      properties:
        speakerAudioClipId:
          description: 'The ID of speaker audio clip to play.

            '
          type: string
        playOnTriggeringDevice:
          description: "Specifies which devices should play the audio clip when the rule is triggered.\n - `none`: Do not attempt to play audio clips on any devices.\n - `alertActorDevices`: The device for which the event was created and from which the alert was triggered.\n - `conditionRuleDevices`: The devices that the rule, which created the alert, is filtering on.\n"
          type: string
          enum:
          - none
          - alertActorDevices
          - conditionRuleDevices
          default: none
        devices__in:
          description: "A list of devices that will always play the audio clip,  \nregardless of the device that triggered the alert.  \nFormat: `\"<device_type>:<device_esn>\"` (e.g., `\"camera:10001abcd\"`, `\"speaker:1001abce\"`)\n"
          type: array
          items:
            type: string
          default: []
    SentinelActionSettings:
      description: 'Settings for sending an alert via a sentinel.  Currently only POST is supported.

        '
      type: object
      required:
      - url
      properties:
        url:
          type: string
        auth_token:
          description: 'Optional bearer token to be included in the Authorization header when sending the the alert to Sentinel.

            '
          type: string
    BrivoActionSettings:
      description: 'Settings for using a Brivo access point by an alert action. Supports Acctivation, Setting an Override and removing an override

        '
      type: object
      required:
      - service
      - oauthId
      - accessPointName
      properties:
        service:
          description: 'Which service to use, has to be one of accessPoint, doorOverride, or doorOverrideCancel. There is accessPoint used to activate a brivo accesspoint. doorOverride is used to keep an access point activated either to a specified time or indefinite time. doorOverrideCancel removes the door override.

            '
          type: string
          enum:
          - accessPoint
          - doorOverride
          - doorOverrideCancel
        oauthId:
          description: 'The oauth id is the value that should be used to retrieve the oauth information from the oauth mode. These values are like access_token.

            '
        accessPointName:
          description: 'The access point name.

            '
        accessPointId:
          description: 'The access point id. It is a unique Id generated by Brivo. When serializer is used the access_point_name will be used to get this value.

            '
        brivoOverrideSettings:
          $ref: '#/components/schemas/BrivoOverRideSettings'
    OutputPortAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - outputPort
          settings:
            $ref: '#/components/schemas/OutputPortActionSettings'
    SlackAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - slack
          settings:
            $ref: '#/components/schemas/SlackActionSettings'
    SentinelAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - sentinel
          settings:
            $ref: '#/components/schemas/SentinelActionSettings'
    SmtpActionSettings:
      description: 'Settings for sending an alert via SMTP.  This alert action is primarily used for monitoring services.

        '
      type: object
      required:
      - email
      - url
      - port
      properties:
        email:
          description: 'Required

            '
          type: string
          format: email
        url:
          description: 'The ip address or domain name of the mail server are both acceptable.

            '
          type: string
        port:
          type: number
          minimum: 1
          maximum: 65535
        username:
          description: 'Check with your monitoring service if this is required.

            '
          type: string
        password:
          description: 'Check with your monitoring service if this is required.

            '
          type: string
        tls:
          description: 'If tls is not present in the settings, the default is false

            '
          type: boolean
    AlertActionChangeable:
      type: object
      properties:
        enabled:
          type: boolean
          description: Denotes if the alert rule action is enabled or not being applied.
          example: true
          default: true
        name:
          type: string
          maxLength: 126
          example: Notify all technical support staff.
        notes:
          type: string
          maxLength: 500
          example: Notify everyone with the technical support role. Useful in cases where a device goes offline.
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    ZendeskAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - zendesk
          settings:
            $ref: '#/components/schemas/ZendeskActionSettings'
    NotificationActionSettings:
      description: 'Settings for sending notifications to a list of users.  Each item in the list is the id of the user and if the user wants email, push, and/or webapp notifications sent.

        '
      type: object
      required:
      - users
      properties:
        users:
          type: array
          description: 'List of users to notify. Use `[''*'']` as the single item to target all users in the account.

            '
          minLength: 1
          items:
            type: object
            required:
            - id
            - push
            - email
            properties:
              id:
                description: Unique id of the user to notify. Use `'*'` to target all users in the account.
                type: string
                example: ca0de584
              push:
                description: If true, try to notify the user using mobile push notifications.
                type: boolean
                example: true
              email:
                description: If true, try to notify the user using email notifications.
                type: boolean
                example: true
              webapp:
                description: 'If true, try to notify the user using an in-webapp popup notification. Webapp is a first-class channel — a user may opt into webapp only (with `email` and `push` both `false`). Omitting this field is equivalent to `false`.

                  '
                type: boolean
                default: false
                example: false
        rearmSeconds:
          description: 'If rearmSeconds are set, any alert that occurs for the alertActionRule within the rearmSeconds period will not be sent via email, push, and/or webapp. Instead, it will appear in /api/v3.0/notifications with the `status` = `throttled`

            '
          type: number
          example: 900
          minimum: 1
          maximum: 65535
        maxPerHour:
          description: 'If maxPerHour is set, for any alert that occurs for the alertActionRule over the maxPerHour in the last 60 minutes will not be sent via email, push, and/or webapp.  Instead,  it will appear in /api/v3.0/notifications with the `status` = `throttled`

            '
          type: number
          example: 10
          minimum: 1
          maximum: 65535
    EbusAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - ebus
          settings:
            $ref: '#/components/schemas/EbusActionSettings'
    WebhookAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - webhook
          settings:
            $ref: '#/components/schemas/WebhookActionSettings'
    SmsAction:
      allOf:
      - $ref: '#/components/schemas/AlertActionBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - sms
          settings:
            $ref: '#/components/schemas/SmsActionSettings'
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ImmixActionSettings:
      description: 'Settings for sending an Immix alert.

        '
      required:
      - email
      - url
      - port
      properties:
        email:
          description: 'The email address where alert will be delivered.

            '
          type: string
          format: email
        url:
          description: 'Accepts either the IP address or domain name of the mail server.

            '
          type: string
        port:
          description: 'The port number used to connect to the mail server.

            '
          type: number
          minimum: 1
          maximum: 65535
        username:
          description: 'Check with your monitoring service if this is required.

            '
          type: string
        password:
          description: 'Check with your monitoring service if this is required.

            '
          type: string
        tls:
          description: 'If TLS is not present in the settings, the default is false

            '
          type: boolean
    AlertActionBase:
      allOf:
      - type: object
        required:
        - type
        - settings
        - name
        - enabled
        properties:
          id:
            description: Unique identifier of the alert action.
            type: string
            readOnly: true
            example: f3436b61-94fd-41b6-8f0a-ee6ff55acaa6
          createTimestamp:
            description: Time at which the alert action was created.
            type: string
            format: date-time
            readOnly: true
            example: '2021-04-22T00:00:00.000+00:00'
          type:
            description: Alert action type.
            type: string
            example: notification
            enum:
            - notification
            - sms
            - smtp
            - zulipPrivate
