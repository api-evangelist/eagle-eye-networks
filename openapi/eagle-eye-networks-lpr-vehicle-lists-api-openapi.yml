openapi: 3.2.0
info:
  title: VEHICLE SURVEILLANCE PACKAGE LPR Vehicle Lists API
  version: 3.0.0
  description: Lists of vehicles that can be used in LPR rules.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: LPR Vehicle Lists
  description: Lists of vehicles that can be used in LPR rules.
paths:
  /lprVehicleLists:
    get:
      operationId: listVehicleLists
      tags:
      - LPR Vehicle Lists
      description: Fetches the available vehicleLists based on the filter
      parameters:
      - $ref: '#/components/parameters/actor__in'
      - $ref: '#/components/parameters/plate1'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Fetches all the vehicle list that matches the filtering based on the query parameters. Only list properties are returned per list. The individual vehicle records within a list are not returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListResult'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List vehicle lists
      x-summary-source: derived
    post:
      operationId: addVehicleList
      tags:
      - LPR Vehicle Lists
      description: Add a new vehicleList to the user account
      requestBody:
        description: Meta configuration for the list
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LprVehicleListMetaUntaggedForPost'
      responses:
        '201':
          description: Successful creation of the new list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListMeta'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add vehicle list
      x-summary-source: derived
  /lprVehicleLists/{id}:
    get:
      operationId: getVehicleList
      tags:
      - LPR Vehicle Lists
      description: Fetches the information about the specific vehicleList but not each vehicle record
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Returns information about the list. Only list properties are returned and not the individual vehicle records inside it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListMeta'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get vehicle list
      x-summary-source: derived
    patch:
      operationId: updateVehicleList
      tags:
      - LPR Vehicle Lists
      description: Update the meta configuration properties about the specific vehicle List
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Configuration properties to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LprVehicleListMetaUntaggedForPatch'
      responses:
        '204':
          description: Updated the list
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update vehicle list
      x-summary-source: derived
    delete:
      operationId: deleteVehicleList
      tags:
      - LPR Vehicle Lists
      description: Delete the vehicle list along with the entries
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted the list
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete vehicle list
      x-summary-source: derived
  /lprVehicleLists/{id}/vehicles:
    get:
      operationId: listVehicles
      tags:
      - LPR Vehicle Lists
      description: Fetches information about all the vehicle records in the given list, including the user data.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/plate1'
      - $ref: '#/components/parameters/plate__contains1'
      - $ref: '#/components/parameters/accessType__in1'
      - $ref: '#/components/parameters/securityStatus__in'
      - $ref: '#/components/parameters/userDataRecord'
      - $ref: '#/components/parameters/userTags__in1'
      - $ref: '#/components/parameters/userTags__contains1'
      responses:
        '200':
          description: Successfully returns information about the vehicle records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListEntriesResult'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List vehicles
      x-summary-source: derived
    post:
      operationId: addVehicle
      tags:
      - LPR Vehicle Lists
      description: Adds a new vehicle record to the list. This method enforces strictness about the uniqueness of vehicle license plate, so the same plate/vehicle cannot be added more than once, and would result in error if attempted.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: New record to be added.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LprVehicleListUntaggedRecord'
      responses:
        '201':
          description: Successful creation of new vehicle record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListPaddedRecord'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add vehicle
      x-summary-source: derived
  /lprVehicleLists/{id}/vehicles/{recordId}:
    get:
      operationId: getVehicle
      tags:
      - LPR Vehicle Lists
      description: Fetches information about a specific vehicle from a specific list
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Successfully returns information about the vehicle records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListPaddedRecord'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get vehicle
      x-summary-source: derived
    patch:
      operationId: updateVehicle
      tags:
      - LPR Vehicle Lists
      description: Update given vehicle record in the given list. Specifically for the given record, create-only properties like `plate` cannot be edited. To edit those, the record would have to be deleted and a new one added.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/recordId'
      requestBody:
        description: Record to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LprVehicleListUntaggedRecordUpdate'
      responses:
        '204':
          description: Updated the vehicle record
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update vehicle
      x-summary-source: derived
    delete:
      operationId: deleteVehicle
      tags:
      - LPR Vehicle Lists
      description: Delete given vehicle record in given list.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/recordId'
      responses:
        '204':
          description: Deleted the record
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete vehicle
      x-summary-source: derived
  /lprVehicleLists/{id}/vehicles:bulkCreate:
    post:
      operationId: addVehicles
      tags:
      - LPR Vehicle Lists
      description: Adds multiple vehicle records to the list in a single operation. This method enforces strictness about the uniqueness of vehicle license plates. Each plate/vehicle must be unique within the list, and duplicate entries in either the request or with existing records will result in an error.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: New record to be added.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LprVehicleListUntaggedRecordArray'
      responses:
        '200':
          description: Successful creation of new vehicle record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateResponseArray'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Add vehicles
      x-summary-source: derived
  /lprVehicleLists:listFieldValues:
    get:
      operationId: getVehicleListFieldValues
      tags:
      - LPR Vehicle Lists
      description: Fetches the list of field values including possible values for each key in userData.
      responses:
        '200':
          description: Possible values of each field
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessType:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessType1'
                  userData:
                    type: object
                    description: List of possible values for keys in user supplied data.
                  userTags:
                    type: array
                    description: List of possible values for userTags.
                    items:
                      type: string
                  actor:
                    type: array
                    description: List of actors referenced by all lists collectively
                    items:
                      $ref: '#/components/schemas/Actor'
                  securityStatus:
                    type: array
                    description: List of the distinct security statuses present across all the vehicle lists for this account.
                    items:
                      $ref: '#/components/schemas/SecurityStatus'
                example:
                  accessType:
                  - allow
                  - deny
                  userData:
                    organization:
                    - ABC
                    - PQR
                    parkingType:
                    - monthly
                    - visitor
                  userTags:
                  - John
                  - 105A
                  securityStatus:
                  - hotlist
                  - exempted
                  actor:
                  - type: camera
                    id: camera-123456
                    name: entrance LPR
                  - type: camera
                    id: camera-876543
                    name: exit LPR
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get vehicle list field values
      x-summary-source: derived
  /lprVehicleLists:listFields:
    get:
      operationId: getVehicleListFields
      tags:
      - LPR Vehicle Lists
      description: 'Fetches all available fields in vehicle Lists for this account. Specifically, using this API, the user may:

        * Obtain the list of fields for ordered display of vehicle records, wherein each field is a column.

        * Obtain the possible values for some or all of the fields for search queries.

        * Understand user defined fields in the records of vehicle Lists, which is a dynamic set.'
      responses:
        '200':
          description: List of all fields
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: User friendly Displayable name of the field
                    key:
                      type: string
                      description: The actual field
                    valueRange:
                      type: string
                      description: Indicates whether the possible values for this field is static or unbounded
                      enum:
                      - fixed
                      - unlimited
                  required:
                  - key
                example:
                - key: actor
                  valueRange: fixed
                - key: userData.apartmentNum
                  name: Apartment Number
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get vehicle list fields
      x-summary-source: derived
  /lprVehicleLists:search:
    get:
      operationId: searchVehicleLists
      tags:
      - LPR Vehicle Lists
      description: Fetches the vehicle records that match search criteria, across all the lists that match the search criteria
      parameters:
      - $ref: '#/components/parameters/plate1'
      - $ref: '#/components/parameters/actor__in'
      - $ref: '#/components/parameters/name__contains'
      - $ref: '#/components/parameters/accessType__in1'
      - $ref: '#/components/parameters/securityStatus__in'
      - $ref: '#/components/parameters/userDataRecord'
      - $ref: '#/components/parameters/userTags__in1'
      - $ref: '#/components/parameters/userTags__contains1'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Vehicle records that match the search criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LprVehicleListsSearchResult'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Search vehicle lists
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    LprVehicleListPaddedRecord:
      description: Union of user attributes of a given vehicle and system generated attributes (unique id), along with its association to the appropriate Vehicle List
      allOf:
      - $ref: '#/components/schemas/LprVehicleListTaggedRecord'
      - type: object
        properties:
          listId:
            type: string
            description: Id of the list this record belongs to
            format: uuid
        required:
        - listId
    LprVehicleListsSearchResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/LprVehicleListPaddedRecord'
    LprVehicleListEntriesResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/LprVehicleListPaddedRecord'
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    VehicleColorDefinitions:
      allOf:
      - $ref: '#/components/schemas/ColorDefinitions1'
      - description: Enumerations of standard colors for vehicles.
    VehicleMakeDefinitions:
      type: string
      description: Enumerations of standard makes/brands for vehicles.
      enum:
      - abarth
      - acura
      - alfa_romeo
      - aston_martin
      - audi
      - bentley
      - bmw
      - bugatti
      - buick
      - byd
      - cadillac
      - chevrolet
      - chrysler
      - citroen
      - dacia
      - daihatsu
      - dodge
      - dodge_ram
      - ferrari
      - fiat
      - fisker
      - ford
      - ford_mustang
      - garia
      - genesis
      - gmc
      - harley_davidson
      - honda
      - hummer
      - hyundai
      - infiniti
      - isuzu
      - jaguar
      - jeep
      - kia
      - lamborghini
      - land_rover
      - lexus
      - lincoln
      - lotus
      - lucid
      - mahindra
      - maruti_suzuki
      - maserati
      - mazda
      - mclaren
      - mercedes_benz
      - mini_cooper
      - mitsubishi
      - mg
      - nissan
      - oldsmobile
      - opel
      - perodua
      - peugeot
      - plymouth
      - polaris
      - polestar
      - pontiac
      - porsche
      - proton
      - ram
      - renault
      - rivian
      - rolls_royce
      - rover
      - saab
      - saturn
      - scion
      - skoda
      - smart
      - subaru
      - suzuki
      - tata
      - tesla
      - toyota
      - vinfast
      - volkswagen
      - volvo
      - wagoneer
      - others
      example: volvo
    SecurityStatus:
      type: string
      deprecated: true
      enum:
      - hotlist
      - exempted
      description: "Indicates whether vehicle is\n  * hotlist: Vehicle flagged for tracking\n  * exempted: Vehicle is exempt from watchlist rule and other rules. This is useful, for instance, when an organization wishes to avoid alerts on known vehicles, like employee vehicles.\n\n  * none: Empty value provided when no special consideration for the vehicle"
      example: exempted
    LprVehicleListMetaUntaggedForPost:
      type: object
      description: User supplied attributes of the list, that does not return the individual vehicle records, to be used during creation of list
      required:
      - name
      allOf:
      - $ref: '#/components/schemas/LprVehicleListMetaUntagged'
    LprVehicleListMeta:
      type: object
      description: User supplied and System generated attributes of the list. However it excludes the vehicle records
      allOf:
      - $ref: '#/components/schemas/LprVehicleListMetaUntagged'
      - type: object
        properties:
          id:
            type: string
            description: Unique system generated id for list
            example: ABC123-20221014123567
          createTimestamp:
            type: string
            description: Timestamp when this list created
            format: date-time
            example: '2017-02-27T10:44:13.423Z'
            readOnly: true
          updateTimestamp:
            type: string
            description: Timestamp when this list last updated
            format: date-time
            example: '2017-02-27T10:44:13.423Z'
            readOnly: true
          createdByUserId:
            type: string
            description: User id of the creator of the vehicle list
            example: ca0de584
            readOnly: true
          vehicleCount:
            type: integer
            description: Number of vehicles in the list
            example: 10
            readOnly: true
        required:
        - id
        - createTimestamp
        - updateTimestamp
        - createdByUserId
        - vehicleCount
        - name
    UserDataLpr:
      deprecated: true
      type: object
      description: "Object containing all user information associated with the specific event. For example, for a plate read, this would contain user supplied attributes for the given plate like apartment number. the following are the guidelines for supplying User Data:\n  * It is recommended to use camelCase for field names, but this is not required\n  * Maximum of 5 unique keys.\n  * Each key or value should have only 256 characters max.\n  * The keys 'type' and 'creatorId' are reserved keys."
      example:
        owner: John Doe
        apartmentNum: 105A
    AccessType1:
      type: string
      enum:
      - allow
      - deny
    Interval:
      type: object
      description: "Interval of a schedule. If the start time is greater than the end time, the interval is considered to cover the remaining time of the day from the start time until 24:00, and then from 00:00 to the end time. \nFor example, start: 16:30 and end: 06:00 on monday means the interval covers from 16:30 to 24:00 and continues from 00:00 to 06:00 on the same day (monday).\n"
      properties:
        start:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: Starting point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for a day
        end:
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
          description: End point of the interval. It should be in the range of 00:00 to 23:59 since this is the range for the day
      required:
      - start
      - end
    LprVehicleListMetaUntagged:
      type: object
      description: User supplied attributes of the list, that does not return the individual vehicle records, to be used during creation of list or patching of list
      properties:
        name:
          type: string
          description: User supplied name for the list
          example: EmployeesList
        enabled:
          type: boolean
          default: false
          description: Whether list is enabled
        notes:
          type: string
          description: A verbose explanation of the vehicle list
          example: This is vehicle list of denied vehicles
        resourceFilter:
          $ref: '#/components/schemas/ResourceFilter'
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    LprVehicleListResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          results:
            type: array
            description: IDs of all the vehicle Lists that satisfy the query.
            items:
