openapi: 3.2.0
info:
  title: GROUPING Locations API
  version: 3.0.0
  description: All core operations on the location resource.
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Locations
  description: All core operations on the location resource.
paths:
  /locations:
    get:
      operationId: getLocations
      description: 'This endpoint is used to retrieve a list of locations. Support for Location-based camera grouping is only available in the professional and enterprise editions.

        It is important to note that after using the pageSize parameter, the "totalSize" in the response represents the total number of available locations, not the number of locations resulting from the query string.'
      tags:
      - Locations
      parameters:
      - $ref: '#/components/parameters/includeForList1'
      - $ref: '#/components/parameters/sort2'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/id__in1'
      - $ref: '#/components/parameters/parentId'
      - $ref: '#/components/parameters/parentId__ne'
      - $ref: '#/components/parameters/parentId__in'
      - $ref: '#/components/parameters/name1'
      - $ref: '#/components/parameters/name__ne'
      - $ref: '#/components/parameters/name__in1'
      - $ref: '#/components/parameters/name__contains2'
      - $ref: '#/components/parameters/address.streetAddress'
      - $ref: '#/components/parameters/address.streetAddress__ne'
      - $ref: '#/components/parameters/address.streetAddress__in'
      - $ref: '#/components/parameters/address.streetAddress__contains'
      - $ref: '#/components/parameters/address.streetAddress2'
      - $ref: '#/components/parameters/address.streetAddress2__ne'
      - $ref: '#/components/parameters/address.streetAddress2__in'
      - $ref: '#/components/parameters/address.streetAddress2__contains'
      - $ref: '#/components/parameters/address.city'
      - $ref: '#/components/parameters/address.city__ne'
      - $ref: '#/components/parameters/address.city__in'
      - $ref: '#/components/parameters/address.city__contains'
      - $ref: '#/components/parameters/address.region'
      - $ref: '#/components/parameters/address.region__ne'
      - $ref: '#/components/parameters/address.region__in'
      - $ref: '#/components/parameters/address.region__contains'
      - $ref: '#/components/parameters/address.country'
      - $ref: '#/components/parameters/address.country__ne'
      - $ref: '#/components/parameters/address.country__in'
      - $ref: '#/components/parameters/address.country__contains'
      - $ref: '#/components/parameters/address.postalCode'
      - $ref: '#/components/parameters/address.postalCode__ne'
      - $ref: '#/components/parameters/address.postalCode__in'
      - $ref: '#/components/parameters/address.postalCode__contains'
      - $ref: '#/components/parameters/childLocationCount'
      - $ref: '#/components/parameters/childLocationCount__ne'
      - $ref: '#/components/parameters/q1'
      - $ref: '#/components/parameters/qRelevance__gte1'
      responses:
        '200':
          description: Successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get locations
      x-summary-source: derived
    post:
      operationId: createLocation
      description: This endpoint allows you to create a new location. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicLocationResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Create location
      x-summary-source: derived
  /locations/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      operationId: getLocation
      description: This endpoint allows retrieval of the location with a specific ID. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Locations
      parameters:
      - $ref: '#/components/parameters/includeForSingle1'
      responses:
        '200':
          description: Successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationGet'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get location
      x-summary-source: derived
    patch:
      operationId: updateLocation
      description: This endpoint allows you to update the location with the given ID. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '204':
          description: Location updated
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Update location
      x-summary-source: derived
    delete:
      operationId: deleteLocation
      description: This endpoint allows you to delete the location with the given ID. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Locations
      responses:
        '204':
          description: Location deleted
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Delete location
      x-summary-source: derived
  /locations/{id}/locations:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      operationId: getLocationDescendants
      description: This endpoint allows you to retrieve the (grand) children of the location with the given ID. Support for Location-based camera grouping is only available in the professional and enterprise editions.
      tags:
      - Locations
      parameters:
      - $ref: '#/components/parameters/includeForSingle1'
      - $ref: '#/components/parameters/sortDescendants'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/id__in1'
      - $ref: '#/components/parameters/parentId'
      - $ref: '#/components/parameters/parentId__ne'
      - $ref: '#/components/parameters/parentId__in'
      - $ref: '#/components/parameters/name1'
      - $ref: '#/components/parameters/name__ne'
      - $ref: '#/components/parameters/name__in1'
      - $ref: '#/components/parameters/name__contains2'
      - $ref: '#/components/parameters/address.streetAddress'
      - $ref: '#/components/parameters/address.streetAddress__ne'
      - $ref: '#/components/parameters/address.streetAddress__in'
      - $ref: '#/components/parameters/address.streetAddress__contains'
      - $ref: '#/components/parameters/address.streetAddress2'
      - $ref: '#/components/parameters/address.streetAddress2__ne'
      - $ref: '#/components/parameters/address.streetAddress2__in'
      - $ref: '#/components/parameters/address.streetAddress2__contains'
      - $ref: '#/components/parameters/address.city'
      - $ref: '#/components/parameters/address.city__ne'
      - $ref: '#/components/parameters/address.city__in'
      - $ref: '#/components/parameters/address.city__contains'
      - $ref: '#/components/parameters/address.region'
      - $ref: '#/components/parameters/address.region__ne'
      - $ref: '#/components/parameters/address.region__in'
      - $ref: '#/components/parameters/address.region__contains'
      - $ref: '#/components/parameters/address.country'
      - $ref: '#/components/parameters/address.country__ne'
      - $ref: '#/components/parameters/address.country__in'
      - $ref: '#/components/parameters/address.country__contains'
      - $ref: '#/components/parameters/address.postalCode'
      - $ref: '#/components/parameters/address.postalCode__ne'
      - $ref: '#/components/parameters/address.postalCode__in'
      - $ref: '#/components/parameters/address.postalCode__contains'
      - $ref: '#/components/parameters/childLocationCount'
      - $ref: '#/components/parameters/childLocationCount__ne'
      responses:
        '200':
          description: Successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationDescendantsResponse'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get location descendants
      x-summary-source: derived
components:
  parameters:
    address.country__in:
      in: query
      name: address.country__in
      description: Filter to get the locations whose address.country is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    name__contains2:
      in: query
      name: name__contains
      description: 'Filter to get the locations whose the name contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    address.streetAddress__ne:
      in: query
      name: address.streetAddress__ne
      description: Filter to get the locations with an address.streetAddress that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    parentId__in:
      in: query
      name: parentId__in
      description: Filter to get the locations whose parentId is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          $ref: '#/components/schemas/id'
      style: form
      explode: false
    address.country__contains:
      in: query
      name: address.country__contains
      description: 'Filter to get the locations whose the address.country contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    address.streetAddress__contains:
      in: query
      name: address.streetAddress__contains
      description: 'Filter to get the locations whose the address.streetAddress contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    address.streetAddress2__ne:
      in: query
      name: address.streetAddress2__ne
      description: Filter to get the locations with an address.streetAddress2 that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    address.city:
      in: query
      name: address.city
      description: Filter to get the locations with the specified address.city. The lookup is exact and case insensitive
      schema:
        type: string
    childLocationCount__ne:
      in: query
      name: childLocationCount__ne
      description: Filter to get the locations with the number of direct children not equal to the provided value.
      schema:
        type: integer
    sort2:
      in: query
      name: sort
      description: "Comma separated list of of fields that should be sorted.\n * `sort=` - not providing any value will result in error 400\n * `sort=+name,+name` - same values will result in error 400\n * `sort=-name,+name` - mutially exclusive values will return error 400\n * maxItem=8 - Only eight values will be accepted, more will return error 400\n * qRelevance is optional ordering parameter which is available if q filter is used, if q filter is not passed qRelevance as ordering parameter will return error 400\n"
      schema:
        type: array
        default:
        - +name
        items:
          type: string
          maxItems: 8
          enum:
          - -name
          - -address.streetAddress
          - -address.streetAddress2
          - -address.city
          - -address.region
          - -address.country
          - -address.postalCode
          - -qRelevance
          - +name
          - +address.streetAddress
          - +address.streetAddress2
          - +address.city
          - +address.region
          - +address.country
          - +address.postalCode
          - +qRelevance
      example:
      - +name
      - -qRelevance
      style: form
      explode: false
    name__ne:
      in: query
      name: name__ne
      description: Filter to get the locations with the name that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    qRelevance__gte1:
      in: query
      name: qRelevance__gte
      description: 'Sets the current minimum similarity threshold that is used with the `q` parameter. The threshold must be between 0 and 1 (float, default is 0.5).

        '
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 1
        example: 0.5
    address.postalCode:
      in: query
      name: address.postalCode
      description: Filter to get the locations with the specified address.postalCode. The lookup is exact and case insensitive
      schema:
        type: string
    parentId:
      in: query
      name: parentId
      description: Filter to get the locations with the specified parentId. parentId=null returns only the locations which do not have a parent location
      schema:
        allOf:
        - $ref: '#/components/schemas/id'
    id:
      in: path
      required: true
      name: id
      description: Location ID
      schema:
        type: string
    address.country__ne:
      in: query
      name: address.country__ne
      description: Filter to get the locations with an address.country that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    sortDescendants:
      in: query
      name: sort
      description: "Comma separated list of of fields that should be sorted.\n * `sort=` - not providing any value will result in error 400\n * `sort=+name,+name` - same values will result in error 400\n * `sort=-name,+name` - mutially exclusive values will return error 400\n * maxItem=8 - Only eight values will be accepted, more will return error 400\n"
      schema:
        type: array
        default:
        - +name
        items:
          type: string
          maxItems: 8
          enum:
          - -name
          - -address.streetAddress
          - -address.streetAddress2
          - -address.city
          - -address.region
          - -address.country
          - -address.postalCode
          - +name
          - +address.streetAddress
          - +address.streetAddress2
          - +address.city
          - +address.region
          - +address.country
          - +address.postalCode
      example:
      - +name
      style: form
      explode: false
    address.streetAddress2__contains:
      in: query
      name: address.streetAddress2__contains
      description: 'Filter to get the locations whose the address.streetAddress2 contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    address.region__in:
      in: query
      name: address.region__in
      description: Filter to get the locations whose address.region is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    includeForSingle1:
      in: query
      name: include
      description: List of properties that should be included in the response
      schema:
        type: array
        items:
          type: string
          enum:
          - notes
          - address
          - geometry
          - childLocationCount
          - effectivePermissions
          - resourceCounts
          - resourceStatusCounts
          - resourceStatusV2Counts
      style: form
      explode: false
    address.streetAddress:
      in: query
      name: address.streetAddress
      description: Filter to get the locations with the specified address.streetAddress. The lookup is exact and case insensitive
      schema:
        type: string
    address.country:
      in: query
      name: address.country
      description: Filter to get the locations with the specified address.country. The lookup is exact and case insensitive
      schema:
        type: string
    address.region__ne:
      in: query
      name: address.region__ne
      description: Filter to get the locations with an address.region that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    childLocationCount:
      in: query
      name: childLocationCount
      description: Filter to get the locations with the specified number of direct children
      schema:
        type: integer
    id__in1:
      in: query
      name: id__in
      description: Filter to get the locations whose id is on the provided list. The lookup is exact and case insensitive.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    parentId__ne:
      in: query
      name: parentId__ne
      description: Filter to get the locations with the parentId that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        allOf:
        - $ref: '#/components/schemas/id'
    address.city__contains:
      in: query
      name: address.city__contains
      description: 'Filter to get the locations whose the address.city contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    address.postalCode__in:
      in: query
      name: address.postalCode__in
      description: Filter to get the locations whose address.postalCode is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    name__in1:
      in: query
      name: name__in
      description: Filter to get the locations whose name is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    address.postalCode__ne:
      in: query
      name: address.postalCode__ne
      description: Filter to get the locations with an address.postalCode that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    address.streetAddress2__in:
      in: query
      name: address.streetAddress2__in
      description: Filter to get the locations whose address.streetAddress2 is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    address.region__contains:
      in: query
      name: address.region__contains
      description: 'Filter to get the locations whose the address.region contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    pageSize:
      in: query
      name: pageSize
      description: 'The number of entries to return per page. The maximum range of valid page sizes is documented with minimum and  maximum values, but the range might be further limited dynamically based on the requested information, account, and system status. Values outside of the (dynamic) allowed range will not result in an error, but will be clamped to the nearest limit. Thus, logic to detect the last page should not be based on comparing the requested size with the received size, but on the existence of a `nextPageToken` value.

        '
      example: 100
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    address.streetAddress__in:
      in: query
      name: address.streetAddress__in
      description: Filter to get the locations whose address.streetAddress is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    address.region:
      in: query
      name: address.region
      description: Filter to get the locations with the specified address.region. The lookup is exact and case insensitive
      schema:
        type: string
    address.city__ne:
      in: query
      name: address.city__ne
      description: Filter to get the locations with an address.city that is not equal to the provided value. The lookup is exact and case insensitive
      schema:
        type: string
    name1:
      in: query
      name: name
      description: Filter to get the locations with the specified name. The lookup is exact and case insensitive
      schema:
        type: string
    q1:
      in: query
      name: q
      description: 'Text search that is applied to multiple fields. The fields being searched are defined by the backend and can be changed without warning. Example fields being searched: `name`, `id`, `notes`.

        '
      schema:
        type: string
        example: entrance
    address.postalCode__contains:
      in: query
      name: address.postalCode__contains
      description: 'Filter to get the locations whose the address.postalCode contains the provided substring. The lookup is exact and case insensitive

        '
      schema:
        type: string
    address.city__in:
      in: query
      name: address.city__in
      description: Filter to get the locations whose address.city is on the provided list. The lookup is exact and case insensitive
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    includeForList1:
      in: query
      name: include
      description: List of properties that should be included in the response
      schema:
        type: array
        items:
          type: string
          enum:
          - notes
          - address
          - geometry
          - childLocationCount
          - effectivePermissions
          - resourceCounts
          - resourceStatusCounts
          - resourceStatusV2Counts
          - qRelevance
      style: form
      explode: false
    address.streetAddress2:
      in: query
      name: address.streetAddress2
      description: Filter to get the locations with the specified address.streetAddress2. The lookup is exact and case insensitive
      schema:
        type: string
    pageToken:
      in: query
      name: pageToken
      description: 'Token string value that references a page for pagination. This value is received when retrieving the first page in the `nextPageToken` and `prevPageToken` fields.

        When a pageToken is provided, the backend remembers search parameters from the original request, so search  parameters that affect the result set or order are optional and will be ignored if provided. Representation  parameters like `include` should still be applied.

        '
      example: b2Zmc2V0PTEwJmxpbWl0PTEw
      required: false
      schema:
        type: string
  schemas:
    EdgeReportedDeviceStatusCounts:
      type: object
      properties:
        operational:
          type: integer
        disabled:
          type: integer
        unreachable:
          type: integer
        error:
          type: integer
        unknown:
          type: integer
        initializing:
          type: integer
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    PaginatedLocationResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseWithSize'
      - type: object
        properties:
          results:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/LocationGet'
              - $ref: '#/components/schemas/FullTextSearchRelated'
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    PaginatedResponseWithSize:
      description: "Used to wrap results for a paginated response, containing information on how to retrieve further pages and  the total number of results.  \n"
      allOf:
      - $ref: '#/components/schemas/PaginatedResponseNoTotalSize'
      - properties:
          totalSize:
            type: integer
            readOnly: true
            description: 'Size of the total result set.

              '
        required:
        - totalSize
    LocationAddress:
      allOf:
      - type: object
        properties:
          country:
            type: string
