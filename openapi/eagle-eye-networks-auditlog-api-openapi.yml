openapi: 3.2.0
info:
  title: USER & ACCOUNTS Auditlog API
  version: 3.0.0
  description: Auditlog
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Auditlog
  description: Auditlog
paths:
  /auditLogs:
    get:
      tags:
      - Auditlog
      operationId: listAuditlogs
      description: This endpoint filters audit events by userId, targetId, targetType, auditType
      parameters:
      - $ref: '#/components/parameters/include2'
      - $ref: '#/components/parameters/userId1'
      - $ref: '#/components/parameters/targetId'
      - $ref: '#/components/parameters/targetType'
      - $ref: '#/components/parameters/locationId'
      - $ref: '#/components/parameters/auditType'
      - $ref: '#/components/parameters/timestamp__gte'
      - $ref: '#/components/parameters/timestamp__lte'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: List of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvents'
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: List auditlogs
      x-summary-source: derived
