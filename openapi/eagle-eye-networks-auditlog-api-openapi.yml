          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    GenericDetails:
      type: object
      required:
      - type
      - id
      - header
      - rows
      properties:
        type:
          type: string
          enum:
          - details
          description: 'Section type identifier. Currently only ''details'' is supported. Additional section types may be added in the future.

            '
          example: details
        id:
          type: string
          description: 'Machine-readable identifier for this section in camelCase. Should match the corresponding API v3 field name when applicable.

            '
          example: ioOutput1
        header:
          type: string
          description: 'Human-readable section label shown to users, representing a breadcrumb path to the corresponding screen in the web application. Use " - " as a separator for nested screens.

            '
          example: IO - Output 1
        rows:
          type: array
          description: 'List of setting changes or information displayed as rows in a table, each showing a label, current value, and optionally the previous value.

            '
          example:
          - id: turnOnOutput
            label: Turn on output
            value: relay_1
            oldValue: relay_old
          items:
            allOf:
            - $ref: '#/components/schemas/LabelValuePair'
            - type: object
              properties:
                format:
                  type: string
                  enum:
                  - date-time
                  - boolean
                  description: 'Optional format hint for the frontend to properly parse and display the value.


                    * `date-time`: Value is an ISO 8601 timestamp and should be rendered as a formatted date/time.

                    * `boolean`: Value is a boolean toggle (expects "Yes", "True", "No", or "False").

                    '
                  example: date-time
                oldValue:
                  type: string
                  description: 'Previous value of the setting before the change. Only include when there was a previous value (e.g., on updates). Omit for creates or when not applicable. Use empty string "" to represent "no value" rather than null.

                    '
                  example: relay_old
