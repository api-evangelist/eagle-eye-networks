      type: object
      required:
      - userId
      - accountId
      - auditType
      - targetType
      - targetId
      - targetName
      properties:
        timestamp:
          $ref: '#/components/schemas/timestamp'
        userId:
          $ref: '#/components/schemas/userId'
        userName:
          type: string
        userEmail:
          type: string
        accountId:
          $ref: '#/components/schemas/accountId'
        auditType:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        targetName:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: object
          properties:
            browserFamily:
              type: string
            browserVersion:
              type: string
            osFamily:
              type: string
            osVersion:
              type: string
        locationId:
          $ref: '#/components/schemas/LocationId'
        locationName:
          type: string
        dataSchemas:
          type: array
          items:
            type: string
        data:
          type: array
          description: 'Structured audit details organized into sections for data-driven UI rendering. Each section represents a logical grouping of related settings or information, typically corresponding to a page or sub-section in the web application UI. The frontend can display new audit types and details without code changes by rendering these sections as labeled groups with rows of label-value pairs.

            '
          items:
            $ref: '#/components/schemas/GenericDetails'
    LabelValuePair:
      type: object
      description: 'Represents a setting or piece of information displayed in the audit log UI. Each pair contains a human-readable label matching the UI, a machine-readable identifier matching the API field name, and the current value.

        '
      required:
      - id
      - label
      - value
      properties:
        id:
          type: string
          description: 'Machine-readable identifier in camelCase. Should match the corresponding API v3 field name when applicable to make it easy to relate the API and audit log.

            '
          example: turnOnOutput
        label:
          type: string
          description: 'Human-readable label displayed to users in the frontend application UI, matching the label shown in the corresponding settings screen. Should be written in English.

            '
          example: Turn on output
        value:
          type: string
          description: 'Current value of the setting as a string. Use empty string "" to represent "no value" rather than null.

            '
          example: relay_1
    PaginatedResponseNoTotalSize:
      type: object
      description: 'Used to wrap results for a paginated response, containing information on how to retrieve further pages.

        '
      properties:
        nextPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the next page. The value of this token is passed into the field pageToken. This value can be null if there is no next page.

            '
        prevPageToken:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Token to retrieve the previous page. The value of this token is passed into the field pageToken. This value can be null of there is no previous page.

            '
        results:
          type: array
          readOnly: true
          description: The result set from a collection API call.
          items:
            type: object
      required:
      - nextPageToken
      - prevPageToken
      - results
    targetType:
      type: string
      enum:
      - user
      - account
      - device
      - file
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
