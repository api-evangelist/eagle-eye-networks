  parameters:
    timestamp__lte:
      in: query
      name: timestamp__lte
      description: Maximum timestamp to list metrics. Defaults to now.
      schema:
        type: string
        format: date-time
        example: '2023-04-04T11:48:52.000Z'
    eventType:
      in: query
      required: true
      name: eventType
      description: 'The type of event that will be counted. The set of all possible types can be found using the  [`/eventTypes`](https://developer.eagleeyenetworks.com/reference/listeventtypes) API. Only a single event type can be specified.

        '
      schema:
        type: string
        example: een.motionDetectionEvent.v1
    timestamp__gte:
      in: query
      name: timestamp__gte
      description: Minimum timestamp to list metrics. Defaults to 7 days ago.
      schema:
        type: string
        format: date-time
        example: '2023-04-04T09:38:37.372Z'
    aggregateByMinutes:
      in: query
      name: aggregateByMinutes
      description: 'The time interval, in minutes, for grouping the event metrics.  It specifies the granularity of the time buckets used for aggregating event metrics.  It defaults to 60 minutes (1 hour) if not specified.

        '
      schema:
        type: integer
        default: 60
        minimum: 1
        example: 30
    actor1:
      in: query
      required: true
      name: actor
      description: 'The actor for which the metrics are to be retrieved. The actor type has to be prefixed along with actor id like `actorType:actorId`. For example, to get the metrics for camera with id 100d4c41, the actor that has to be used is `camera:100d4c41`.

        '
      schema:
        type: string
        example: camera:100d4c41
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
