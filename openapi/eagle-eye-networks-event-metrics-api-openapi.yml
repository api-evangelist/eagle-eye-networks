openapi: 3.2.0
info:
  title: EVENTS Event Metrics API
  version: 3.0.0
  description: Metrics specific to events
servers:
- url: https://{BaseUrl}/api/v3.0
  description: Eagle Eye Networks API Server
  variables:
    BaseUrl:
      default: api.cxxx.eagleeyenetworks.com
      description: HTTPS Base url to use for all API calls, retrieved from https://api.eagleeyenetworks.com/api/v3.0/clientSettings
security:
- bearerAuth: []
tags:
- name: Event Metrics
  description: Metrics specific to events
paths:
  /eventMetrics:
    get:
      description: Returns metrics data indicating the number of occurrences of a given event over time.
      operationId: getEventMetrics
      parameters:
      - $ref: '#/components/parameters/actor1'
      - $ref: '#/components/parameters/timestamp__lte'
      - $ref: '#/components/parameters/timestamp__gte'
      - $ref: '#/components/parameters/eventType'
      - $ref: '#/components/parameters/aggregateByMinutes'
      tags:
      - Event Metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMetricQueryResponse'
              examples:
                normalEventMetrics:
                  value:
                  - eventType: een.motionDetectionEvent.v1
                    actorId: 100d4c41
                    actorType: camera
                    target: count
                    dataPoints:
                    - - 1450754160000
                      - 22
                    - - 1450754220000
                      - 12
                directionalEventMetrics:
                  value:
                  - eventType: een.objectLineCrossEvent.v1
                    actorId: 100d4c41
                    actorType: camera
                    target: count
                    dataPoints:
                    - - 1450754160000
                      - 22
                    - - 1450754220000
                      - 12
                    data.een.entryDirection.v1.direction: in
                  - eventType: een.objectLineCrossEvent.v1
                    actorId: 100d4c41
                    actorType: camera
                    target: count
                    dataPoints:
                    - - 1450754160000
                      - 22
                    - - 1450754220000
                      - 12
                    data.een.entryDirection.v1.direction: out
        '400':
          $ref: '#/components/responses/validationError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/resourceNotFound'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get event metrics
      x-summary-source: derived
components:
  schemas:
    ErrorInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
        reason:
          description: 'The reason for the error. This is a constant value that identifies the proximate cause of the

            error. Error reasons are unique within a particular domain of errors.

            '
          type: string
          enum:
          - unauthenticated
          - unexpectedArgument
          - missingRequiredArgument
          - wrongArgumentValue
          - invalidPermission
          - wrongEdition
          - wrongAccountType
          - resourceNotFound
          - endpointNotFound
          - methodNotSupported
          - unexpectedError
          - acceptNotSupported
          - alreadyExists
          - foreignKeyConflict
          - childDevicesExist
          - contentNotSupported
          - deadlineExpired
          - tooManyRequests
          - deviceUnavailable
          - serviceUnavailable
          - invalidJSON
          - resourceLocked
          - notSupportedOnBridge
          - outOfRetention
          - deviceIdentificationFailed
          - credentialValidationFailed
          - credentialSetupFailed
          - localUrlValidationFailed
          - hwRegistrationFailed
          - failedAddingCameraAfterValidation
          - neverConnected
          - reconnectFailed
          - unsupportedModel
          - purged
          - userBlocked
          - userTemporarilyBlocked
          - quotaExceeded
          - alreadyValidated
          - reAuthenticationRequired
          - badGateway
        domain:
          description: 'Logical grouping to which the "reason" belongs

            '
          type: string
        metadata:
          $ref: '#/components/schemas/ExceptionMetadata'
    ExceptionDetail:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ErrorInfoExceptionDetail'
      - $ref: '#/components/schemas/BadRequestExceptionDetail'
      - $ref: '#/components/schemas/ResourceInfoExceptionDetail'
      discriminator:
        propertyName: type
        mapping:
          errorInfo: '#/components/schemas/ErrorInfoExceptionDetail'
          badRequest: '#/components/schemas/BadRequestExceptionDetail'
          resourceInfo: '#/components/schemas/ResourceInfoExceptionDetail'
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - errorInfo
          - badRequest
          - resourceInfo
      required:
      - type
    EventMetricQueryResponse:
      type: array
      items:
        type: object
        allOf:
        - $ref: '#/components/schemas/MetricQuery'
        description: A generic schema for all events emitted by the system.
        required:
        - eventType
        - actorId
        - actorType
        - dataPoints
        - target
        properties:
          eventType:
            type: string
            description: The event type for which the metrics was requested.
          actorId:
            type: string
            description: Id of the thing that caused the event ie camera id, user id or account id.
          actorType:
            type: string
            description: Type of actor that caused the event.
            enum:
            - bridge
            - camera
            - speaker
            - account
            - user
            - layout
            - job
          target:
            type: string
            description: The type of the metric.
            example: count
        additionalProperties: true
    ApiV3Error:
      type: object
      properties:
        code:
          description: HTTP code defined in EEN Standard Code Values
          type: integer
        status:
          description: A string enum describing the code
          type: string
          enum:
          - cancelled
          - unknown
          - invalidArgument
          - deadlineExceeded
          - notFound
          - conflict
          - permissionDenied
          - resourceExhausted
          - failedPrecondition
          - aborted
          - outOfRange
          - unimplemented
          - internal
          - unavailable
          - dataLoss
          - unauthenticated
          - mediaTypeNotSupported
          - acceptNotSupported
          - methodNotSupported
          - tooManyRequests
          - badGateway
        message:
          description: Developer friendly human readable error message in English
          type: string
        details:
          description: An array of extensible objects that define error information
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDetail'
      required:
      - code
      - status
      - message
      - details
    MetricQuery:
      type: object
      required:
      - target
      - dataPoints
      properties:
        target:
          type: string
          example: bandwidth
        dataPoints:
          type: array
          example:
          - - 1557385723416
            - 2.5
          - - 1557385731634
            - 3.5
          items:
            type: array
            description: 'First value is unix timestamp in milliseconds. Second value is Metric value as a float.

              '
            minItems: 2
            maxItems: 2
            items:
              type: number
    BadRequestExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - badRequest
        argumentViolations:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentViolation'
    ResourceInfoExceptionDetail:
      properties:
        type:
          description: A string enum describing the type of detail object.
          type: string
          enum:
          - resourceInfo
        resource:
          description: Referenced resource type, eg "cameras", "bridges", or "locations".
          type: string
        ids:
          type: array
          description: Identities of resources
          items:
            type: string
    ArgumentViolation:
      properties:
        argumentName:
          type: string
          description: Name of the argument
        description:
          type: string
          description: Description of the violation
    ExceptionMetadata:
      properties:
        path:
          description: Path of the request
          type: string
        method:
          description: Method of the request
          type: string
