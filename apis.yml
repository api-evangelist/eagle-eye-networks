aid: eagle-eye-networks

name: Eagle Eye Networks

description: Eagle Eye Networks is a cloud video surveillance and video management system (VMS) provider whose Video API Platform (v3) exposes
  REST APIs for managing bridges, cameras, speakers, switches and multi-cameras; streaming live and recorded video (HLS, RTSP, MP4, WebRTC two-way
  audio); archiving, exporting and downloading media; locations, floors, floor plans and layouts; events, alerts, notifications and automations;
  video analytics deep search, license plate recognition (LPR) and vehicle surveillance; and account, user, role, application and OAuth client
  management. Authentication is OAuth 2.0 (authorization code, client credentials, refresh token, device code) issued from auth.eagleeyenetworks.com,
  and the platform ships first-party SDKs (Android/iOS/Web video, two-way audio), an een CLI, webhook event subscriptions and an llms.txt for
  agent consumption.

